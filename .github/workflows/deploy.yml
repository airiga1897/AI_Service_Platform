# Workflow CI «Deploy».
#
# Preflight + guarded rollout. Фактический SSH-деплой включён только для
# ai-retail-dev / preprod. Остальные комбинации instance/environment
# завершаются с явным сообщением, что rollout намеренно отключён.
#
# Поля description инпутов workflow_dispatch оставлены на английском —
# значения options — машинные идентификаторы.

name: Deploy

concurrency:
  group: deploy-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.instance || inputs.instance }}-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.environment || inputs.environment }}
  cancel-in-progress: false

on:
  repository_dispatch:
    types:
      - mycleanbot-image-published
  workflow_dispatch:
    inputs:
      instance:
        description: Runtime instance to deploy
        required: true
        type: choice
        options:
          - aromaflow-work
          - aromaflow-demo
          - ai-retail-mvp
          - ai-retail-dev
          - mycleanbot
      environment:
        description: Deploy environment
        required: true
        type: choice
        options:
          - preprod
          - prod
      image_ref:
        description: Immutable container image ref to deploy
        required: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      deploy_metadata: ${{ steps.preflight.outputs.metadata }}
    steps:
      - uses: actions/checkout@v5

      - name: Установка Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Установка Python-зависимостей
        run: python -m pip install --upgrade pip pyyaml jinja2

      - name: Проверка репозитория (make check)
        run: make check

      - name: Deploy preflight
        id: preflight
        env:
          DEPLOY_INSTANCE: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.instance || inputs.instance }}
          DEPLOY_ENVIRONMENT: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.environment || inputs.environment }}
          DEPLOY_IMAGE_REF: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.image_ref || inputs.image_ref }}
        run: |
          python tools/deploy/preflight.py \
            --instance "${DEPLOY_INSTANCE}" \
            --environment "${DEPLOY_ENVIRONMENT}" \
            --image-ref "${DEPLOY_IMAGE_REF}" \
            > preflight.json
          echo "metadata<<EOF" >> "$GITHUB_OUTPUT"
          cat preflight.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Публикация preflight JSON
        uses: actions/upload-artifact@v6
        with:
          name: deploy-preflight
          path: preflight.json

  unsupported-rollout:
    needs: preflight
    runs-on: ubuntu-latest
    if: >-
      ${{
        !(
          (inputs.instance == 'ai-retail-dev' && inputs.environment == 'preprod') ||
          (inputs.instance == 'mycleanbot' && inputs.environment == 'prod') ||
          (
            github.event_name == 'repository_dispatch' &&
            github.event.client_payload.instance == 'mycleanbot' &&
            github.event.client_payload.environment == 'prod'
          )
        )
      }}
    steps:
      - name: Проверка разрешённого rollout
        run: |
          echo "This instance/environment rollout is not enabled."
          exit 1

  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    if: ${{ inputs.instance == 'ai-retail-dev' && inputs.environment == 'preprod' }}
    environment:
      name: ai-retail-dev-preprod
    steps:
      - uses: actions/checkout@v5

      - name: Скачать preflight JSON
        uses: actions/download-artifact@v7
        with:
          name: deploy-preflight

      - name: Guarded SSH deploy (требуются secrets)
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
          DEPLOY_DIR: ${{ fromJson(needs.preflight.outputs.deploy_metadata).deploy_dir }}
          COMPOSE_FILE: ${{ fromJson(needs.preflight.outputs.deploy_metadata).compose_file }}
          ENV_FILE: ${{ fromJson(needs.preflight.outputs.deploy_metadata).env_file }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          echo "Resolved deploy metadata:"
          cat preflight.json
          if [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_USER:-}" ] || [ -z "${SSH_KEY:-}" ]; then
            echo "SSH deploy skipped: set SSH_HOST, SSH_USER, and SSH_KEY in GitHub Environment secrets."
            echo "When secrets are present, the steps below will run on the target host:"
            echo "  1. Copy/render compose file: ${COMPOSE_FILE}"
            echo "  2. Export IMAGE_REF=${IMAGE_REF}"
            echo "  3. docker compose -f ... pull"
            echo "  4. docker compose -f ... up -d"
            echo "  5. tools/healthcheck/ against the instance"
            exit 0
          fi
          SSH_PORT="${SSH_PORT:-22}"
          mkdir -p deploy-bundle
          cp "${COMPOSE_FILE}" deploy-bundle/docker-compose.yml
          python - <<'PY'
          import os
          from pathlib import Path

          compose_path = Path("deploy-bundle/docker-compose.yml")
          env_file = os.environ["ENV_FILE"]
          text = compose_path.read_text(encoding="utf-8")
          text = text.replace(f"../../{env_file}", env_file)
          compose_path.write_text(text, encoding="utf-8")

          deploy_env = Path("deploy-bundle/.env.deploy")
          deploy_env.write_text(
              f"AI_RETAIL_DEV_WEB_IMAGE={os.environ['IMAGE_REF']}\n",
              encoding="utf-8",
          )
          PY

          install -m 700 -d ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/ai-service-platform-deploy
          chmod 600 ~/.ssh/ai-service-platform-deploy
          ssh-keyscan -p "${SSH_PORT}" -H "${SSH_HOST}" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/ai-service-platform-deploy -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "mkdir -p '${DEPLOY_DIR}'"
          scp -i ~/.ssh/ai-service-platform-deploy -P "${SSH_PORT}" \
            deploy-bundle/docker-compose.yml deploy-bundle/.env.deploy \
            "${SSH_USER}@${SSH_HOST}:${DEPLOY_DIR}/"
          ssh -i ~/.ssh/ai-service-platform-deploy -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "test -f '${DEPLOY_DIR}/${ENV_FILE}'"
          ssh -i ~/.ssh/ai-service-platform-deploy -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "cd '${DEPLOY_DIR}' && docker compose --env-file .env.deploy -f docker-compose.yml config >/tmp/ai-retail-dev-preprod.compose.yml"
          echo "Remote predeploy passed: compose bundle uploaded and docker compose config succeeded."

      - name: Post-deploy healthcheck (локально из репозитория)
        if: success()
        run: |
          echo "Post-deploy healthcheck is intentionally deferred until pull/up is enabled."
          echo "This milestone validates SSH access and docker compose config only."

  deploy-mycleanbot:
    needs: preflight
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        inputs.instance == 'mycleanbot' &&
        inputs.environment == 'prod'
      }}
    environment:
      name: mycleanbot-prod
    steps:
      - uses: actions/checkout@v5

      - name: Скачать preflight JSON
        uses: actions/download-artifact@v7
        with:
          name: deploy-preflight

      - name: Migrate and deploy MyCleanBot
        env:
          IMAGE_REF: ${{ fromJson(needs.preflight.outputs.deploy_metadata).image_ref }}
          DEPLOY_DIR: ${{ fromJson(needs.preflight.outputs.deploy_metadata).deploy_dir }}
          COMPOSE_FILE: ${{ fromJson(needs.preflight.outputs.deploy_metadata).compose_file }}
          ENV_FILE: ${{ fromJson(needs.preflight.outputs.deploy_metadata).env_file }}
          PUBLIC_ENV_FILE: ${{ fromJson(needs.preflight.outputs.deploy_metadata).public_env_file }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          MASTER_ENCRYPTION_KEY: ${{ secrets.MASTER_ENCRYPTION_KEY }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -euo pipefail
          test -n "${SSH_HOST:-}" && test -n "${SSH_USER:-}" && test -n "${SSH_KEY:-}"
          test -n "${SSH_KNOWN_HOSTS:-}"
          test -n "${GHCR_USERNAME:-}" && test -n "${GHCR_TOKEN:-}"
          test -n "${PUBLIC_ENV_FILE:-}"
          SSH_PORT="${SSH_PORT:-22}"

          mkdir -p deploy-bundle
          cp "${COMPOSE_FILE}" deploy-bundle/docker-compose.yml
          sed -i "s#../../${ENV_FILE}#${ENV_FILE}#g" deploy-bundle/docker-compose.yml
          cp "$(dirname "${COMPOSE_FILE}")/${PUBLIC_ENV_FILE}" \
            "deploy-bundle/${PUBLIC_ENV_FILE}"
          cp tools/deploy/mycleanbot_remote.sh deploy-bundle/
          chmod 755 deploy-bundle/mycleanbot_remote.sh
          python - <<'PY'
          import os
          from pathlib import Path

          names = (
              "DATABASE_URL",
              "DJANGO_SECRET_KEY",
              "MASTER_ENCRYPTION_KEY",
              "TELEGRAM_API_ID",
              "TELEGRAM_API_HASH",
          )
          values = {}
          for name in names:
              value = os.environ.get(name, "")
              if not value or "\n" in value or "\r" in value:
                  raise SystemExit(f"{name} must be a non-empty single-line Environment secret")
              values[name] = value
          target = Path("deploy-bundle") / os.environ["ENV_FILE"]
          target.write_text(
              "".join(f"{name}={values[name]}\n" for name in names),
              encoding="utf-8",
          )
          target.chmod(0o600)
          PY

          install -m 700 -d ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/ai-service-platform-deploy
          chmod 600 ~/.ssh/ai-service-platform-deploy
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh -i ~/.ssh/ai-service-platform-deploy -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "mkdir -p '${DEPLOY_DIR}'"
          scp -i ~/.ssh/ai-service-platform-deploy -P "${SSH_PORT}" \
            deploy-bundle/docker-compose.yml "deploy-bundle/${PUBLIC_ENV_FILE}" \
            deploy-bundle/mycleanbot_remote.sh \
            "${SSH_USER}@${SSH_HOST}:${DEPLOY_DIR}/"
          scp -i ~/.ssh/ai-service-platform-deploy -P "${SSH_PORT}" \
            "deploy-bundle/${ENV_FILE}" \
            "${SSH_USER}@${SSH_HOST}:${DEPLOY_DIR}/${ENV_FILE}.new"
          ssh -i ~/.ssh/ai-service-platform-deploy -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "install -m 600 '${DEPLOY_DIR}/${ENV_FILE}.new' '${DEPLOY_DIR}/${ENV_FILE}' && rm -f '${DEPLOY_DIR}/${ENV_FILE}.new'"
          printf '%s' "${GHCR_TOKEN}" | \
            ssh -i ~/.ssh/ai-service-platform-deploy -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "cd '${DEPLOY_DIR}' && GHCR_USERNAME='${GHCR_USERNAME}' DEPLOY_DIR='${DEPLOY_DIR}' ENV_FILE='${ENV_FILE}' CONFIG_FILE='${PUBLIC_ENV_FILE}' ./mycleanbot_remote.sh deploy '${IMAGE_REF}'"

      - name: Verify MyCleanBot health
        env:
          DEPLOY_DIR: ${{ fromJson(needs.preflight.outputs.deploy_metadata).deploy_dir }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          ssh -i ~/.ssh/ai-service-platform-deploy -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "cd '${DEPLOY_DIR}' && ./mycleanbot_remote.sh verify"

  mycleanbot-awaiting-manual-approval:
    needs: preflight
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'repository_dispatch' &&
        github.event.client_payload.instance == 'mycleanbot' &&
        github.event.client_payload.environment == 'prod'
      }}
    steps:
      - name: Record deployment candidate
        env:
          IMAGE_REF: ${{ fromJson(needs.preflight.outputs.deploy_metadata).image_ref }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import re

          source_sha = os.environ.get("SOURCE_SHA", "")
          if re.fullmatch(r"[0-9a-f]{40}", source_sha) is None:
              raise SystemExit("source_sha must be a 40-character lowercase hex SHA")
          with open("mycleanbot-candidate.json", "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "instance": "mycleanbot",
                      "environment": "prod",
                      "image_ref": os.environ["IMAGE_REF"],
                      "source_sha": source_sha,
                      "rollout": "manual-workflow-dispatch-required",
                  },
                  handle,
                  indent=2,
                  sort_keys=True,
              )
              handle.write("\n")
          PY
          {
            echo "## MyCleanBot deployment candidate"
            echo
            echo "Preflight passed for \`${IMAGE_REF}\`."
            echo "An operator must start the Deploy workflow manually with:"
            echo
            echo "- instance: \`mycleanbot\`"
            echo "- environment: \`prod\`"
            echo "- image_ref: \`${IMAGE_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish candidate receipt
        uses: actions/upload-artifact@v6
        with:
          name: mycleanbot-deployment-candidate
          path: mycleanbot-candidate.json
