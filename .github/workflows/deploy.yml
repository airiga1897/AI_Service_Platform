name: Deploy Skeleton

on:
  workflow_dispatch:
    inputs:
      instance:
        description: Runtime instance to deploy
        required: true
        type: choice
        options:
          - aromaflow-work
          - aromaflow-demo
          - ai-retail-mvp
          - ai-retail-dev
      image_ref:
        description: Container image ref to deploy
        required: true
      target_vps:
        description: Target VPS role
        required: true
        type: choice
        options:
          - VPS1
          - VPS2
          - VPS3

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dry-run only
        run: |
          echo "Deploy is not enabled yet."
          echo "instance=${{ inputs.instance }}"
          echo "image_ref=${{ inputs.image_ref }}"
          echo "target_vps=${{ inputs.target_vps }}"
