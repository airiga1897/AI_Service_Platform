# Workflow CI «Deploy Skeleton».
#
# Каркас пайплайна деплоя. Реальный деплой пока не подключён —
# job выполняет только dry-run и логирует выбранные параметры.
# Логика деплоя добавляется отдельным runbook'ом и кодом.
#
# Имена шагов (`name:`) — на русском. Поля `description:` для
# инпутов `workflow_dispatch` оставлены на английском, потому что
# их значения (`options:`) — английские идентификаторы инстансов и
# VPS, и UI GitHub показывает их рядом с описанием.
# Имя самого workflow (`Deploy Skeleton`) — английский идентификатор
# в GitHub UI, не переводится.

name: Deploy Skeleton

on:
  workflow_dispatch:
    inputs:
      instance:
        description: Runtime instance to deploy
        required: true
        type: choice
        options:
          - aromaflow-work
          - aromaflow-demo
          - ai-retail-mvp
          - ai-retail-dev
      image_ref:
        description: Container image ref to deploy
        required: true
      target_vps:
        description: Target VPS role
        required: true
        type: choice
        options:
          - VPS1
          - VPS2
          - VPS3

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Только dry-run (реальный деплой ещё не подключён)
        run: |
          echo "Deploy is not enabled yet."
          echo "instance=${{ inputs.instance }}"
          echo "image_ref=${{ inputs.image_ref }}"
          echo "target_vps=${{ inputs.target_vps }}"
