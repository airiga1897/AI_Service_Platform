name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pyyaml jinja2

      - name: Validate repository layout
        run: |
          test -f services.yml
          test -f README.md
          test -d infra/stacks/aromaflow-work
          test -d infra/stacks/aromaflow-demo
          test -d infra/stacks/ai-retail-mvp
          test -d infra/stacks/ai-retail-dev
          test -d infra/edge/softether

      - name: Validate services registry
        run: make validate

      - name: Render-compose drift check
        run: make render-check

      - name: Run smoke tests
        run: make test
