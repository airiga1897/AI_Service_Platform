# Локальные pre-commit хуки.
#
# Зачем: до пуша прогнать те же проверки, что выполняет CI
# (`.github/workflows/validate.yml` / `make check`). Это короче
# обратная связь и меньше «красных» CI-запусков.
#
# Конвенция расширения: проектная конвенция yaml-файлов — `.yml`,
# но имя `.pre-commit-config.yaml` оставлено по умолчанию утилиты
# `pre-commit`. Смена расширения требует флага `--config` в каждом
# вызове и ломает интеграции (включая отчёт статуса в GitHub UI).
# Это единственный обоснованный `.yaml` в нашей зоне ответственности.
#
# Идентификаторы (`id:`), команды (`entry:`), regex (`files:`) и
# `stages:` остаются на английском — это машинно-читаемые поля.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]

  - repo: local
    hooks:
      - id: validate-services-yml
        name: Валидация services.yml
        entry: python3 tools/validate-services-yml/validate_services_yml.py
        language: system
        files: ^(services\.yml|tools/validate-services-yml/.*)$
        pass_filenames: false

      - id: render-compose-check
        name: Проверка дрейфа render-compose
        entry: python3 tools/render-compose/render_compose.py --stack all --check
        language: system
        files: ^(services\.yml|tools/render-compose/.*|tools/_lib/.*|infra/stacks/.*)$
        pass_filenames: false

      - id: render-edge-check
        name: Проверка дрейфа render-edge
        entry: python3 tools/render-edge/render_edge.py --check
        language: system
        files: ^(services\.yml|tools/render-edge/.*|tools/_lib/.*|infra/edge/haproxy/haproxy\.cfg|infra/edge/nginx/sites/.*)$
        pass_filenames: false

      - id: python-tests
        name: Smoke-тесты (validator / render-compose / render-edge / healthcheck / deploy)
        entry: bash -c 'python3 -m unittest discover -s tools/validate-services-yml/tests -t . && python3 -m unittest discover -s tools/render-compose/tests -t . && python3 -m unittest discover -s tools/render-edge/tests -t . && python3 -m unittest discover -s tools/healthcheck/tests -t . && python3 -m unittest discover -s tools/deploy/tests -t .'
        language: system
        files: ^(services\.yml|tools/.*)$
        pass_filenames: false
        stages: [pre-push]
