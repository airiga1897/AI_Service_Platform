---
# Переменные VPS2 — Горячий резерв (hot standby) + Бэкапы

# --- Тип резерва ---
standby_mode: hot           # hot = PostgreSQL streaming replication работает постоянно

# --- Директории ---
backup_dir: /opt/backups
app_dir: /opt/mypet01

# --- Хранение бэкапов ---
backup_retention_days: 7    # хранить 7 дней локально

# --- Uptime Kuma ---
uptime_kuma_port: 3001
uptime_kuma_data: /opt/uptime-kuma

# --- PostgreSQL Streaming Replication ---
pg_replication_user: replicator
pg_primary_host: "{{ groups['prod'][0] }}"
pg_primary_port: 5432
pg_replication_slot: vps2_replica

# --- Rsync медиафайлов (каждые 10 минут) ---
media_rsync_interval_minutes: 10
media_src: "{{ hostvars[groups['prod'][0]]['app_dir'] | default('/opt/mypet01') }}/media/"
media_dst: "{{ app_dir }}/media/"

# --- rsync: разрешённые источники ---
rsync_allowed_hosts:
  - "{{ hostvars[groups['prod'][0]]['ansible_host'] | default(groups['prod'][0]) }}"
  - "{{ hostvars[groups['management'][0]]['ansible_host'] | default(groups['management'][0]) }}"

# --- Prometheus exporter ---
node_exporter_port: 9100
postgres_exporter_port: 9187
