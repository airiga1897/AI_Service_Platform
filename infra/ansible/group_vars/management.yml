---
# Переменные VPS3 — Управление

# Ansible
ansible_control_dir: /opt/ansible

# Prometheus + Grafana
prometheus_port: 9090
grafana_port: 3000
alertmanager_port: 9093
loki_port: 3100
monitoring_dir: /opt/monitoring
prometheus_retention: "30d"

# Grafana
grafana_admin_password: "{{ vault_grafana_password }}"

# GeoIP update
geoip_script_dir: /opt/scripts
geoip_update_cron: "0 3 * * 0"   # каждое воскресенье в 3:00

# Prometheus exporter
node_exporter_port: 9100

# Ansible Semaphore — веб-GUI
semaphore_dir:          /opt/semaphore
semaphore_playbook_dir: /opt/ansible
semaphore_port:         3001
semaphore_admin_user:   "{{ vault_semaphore_admin_user }}"
semaphore_admin_password: "{{ vault_semaphore_admin_password }}"
semaphore_admin_email:  "{{ vault_semaphore_admin_email }}"
semaphore_secret_key:       "{{ vault_semaphore_secret_key }}"
semaphore_cookie_hash:      "{{ vault_semaphore_cookie_hash }}"
semaphore_cookie_encryption: "{{ vault_semaphore_cookie_encryption }}"

# S3 (провайдер TBD — заполнить перед запуском)
s3_endpoint: ""            # например: https://s3.selcdn.ru
s3_bucket: ""              # название бакета
s3_access_key: "{{ vault_s3_access_key }}"
s3_secret_key: "{{ vault_s3_secret_key }}"
s3_retention_days: 30
