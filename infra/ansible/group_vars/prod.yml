---
# Переменные группы prod (VPS1 — продакшн).
#
# Базовая параметризация приложения (`app_name`, `app_dir`, `app_image`
# и т.д.) объявлена в `all.yml` как placeholder. Конкретные значения
# выставляются через `host_vars/<host>.yml` (см.
# `host_vars/aromaflow-work.yml.example`) или через `--extra-vars`.

# --- Docker Compose ---
compose_file: docker-compose.prod.yml

# --- GeoIP (обновление через cron) ---
geoip_update_cron: "0 3 * * 0"   # каждое воскресенье в 3:00

# --- Prometheus exporters (порты) ---
node_exporter_port: 9100
postgres_exporter_port: 9187
nginx_exporter_port: 9113
haproxy_exporter_port: 9101

# --- S3 (используется backup.py — заполнить перед запуском) ---
s3_endpoint: ""            # например: https://s3.selcdn.ru
s3_bucket: ""              # название бакета
s3_access_key: "{{ vault_s3_access_key }}"
s3_secret_key: "{{ vault_s3_secret_key }}"
s3_retention_days: 30
