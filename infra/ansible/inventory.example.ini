# AI Service Platform Ansible inventory example.
#
# Generate the real inventory on the control/orchestration node with:
#
#   sudo bash tools/bootstrap/create_inventory.sh \
#     --nodes-file /opt/ai-service-platform/operator/nodes.csv \
#     --state-file /opt/ai-service-platform/operator/state.csv \
#     --include vps1,vps2,vps3
#
# Do not commit inventory.ini with real IP addresses or DNS names. The source
# nodes.csv may contain temporary root_password values before bootstrap.
# state.csv describes active/candidate/old role and service placement.
# Both real CSV files must remain operator-local.

[prod]
# Active production node from state.csv.
vps1 ansible_host=<VPS1_PUBLIC_IP_OR_DNS> ansible_user=ansible ansible_ssh_private_key_file=/home/ansible/.ssh/ansible_control

[backup]
# Active preprod/backup node from state.csv.
vps2 ansible_host=<VPS2_PUBLIC_IP_OR_DNS> ansible_user=ansible ansible_ssh_private_key_file=/home/ansible/.ssh/ansible_control

[management]
# Active orchestration node from state.csv.
vps3 ansible_connection=local

[vpn_edges]
# Service group generated from state.csv row `service,vpn`.
vps1 ansible_host=<VPS1_PUBLIC_IP_OR_DNS> ansible_user=ansible ansible_ssh_private_key_file=/home/ansible/.ssh/ansible_control
vps2 ansible_host=<VPS2_PUBLIC_IP_OR_DNS> ansible_user=ansible ansible_ssh_private_key_file=/home/ansible/.ssh/ansible_control
vps3 ansible_connection=local

[candidate_prod]
# Example production candidate during provider/region migration.
# vps_de_new_01 ansible_host=<CANDIDATE_PUBLIC_IP_OR_DNS> ansible_user=ansible ansible_ssh_private_key_file=/home/ansible/.ssh/ansible_control

[old_prod]
# Example old production-runtime node kept during rollback window.
# vps_nl_qupra_01 ansible_host=<OLD_PUBLIC_IP_OR_DNS> ansible_user=ansible ansible_ssh_private_key_file=/home/ansible/.ssh/ansible_control

[platform_nodes:children]
prod
backup
management
vpn_edges

[all:vars]
ansible_python_interpreter=/usr/bin/python3
