# AI Service Platform Ansible inventory example.
#
# Generate real inventory from GitHub Environment secrets or a local encrypted
# source. Do not commit inventory.ini with real IP addresses.

[prod]
# VPS1: production runtime. Initial production stack: aromaflow-work.
YOUR_VPS1_IP ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa

[backup]
# VPS2: preprod, hot standby, local backup target, and failover target.
YOUR_VPS2_IP ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa

[management]
# VPS3: Ansible control node, monitoring, and orchestration.
YOUR_VPS3_IP ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa

[all:vars]
ansible_python_interpreter=/usr/bin/python3
