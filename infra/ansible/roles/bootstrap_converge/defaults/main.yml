---
bootstrap_converge_deploy_user: depuser
bootstrap_converge_admin_user: useradmin
bootstrap_converge_ansible_user: ansible
bootstrap_converge_deploy_dir: /opt/stacks
bootstrap_converge_authorized_keys_file: ""
bootstrap_converge_base_packages:
  - sudo
  - openssh-client
  - curl
  - ca-certificates
  - gnupg
  - lsb-release
  - ufw
bootstrap_converge_firewall_enabled: true
bootstrap_converge_firewall_allowed_tcp_ports:
  - 22
  - 80
  - 443
  - 992
  - 5555
  - 8443
  - 8555
  - 8992
  - 25565
  - 25575
