    cmd: docker port "{{ edge_haproxy_container_name }}"
  register: edge_haproxy_docker_ports
  changed_when: false
  failed_when: >
    ('443/tcp' not in edge_haproxy_docker_ports.stdout)
    or ('992/tcp' not in edge_haproxy_docker_ports.stdout)
    or ('5555/tcp' not in edge_haproxy_docker_ports.stdout)
  when:
