- name: Verify cascade SNI surface is absent when vpn_cascade route is disabled
  ansible.builtin.shell: |
    set -euo pipefail
    ! docker exec "{{ edge_haproxy_container_name }}" grep -nE 'is_cascade|be_cascade' /usr/local/etc/haproxy/haproxy.cfg
  args:
