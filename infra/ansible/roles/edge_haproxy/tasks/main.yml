- name: Validate edge_haproxy config
  ansible.builtin.command:
    cmd: docker run --rm -v "{{ edge_haproxy_config_dir }}:/usr/local/etc/haproxy:ro" "{{ edge_haproxy_image }}" haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg
  changed_when: false
  when:
    - edge_haproxy_state == 'present'
    - not ansible_check_mode

- name: Inspect existing edge_haproxy container status before start
  ansible.builtin.command:
    cmd: docker inspect -f {% raw %}'{{.State.Status}}'{% endraw %} "{{ edge_haproxy_container_name }}"
  register: edge_haproxy_existing_status
  changed_when: false
  failed_when: false
  when:
    - edge_haproxy_state == 'present'
    - not ansible_check_mode

- name: Remove stale edge_haproxy admin socket before container start
  ansible.builtin.file:
    path: "{{ edge_haproxy_run_dir }}/admin.sock"
    state: absent
  when:
    - edge_haproxy_state == 'present'
    - not ansible_check_mode
    - >
      (edge_haproxy_existing_status.rc | default(1)) != 0
      or (edge_haproxy_existing_status.stdout | default('') | trim) != 'running'
      or (edge_haproxy_compose_template.changed | default(false))

- name: Start edge_haproxy container
  ansible.builtin.command:
    cmd: docker compose -f "{{ edge_haproxy_compose_file }}" up -d
    chdir: "{{ edge_haproxy_root_dir }}"
  register: edge_haproxy_compose_up
  changed_when: >
    (edge_haproxy_compose_up.stdout ~ edge_haproxy_compose_up.stderr)
    is search('(?i)(creating|created|recreating|recreated|starting|started|pulling|pulled|building|built)')
  when:
    - edge_haproxy_state == 'present'
    - not ansible_check_mode

- name: Remove stale edge_haproxy admin socket before runtime-file restart
  ansible.builtin.file:
    path: "{{ edge_haproxy_run_dir }}/admin.sock"
    state: absent
  when:
    - edge_haproxy_state == 'present'
    - not ansible_check_mode
    - not edge_haproxy_compose_up.changed
    - >
      (edge_haproxy_vpn_mgmt_ips_copy.changed | default(false))
      or (edge_haproxy_vpn_mgmt_ips_empty.changed | default(false))
      or (edge_haproxy_blocked_ips_copy.changed | default(false))
      or (edge_haproxy_blocked_ips_empty.changed | default(false))
      or (edge_haproxy_generated_blocked_ips_seed.changed | default(false))
      or (edge_haproxy_ru_networks_copy.changed | default(false))
      or (edge_haproxy_ru_networks_empty.changed | default(false))
      or (edge_haproxy_config_template.changed | default(false))

- name: Restart edge_haproxy when bind-mounted runtime files changed
  ansible.builtin.command:
    cmd: docker compose -f "{{ edge_haproxy_compose_file }}" restart "{{ edge_haproxy_container_name }}"
    chdir: "{{ edge_haproxy_root_dir }}"
  changed_when: true
  when:
    - edge_haproxy_state == 'present'
    - not ansible_check_mode
    - not edge_haproxy_compose_up.changed
    - >
      (edge_haproxy_vpn_mgmt_ips_copy.changed | default(false))
      or (edge_haproxy_vpn_mgmt_ips_empty.changed | default(false))
      or (edge_haproxy_blocked_ips_copy.changed | default(false))
      or (edge_haproxy_blocked_ips_empty.changed | default(false))
      or (edge_haproxy_generated_blocked_ips_seed.changed | default(false))
      or (edge_haproxy_ru_networks_copy.changed | default(false))
      or (edge_haproxy_ru_networks_empty.changed | default(false))
      or (edge_haproxy_config_template.changed | default(false))

- name: Verify running edge_haproxy container network attachment
  ansible.builtin.shell: |
    set -euo pipefail
    docker inspect "{{ edge_haproxy_container_name }}" | python3 -c 'import json, os, sys; data = json.load(sys.stdin)[0]; network = os.environ["EXPECTED_NETWORK"]; expected_ip = os.environ["EXPECTED_IP"]; actual_ip = data.get("NetworkSettings", {}).get("Networks", {}).get(network, {}).get("IPAddress"); running = data.get("State", {}).get("Running"); sys.exit(0 if running and actual_ip == expected_ip else 1)'
  args:
