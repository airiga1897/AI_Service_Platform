    name: docker
    state: started
    enabled: true
  when:
    - edge_haproxy_state == 'absent'
    - edge_haproxy_compose_stat.stat.exists | default(false)
    - not ansible_check_mode

- name: Verify Docker Compose plugin is available before stopping edge_haproxy
  ansible.builtin.command:
    cmd: docker compose version
  changed_when: false
  when:
    - edge_haproxy_state == 'absent'
    - edge_haproxy_compose_stat.stat.exists | default(false)
