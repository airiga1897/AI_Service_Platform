- name: Remove empty legacy SoftEther P2P Docker networks that overlap canonical L3 VPS routes
  ansible.builtin.shell: |
    set -euo pipefail
    desired_transport_name="{{ edge_haproxy_p2p_network_name }}"
    desired_transport_subnet="{{ edge_haproxy_p2p_network_subnet }}"
    desired_management_name="{{ edge_haproxy_p2p_management_network_name }}"
    desired_management_subnet="{{ edge_haproxy_p2p_management_network_subnet }}"
    for name in ai_service_softether_p2p_pg48_transport ai_service_softether_p2p_pg48_mgmt ai_service_softether_p2p ai_service_softether_p2p_services ai_service_softether_l3; do
      case "$name" in
        "$desired_transport_name"|"$desired_management_name") continue ;;
      esac
      current="$(docker network inspect -f {% raw %}'{{ (index .IPAM.Config 0).Subnet }}'{% endraw %} "$name" 2>/dev/null || true)"
      [ -n "$current" ] || continue
      if [ "$current" != "$desired_transport_subnet" ] && [ "$current" != "$desired_management_subnet" ]; then
        continue
      fi
      count="$(docker network inspect -f {% raw %}'{{ len .Containers }}'{% endraw %} "$name")"
      if [ "$count" = "0" ]; then
        docker network rm "$name"
        echo "removed empty legacy softether p2p network $name ($current)"
      else
        echo "legacy softether p2p network overlaps desired subnet but still has $count endpoint(s): $name" >&2
        docker network inspect -f {% raw %}'{{ range $id, $c := .Containers }}{{ $c.Name }} {{ end }}'{% endraw %} "$name" >&2 || true
        exit 1
      fi
    done
  args:
    executable: /bin/bash
  register: edge_haproxy_legacy_p2p_network_cleanup
  changed_when: >
    (edge_haproxy_legacy_p2p_network_cleanup.stdout | default(''))
    is search('removed empty legacy softether p2p network')
  when:
    - edge_haproxy_state == 'present'
    - edge_haproxy_route_model.softether_l3_vps_enabled | default(false)
    - not ansible_check_mode

- name: Ensure SoftEther P2P Docker network exists for HAProxy route
  ansible.builtin.shell: |
    set -euo pipefail
    name="{{ edge_haproxy_p2p_network_name }}"
    subnet="{{ edge_haproxy_p2p_network_subnet }}"
    current="$(docker network inspect -f {% raw %}'{{ (index .IPAM.Config 0).Subnet }}'{% endraw %} "$name" 2>/dev/null || true)"
    if [ -n "$current" ] && [ "$current" != "$subnet" ]; then
      if [ -f "{{ edge_haproxy_compose_file }}" ]; then
        docker compose -f "{{ edge_haproxy_compose_file }}" down
      fi
      docker network rm "$name"
      echo "removed mismatched edge_haproxy p2p network $name ($current != $subnet)"
      current=""
    fi
    if [ -z "$current" ]; then
      docker network create --subnet "$subnet" "$name"
      echo "created edge_haproxy p2p network $name ($subnet)"
    else
      echo "edge_haproxy p2p network already exists: $name ($current)"
    fi
  args:
    executable: /bin/bash
  register: edge_haproxy_p2p_network_create
  changed_when: >
    (edge_haproxy_p2p_network_create.stdout | default(''))
    is search('(?i)(created edge_haproxy p2p network|removed mismatched edge_haproxy p2p network)')
  when:
    - edge_haproxy_state == 'present'
    - edge_haproxy_route_model.softether_l3_vps_enabled | default(false)
    - not ansible_check_mode

- name: Ensure SoftEther P2P management Docker network exists for HAProxy route
