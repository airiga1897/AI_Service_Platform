- name: Configure platform_router SoftEther client sidecar
  ansible.builtin.shell: |
    set -euo pipefail
    umask 077
    router_container="{{ platform_router_model.container_name }}"
    client_container="{{ item.container_name }}"
    timeout_s="{{ item.vpncmd_timeout_seconds }}"
    account="{{ item.account_name }}"
    nic="{{ item.nic_name }}"
    iface="{{ item.iface }}"
    server="{{ item.server }}"
    hub="{{ item.hub }}"
    client_ip="{{ item.client_ip }}"
    prefix="{{ item.prefixlen }}"
    user="${CLIENT_USER}"
    password="${CLIENT_PASSWORD}"
    status_file="/tmp/platform-router-client-config-{{ item.name }}.status"

    set_phase() {
      printf '%s\n' "$1" > "$status_file"
    }
    set_phase starting

    cleanup_vpncmd() {
      docker exec "$client_container" sh -c 'pkill -KILL vpncmd 2>/dev/null || true' >/dev/null 2>&1 || true
    }
    run_vpncmd() {
      timeout "${timeout_s}s" docker exec "$client_container" vpncmd "$@"
      rc="$?"
      if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
        cleanup_vpncmd
      fi
      return "$rc"
    }
    trap cleanup_vpncmd EXIT
    cleanup_vpncmd

    set_phase client_check
    run_vpncmd localhost /CLIENT /CMD Check >/dev/null
    set_phase nic_list
    nics="$(run_vpncmd localhost /CLIENT /CMD NicList 2>/dev/null || true)"
    if ! echo "$nics" | grep -Fq "$nic"; then
      set_phase nic_create
      # vpncmd output is not a stable machine-readable contract and can miss an
      # already persisted adapter. Treat NicCreate as an idempotent ensure;
      # interface_wait below remains the authoritative runtime acceptance.
      run_vpncmd localhost /CLIENT /CMD NicCreate "$nic" >/dev/null 2>&1 || true
    fi

    set_phase account_list
    accounts="$(run_vpncmd localhost /CLIENT /CMD AccountList 2>/dev/null || true)"
    if echo "$accounts" | grep -Fq "$account"; then
      # Existing accounts can carry unrelated, already accepted transport flows
      # (for example PostgreSQL). Preserve them during cumulative GeoPolicy
      # rollout instead of interrupting and recreating every client account.
      set_phase account_preserved
    else
      set_phase account_create
      run_vpncmd localhost /CLIENT /CMD AccountCreate "$account" /SERVER:"$server" /HUB:"$hub" /USERNAME:"$user" /NICNAME:"$nic" >/dev/null
      set_phase account_password
      run_vpncmd localhost /CLIENT /CMD AccountPasswordSet "$account" /PASSWORD:"$password" /TYPE:standard >/dev/null
      set_phase account_startup
      run_vpncmd localhost /CLIENT /CMD AccountStartupSet "$account" >/dev/null
    fi
    set_phase account_connect
    run_vpncmd localhost /CLIENT /CMD AccountConnect "$account" >/dev/null 2>&1 || true

    set_phase interface_wait
    for attempt in $(seq 1 30); do
      if docker exec -u 0 "$router_container" ip link show "$iface" >/dev/null 2>&1; then
        break
      fi
      sleep 2
      if [ "$attempt" -eq 30 ]; then
        echo "SoftEther client interface did not appear: $iface" >&2
        exit 1
      fi
    done
    set_phase interface_up
    docker exec -u 0 "$router_container" ip link set "$iface" up
    set_phase address
    docker exec -u 0 "$router_container" ip addr replace "$client_ip/$prefix" dev "$iface"
    set_phase succeeded
  args:
    executable: /bin/bash
  environment:
    CLIENT_USER: "{{ ((platform_router_softether_secrets[item.secret_file]).client_users[item.client_alias].client_user | default('')) or item.client_user or (platform_router_softether_secrets[item.secret_file]).client_user | default('') }}"
    CLIENT_PASSWORD: "{{ ((platform_router_softether_secrets[item.secret_file]).client_users[item.client_alias].client_password | default('')) or (platform_router_softether_secrets[item.secret_file]).client_password | default('') }}"
  no_log: true
  failed_when: false
  changed_when: false
  loop: "{{ platform_router_model.softether_clients | default([]) }}"
  when:
    - platform_router_state == 'present'
    - (platform_router_model.softether_clients | default([])) | length > 0
    - not ansible_check_mode

- name: Accept safe platform_router SoftEther client configure phases
  ansible.builtin.shell: |
    set -euo pipefail
    clients_json='{{ platform_router_model.softether_clients | default([]) | map(attribute="name") | list | to_json }}'
    failed=false
    while IFS= read -r client_name; do
      status_file="/tmp/platform-router-client-config-${client_name}.status"
      phase="missing"
      if [ -f "$status_file" ]; then
        phase="$(cat "$status_file")"
      fi
      rm -f "$status_file"
      if [ "$phase" != "succeeded" ]; then
        echo "platform_router SoftEther client configure failed: client=${client_name}, phase=${phase}" >&2
        failed=true
      fi
    done < <(python3 - "$clients_json" <<'PY'
    import json
    import sys
    for item in json.loads(sys.argv[1]):
        print(item)
    PY
    )
    [ "$failed" = "false" ]
  args:
    executable: /bin/bash
  changed_when: false
  when:
    - platform_router_state == 'present'
    - (platform_router_model.softether_clients | default([])) | length > 0
    - not ansible_check_mode

- name: Verify platform_router SoftEther server sidecar is running
  ansible.builtin.shell: |
    set -euo pipefail
    docker inspect "$CONTAINER" | python3 -c '
    import json, sys
    data = json.load(sys.stdin)[0]
    sys.exit(0 if data.get("State", {}).get("Running") else 1)
    '
  args:
    executable: /bin/bash
  environment:
    CONTAINER: "{{ item.container_name }}"
  changed_when: false
  register: platform_router_softether_server_ready
  until: platform_router_softether_server_ready.rc == 0
  retries: 15
  delay: 2
  loop: "{{ platform_router_model.softether_servers | default([]) }}"
  when:
    - platform_router_state == 'present'
    - (platform_router_model.softether_servers | default([])) | length > 0
    - not ansible_check_mode

- name: Configure platform_router SoftEther server sidecar
  ansible.builtin.shell: |
    set -euo pipefail
    server_container="{{ item.container_name }}"
    server_vpncmd_endpoint="127.0.0.1:5555"
    timeout_s="{{ item.vpncmd_timeout_seconds }}"
    password="${SERVER_PASSWORD}"
    hub="{{ item.hub }}"
    hub_password="${HUB_PASSWORD}"
    client_users_json="${CLIENT_USERS_JSON}"
    legacy_client_user="${CLIENT_USER}"
    legacy_client_password="${CLIENT_PASSWORD}"
    server_ip="{{ item.server_ip }}"
    client_ip="{{ item.client_ip }}"
    netmask="{{ item.netmask }}"
    public_port="{{ item.public_port }}"
    access_mode="{{ item.access_mode }}"
    tap_name="{{ item.tap_name }}"
    managed_client_user_prefix="{{ item.managed_client_user_prefix }}"
    managed_client_user_limit="{{ item.managed_client_user_limit }}"
    protected_client_users_json='{{ item.protected_client_users | to_json }}'

    cleanup_vpncmd() {
      docker exec "$server_container" sh -c 'pkill -KILL vpncmd 2>/dev/null || true' >/dev/null 2>&1 || true
    }
    run_vpncmd() {
      timeout "${timeout_s}s" docker exec "$server_container" vpncmd "$@"
      rc="$?"
      if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
        cleanup_vpncmd
      fi
      return "$rc"
    }
    run_vpncmd_batch() {
      output_file="$1"
      timeout "${timeout_s}s" docker exec -i -e VPNCMD_PASSWORD="$password" -e VPNCMD_ENDPOINT="$server_vpncmd_endpoint" "$server_container" sh -c 'tmp="$(mktemp)"; trap "rm -f \"$tmp\"" EXIT; cat > "$tmp"; timeout "$1" vpncmd "$VPNCMD_ENDPOINT" /SERVER /PASSWORD:"$VPNCMD_PASSWORD" /IN:"$tmp"; rc="$?"; if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then pkill -KILL vpncmd 2>/dev/null || true; fi; exit "$rc"' sh "$timeout_s" >"$output_file" 2>&1
    }
    trap cleanup_vpncmd EXIT
    cleanup_vpncmd

    if ! run_vpncmd "$server_vpncmd_endpoint" /SERVER /PASSWORD:"$password" /CMD ServerInfoGet >/dev/null 2>&1; then
      if run_vpncmd "$server_vpncmd_endpoint" /SERVER /PASSWORD: /CMD ServerInfoGet >/dev/null 2>&1; then
        run_vpncmd "$server_vpncmd_endpoint" /SERVER /PASSWORD: /CMD ServerPasswordSet "$password" >/dev/null
      else
        echo "platform_router SoftEther server configure failed during ServerInfoGet/password/adminip validation" >&2
        echo "platform_router SoftEther server data uses a different password; remove/reseed sidecar data explicitly" >&2
        exit 1
      fi
    fi

    listeners="$(run_vpncmd "$server_vpncmd_endpoint" /SERVER /PASSWORD:"$password" /CMD ListenerList 2>/dev/null || true)"
    for port in "$public_port" 992 5555; do
      echo "$listeners" | grep -Eq "(^|[^0-9])${port}([^0-9]|$)" || run_vpncmd "$server_vpncmd_endpoint" /SERVER /PASSWORD:"$password" /CMD ListenerCreate "$port" >/dev/null
    done
    if echo "$listeners" | grep -Eq '(^|[^0-9])1194([^0-9]|$)'; then
      run_vpncmd "$server_vpncmd_endpoint" /SERVER /PASSWORD:"$password" /CMD ListenerDelete 1194 >/dev/null
    fi

    hubs="$(run_vpncmd "$server_vpncmd_endpoint" /SERVER /PASSWORD:"$password" /CMD HubList 2>/dev/null || true)"
    echo "$hubs" | grep -Fq "$hub" || run_vpncmd "$server_vpncmd_endpoint" /SERVER /PASSWORD:"$password" /CMD HubCreate "$hub" /PASSWORD:"$hub_password" >/dev/null
    if [ "$hub" != "DEFAULT" ] && echo "$hubs" | grep -Eq '(^|[[:space:]|])DEFAULT([[:space:]|]|$)'; then
      run_vpncmd "$server_vpncmd_endpoint" /SERVER /PASSWORD:"$password" /CMD HubDelete DEFAULT >/dev/null
    fi

    users_input="$(mktemp)"
    input="$(mktemp)"
    user_check_output="$(mktemp)"
    user_create_output="$(mktemp)"
    trap 'rm -f "$users_input" "$input" "$user_check_output" "$user_create_output"; cleanup_vpncmd' EXIT
    python3 - "$client_users_json" "$legacy_client_user" "$legacy_client_password" <<'PY' > "$users_input"
    import json
    import sys
    client_users = json.loads(sys.argv[1] or "{}")
    if client_users:
        for _alias, item in sorted(client_users.items()):
            user = str(item.get("client_user") or "").strip()
            password = str(item.get("client_password") or "").strip()
            if user and password:
                print(f"{user}|{password}")
    elif sys.argv[2] and sys.argv[3]:
        print(f"{sys.argv[2]}|{sys.argv[3]}")
    PY

    while IFS='|' read -r client_user client_password; do
      [ -n "$client_user" ] || continue
      if ! {
        printf 'Hub %s\n' "$hub"
        printf 'UserGet %s\n' "$client_user"
      } | run_vpncmd_batch "$user_check_output"; then
        if ! {
          printf 'Hub %s\n' "$hub"
          printf 'UserCreate %s /GROUP:none /REALNAME:none /NOTE:none\n' "$client_user"
        } | run_vpncmd_batch "$user_create_output"; then
          if ! grep -Fqi 'already exists' "$user_create_output"; then
            echo "platform_router SoftEther server configure failed during UserCreate for client user" >&2
            sed -E 's#/PASSWORD:[^[:space:]]+#/PASSWORD:<redacted>#g' "$user_create_output" >&2
            exit 1
          fi
        fi
      fi
    done < "$users_input"

    if [ -n "$managed_client_user_prefix" ]; then
      desired_managed_users="$(mktemp)"
      existing_managed_users="$(mktemp)"
      orphaned_managed_users="$(mktemp)"
      user_list_output="$(mktemp)"
      session_list_output="$(mktemp)"
      session_names="$(mktemp)"
      trap 'rm -f "$users_input" "$input" "$user_check_output" "$user_create_output" "$desired_managed_users" "$existing_managed_users" "$orphaned_managed_users" "$user_list_output" "$session_list_output" "$session_names"; cleanup_vpncmd' EXIT

      python3 - "$users_input" "$managed_client_user_prefix" "$managed_client_user_limit" "$protected_client_users_json" <<'PY' > "$desired_managed_users"
    import json
    import sys

    users_file, prefix, raw_limit, protected_json = sys.argv[1:]
    protected = set(json.loads(protected_json or "[]"))
    users = []
    with open(users_file, encoding="utf-8") as handle:
        for line in handle:
            username = line.partition("|")[0].strip()
            if username.startswith(prefix):
                if not username[len(prefix):].isdigit():
                    raise SystemExit("managed SoftEther username has an unsafe suffix")
                if username in protected:
                    raise SystemExit("protected SoftEther username cannot be managed")
                users.append(username)
    if len(users) > int(raw_limit):
        raise SystemExit("managed SoftEther user limit exceeded")
    print("\n".join(sorted(set(users))))
    PY

      {
        printf 'Hub %s\n' "$hub"
        printf 'UserList\n'
      } | run_vpncmd_batch "$user_list_output"
      python3 - "$user_list_output" "$managed_client_user_prefix" <<'PY' > "$existing_managed_users"
    import re
    import sys

    path, prefix = sys.argv[1:]
    safe = re.compile(r"^[A-Za-z0-9_]+$")
    found = set()
    with open(path, encoding="utf-8", errors="replace") as handle:
        for line in handle:
            for field in line.split("|"):
                value = field.strip()
                if value.startswith(prefix) and safe.fullmatch(value):
                    found.add(value)
    print("\n".join(sorted(found)))
    PY
      comm -23 "$existing_managed_users" "$desired_managed_users" > "$orphaned_managed_users"

      while IFS= read -r orphaned_user; do
        [ -n "$orphaned_user" ] || continue
        {
          printf 'Hub %s\n' "$hub"
          printf 'SessionList\n'
        } | run_vpncmd_batch "$session_list_output"
        python3 - "$session_list_output" "$orphaned_user" <<'PY' > "$session_names"
    import re
    import sys

    path, username = sys.argv[1:]
    safe_session = re.compile(r"^[A-Za-z0-9_.:-]+$")
    current_session = ""
    sessions = set()
    with open(path, encoding="utf-8", errors="replace") as handle:
        for line in handle:
            fields = [field.strip() for field in line.split("|")]
            if len(fields) < 2:
                continue
            if fields[0] == "Session Name":
                current_session = fields[1]
            elif fields[0] == "User Name" and fields[1] == username:
                if safe_session.fullmatch(current_session):
                    sessions.add(current_session)
            elif username in fields[1:] and safe_session.fullmatch(fields[0]):
                sessions.add(fields[0])
    print("\n".join(sorted(sessions)))
    PY
        {
          printf 'Hub %s\n' "$hub"
          while IFS= read -r session_name; do
            [ -n "$session_name" ] || continue
            printf 'SessionDisconnect %s\n' "$session_name"
          done < "$session_names"
          printf 'UserDelete %s\n' "$orphaned_user"
        } | run_vpncmd_batch "$user_create_output"
      done < "$orphaned_managed_users"
    fi

    {
      printf 'Hub %s\n' "$hub"
      printf 'SetEnumDeny\n'
      while IFS='|' read -r client_user client_password; do
        [ -n "$client_user" ] || continue
        printf 'UserPasswordSet %s /PASSWORD:%s\n' "$client_user" "$client_password"
      done < "$users_input"
      if [ "$access_mode" = "secure_nat" ]; then
        printf 'SecureNatEnable\n'
        printf 'SecureNatHostSet /MAC:none /IP:%s /MASK:%s\n' "$server_ip" "$netmask"
        printf 'DhcpSet /START:%s /END:%s /MASK:%s /EXPIRE:7200 /GW:%s /DNS:1.1.1.1 /DNS2:8.8.8.8 /DOMAIN:none /LOG:yes\n' "$client_ip" "$client_ip" "$netmask" "$server_ip"
      fi
      printf 'Flush\n'
    } > "$input"
    run_vpncmd_batch /tmp/platform-router-softether-server-config.out < "$input" || {
      cleanup_vpncmd
      echo "platform_router SoftEther server configure failed during vpncmd /IN batch" >&2
      sed -E 's#/PASSWORD:[^[:space:]]+#/PASSWORD:<redacted>#g' /tmp/platform-router-softether-server-config.out >&2
      exit 1
    }

    if [ "$access_mode" = "routed_tap" ]; then
      run_vpncmd "$server_vpncmd_endpoint" /SERVER /PASSWORD:"$password" /HUB:"$hub" /CMD SecureNatDisable >/dev/null 2>&1 || true
      bridges="$(run_vpncmd "$server_vpncmd_endpoint" /SERVER /PASSWORD:"$password" /CMD BridgeList 2>/dev/null || true)"
      echo "$bridges" | grep -Fq "tap_${tap_name}" ||
        run_vpncmd "$server_vpncmd_endpoint" /SERVER /PASSWORD:"$password" /CMD BridgeCreate "$hub" /DEVICE:"$tap_name" /TAP:yes >/dev/null
    fi
  args:
    executable: /bin/bash
  environment:
    SERVER_PASSWORD: "{{ (platform_router_softether_secrets[item.secret_file]).server_password | default('') }}"
    HUB_PASSWORD: "{{ (platform_router_softether_secrets[item.secret_file]).hub_password | default('') }}"
    CLIENT_USER: "{{ (platform_router_softether_secrets[item.secret_file]).client_user | default('') }}"
    CLIENT_PASSWORD: "{{ (platform_router_softether_secrets[item.secret_file]).client_password | default('') }}"
    CLIENT_USERS_JSON: "{{ (platform_router_softether_secrets[item.secret_file]).client_users | default({}) | to_json }}"
  no_log: "{{ platform_router_softether_debug_no_log | bool }}"
  changed_when: false
  loop: "{{ platform_router_model.softether_servers | default([]) }}"
  when:
    - platform_router_state == 'present'
    - (platform_router_model.softether_servers | default([])) | length > 0
    - not ansible_check_mode

- name: Configure platform_router explicit route and service policy
  ansible.builtin.shell: |
    set -euo pipefail
    container="{{ platform_router_model.container_name }}"
    next_hop="{{ platform_router_model.next_hop_ipv4 }}"
    policies_json='{{ platform_router_model.policies | to_json }}'
    egress_paths_json='{{ platform_router_model.egress_paths | default([]) | to_json }}'
    docker exec -u 0 "$container" sh -ceu 'sysctl -w net.ipv4.ip_forward=1 >/dev/null 2>&1 || true'
    docker exec -u 0 "$container" iptables -P FORWARD DROP
    docker exec -u 0 "$container" iptables -F FORWARD
    docker exec -u 0 "$container" iptables -t nat -N PLATFORM_ROUTER_POSTROUTING 2>/dev/null || true
    docker exec -u 0 "$container" iptables -t nat -C POSTROUTING -j PLATFORM_ROUTER_POSTROUTING 2>/dev/null ||
      docker exec -u 0 "$container" iptables -t nat -A POSTROUTING -j PLATFORM_ROUTER_POSTROUTING
    docker exec -u 0 "$container" iptables -t nat -F PLATFORM_ROUTER_POSTROUTING
    python3 - "$policies_json" <<'PY' | while IFS='|' read -r proto source_cidr destination_ipv4 destination_port route_destination vpn_iface vpn_next_hop return_cidr return_next_hop target_snat_ipv4; do
    import json
    import sys
    for item in json.loads(sys.argv[1]):
        print("|".join([
            item["protocol"],
            item["source_cidr"],
            item["destination_ipv4"],
            str(item["destination_port"]),
            "true" if item["route_destination"] else "false",
            item.get("softether_client_iface") or "",
            item.get("softether_client_next_hop") or "",
            item.get("softether_return_cidr") or "",
            item.get("softether_return_next_hop") or "",
            item.get("target_snat_ipv4") or "",
        ]))
    PY
      if [ "$route_destination" = "true" ]; then
        if [ -n "$vpn_iface" ]; then
          vpn_ready=false
          for _attempt in $(seq 1 30); do
            if docker exec -u 0 "$container" sh -ceu \
              'ip link show dev "$1" | grep -q "UP" && ip -4 addr show dev "$1" | grep -q "inet "' \
              sh "$vpn_iface"; then
              vpn_ready=true
              break
            fi
            sleep 1
          done
          if [ "$vpn_ready" != "true" ]; then
            echo "VPN route interface did not become ready: $vpn_iface" >&2
            exit 1
          fi
          docker exec -u 0 "$container" ip route replace "$destination_ipv4/32" via "$vpn_next_hop" dev "$vpn_iface" onlink
        else
          docker exec -u 0 "$container" ip route replace "$destination_ipv4/32" via "$next_hop"
        fi
      fi
      if [ -n "$return_cidr" ]; then
        docker exec -u 0 "$container" ip route replace "$return_cidr" via "$return_next_hop" dev "$vpn_iface" onlink
      fi
      if [ -n "$target_snat_ipv4" ]; then
        docker exec -u 0 "$container" iptables -t nat -A PLATFORM_ROUTER_POSTROUTING \
          -p "$proto" -s "$source_cidr" -d "$destination_ipv4/32" --dport "$destination_port" \
          -j SNAT --to-source "$target_snat_ipv4"
      fi
      docker exec -u 0 "$container" iptables -A FORWARD -p "$proto" -s "$source_cidr" -d "$destination_ipv4/32" --dport "$destination_port" -j ACCEPT
      docker exec -u 0 "$container" iptables -A FORWARD -p "$proto" -s "$destination_ipv4/32" --sport "$destination_port" -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
    done
    python3 - "$egress_paths_json" <<'PY' | while IFS='|' read -r role vpn_iface target_snat source_cidrs_json; do
    import json
    import sys
    for item in json.loads(sys.argv[1]):
        print("|".join([
            item["role"],
            item["tunnel_iface"],
            item["target_snat_ipv4"],
            json.dumps(item["source_cidrs"], separators=(",", ":")),
        ]))
    PY
      vpn_ready=false
      for _attempt in $(seq 1 30); do
        if docker exec -u 0 "$container" sh -ceu \
          'ip link show dev "$1" | grep -q "UP" && ip -4 addr show dev "$1" | grep -q "inet "' \
          sh "$vpn_iface"; then
          vpn_ready=true
          break
        fi
        sleep 1
      done
      if [ "$vpn_ready" != "true" ]; then
        echo "GeoPolicy egress interface did not become ready: $vpn_iface" >&2
        exit 1
      fi
      python3 - "$source_cidrs_json" <<'PY' | while IFS= read -r source_cidr; do
    import json
    import sys
    for item in json.loads(sys.argv[1]):
        print(item)
    PY
        if [ "$role" = "source" ]; then
          docker exec -u 0 "$container" iptables -A FORWARD -s "$source_cidr" -o "$vpn_iface" -j ACCEPT
          docker exec -u 0 "$container" iptables -A FORWARD -d "$source_cidr" -i "$vpn_iface" -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
        else
          docker exec -u 0 "$container" iptables -t nat -A PLATFORM_ROUTER_POSTROUTING \
            -i "$vpn_iface" -s "$source_cidr" -j SNAT --to-source "$target_snat"
          docker exec -u 0 "$container" iptables -A FORWARD -i "$vpn_iface" -s "$source_cidr" -j ACCEPT
          docker exec -u 0 "$container" iptables -A FORWARD -o "$vpn_iface" -d "$source_cidr" -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
        fi
      done
    done
  args:
    executable: /bin/bash
  changed_when: false
  when:
    - platform_router_state == 'present'
    - not ansible_check_mode

- name: Enable persistent platform_router host marked routes
  ansible.builtin.systemd:
    name: "{{ platform_router_host_routes_service }}"
    enabled: true
    state: "{{ (platform_router_host_routes_template.changed | default(false)) | ternary('restarted', 'started') }}"
  when:
    - platform_router_state == 'present'
    - (platform_router_model.egress_paths | default([]) | selectattr('role', 'equalto', 'source') | list | length) > 0
    - not ansible_check_mode

- name: Disable stale platform_router host marked routes without source paths
  ansible.builtin.systemd:
    name: "{{ platform_router_host_routes_service }}"
    enabled: false
    state: stopped
  failed_when: false
  when:
    - platform_router_state == 'present'
    - (platform_router_model.egress_paths | default([]) | selectattr('role', 'equalto', 'source') | list | length) == 0
    - not ansible_check_mode

- name: Verify platform_router marked egress transport
  ansible.builtin.shell: |
    set -euo pipefail
    container="{{ platform_router_model.container_name }}"
    paths_json='{{ platform_router_model.egress_paths | default([]) | to_json }}'
    python3 - "$paths_json" <<'PY' | while IFS='|' read -r path_alias role route_mark route_mark_decimal route_table priority gateway vpn_iface vpn_next_hop target_snat source_cidrs_json; do
    import json
    import sys
    for item in json.loads(sys.argv[1]):
        print("|".join([
            item["alias"], item["role"], item["route_mark"],
            str(item["route_mark_decimal"]), str(item["route_table"]),
            str(item["route_rule_priority"]), item["gateway_ipv4"],
            item["tunnel_iface"], item["tunnel_next_hop"],
            item["target_snat_ipv4"],
            json.dumps(item["source_cidrs"], separators=(",", ":")),
        ]))
    PY
      if [ "$role" = "source" ]; then
        ip -4 rule show | grep -F "fwmark $route_mark lookup $route_table" >/dev/null
        ip -4 route show table "$route_table" | grep -F "default via $gateway" >/dev/null
        ip -4 route get 1.1.1.1 mark "$route_mark_decimal" | grep -F "via $gateway" >/dev/null
        docker exec -u 0 "$container" ip -4 rule show | grep -F "fwmark $route_mark lookup $route_table" >/dev/null
        docker exec -u 0 "$container" ip -4 route show table "$route_table" | grep -F "default via $vpn_next_hop dev $vpn_iface" >/dev/null
      else
        docker exec -u 0 "$container" ip -4 addr show dev "$vpn_iface" | grep -F "inet $vpn_next_hop/" >/dev/null
        python3 - "$source_cidrs_json" <<'PY' | while IFS= read -r source_cidr; do
    import json
    import sys
    for item in json.loads(sys.argv[1]):
        print(item)
    PY
          docker exec -u 0 "$container" iptables -t nat -C PLATFORM_ROUTER_POSTROUTING \
            -i "$vpn_iface" -s "$source_cidr" -j SNAT --to-source "$target_snat"
        done
      fi
    done
  args:
    executable: /bin/bash
  changed_when: false
  when:
    - platform_router_state == 'present'
    - (platform_router_model.egress_paths | default([]) | length) > 0
    - not ansible_check_mode

- name: Ensure platform_router receipt directory
  ansible.builtin.file:
    path: "{{ platform_router_receipt_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when:
    - platform_router_state == 'present'
    - not ansible_check_mode

- name: Write accepted platform_router transport receipt
  ansible.builtin.shell: |
    set -euo pipefail
    python3 - "$MODEL_JSON" "$RECEIPT" <<'PY'
    import datetime as dt
    import json
    import os
    import pathlib
    import sys
    import tempfile

    model = json.loads(sys.argv[1])
    receipt = pathlib.Path(sys.argv[2])
    paths = []
    for item in model.get("egress_paths", []):
        accepted = dict(item)
        accepted["status"] = "ready"
        paths.append(accepted)
    payload = {
        "schema_version": 1,
        "alias": model["alias"],
        "final_status": "succeeded",
        "egress_paths": paths,
        "accepted_at": dt.datetime.now(dt.UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
    }
    receipt.parent.mkdir(parents=True, exist_ok=True)
    fd, temporary = tempfile.mkstemp(prefix=f".{receipt.name}.", dir=receipt.parent)
    try:
        with os.fdopen(fd, "w", encoding="utf-8", newline="\n") as handle:
            json.dump(payload, handle, sort_keys=True, indent=2)
            handle.write("\n")
            handle.flush()
            os.fsync(handle.fileno())
        os.chmod(temporary, 0o600)
        os.replace(temporary, receipt)
        directory = os.open(receipt.parent, os.O_RDONLY)
        try:
            os.fsync(directory)
        finally:
            os.close(directory)
    finally:
        if os.path.exists(temporary):
            os.unlink(temporary)
    PY
  args:
    executable: /bin/bash
  environment:
    MODEL_JSON: "{{ platform_router_model | to_json }}"
    RECEIPT: "{{ platform_router_receipt_file }}"
  changed_when: false
  when:
    - platform_router_state == 'present'
    - not ansible_check_mode

- name: Verify platform_router dataplane tools
  ansible.builtin.shell: |
    set -euo pipefail
    docker exec -u 0 "$CONTAINER" sh -c 'ip route >/dev/null && iptables -S FORWARD >/dev/null'
  args:
    executable: /bin/bash
  environment:
    CONTAINER: "{{ platform_router_model.container_name }}"
  changed_when: false
  when:
    - platform_router_state == 'present'
    - not ansible_check_mode

- name: Stop platform_router container
  ansible.builtin.command:
    cmd: docker compose -f "{{ platform_router_compose_file }}" down
    chdir: "{{ platform_router_root_dir }}"
  changed_when: true
  when:
    - platform_router_state == 'absent'
    - platform_router_compose_stat.stat.exists | default(false)
    - not ansible_check_mode

- name: Disable platform_router host marked routes during removal
  ansible.builtin.systemd:
    name: "{{ platform_router_host_routes_service }}"
    enabled: false
    state: stopped
  failed_when: false
  when:
    - platform_router_state == 'absent'
    - not ansible_check_mode

- name: Purge platform_router runtime data when explicitly requested
  ansible.builtin.file:
    path: "{{ platform_router_root_dir }}"
    state: absent
  when:
    - platform_router_state == 'absent'
    - platform_router_purge_data in [true, 'true', 'True']
    - not ansible_check_mode
