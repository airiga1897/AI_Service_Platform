    import json, os, sys
    data = json.load(sys.stdin)[0]
    networks = data.get("NetworkSettings", {}).get("Networks", {})
    expected = {
        os.environ["DATA_NETWORK"]: os.environ["DATA_IP"],
        os.environ["APP_NETWORK"]: os.environ["APP_IP"],
    }
    if os.environ["TRANSPORT_NETWORK_ENABLED"] == "true":
        for item in json.loads(os.environ["TRANSPORT_NETWORKS_JSON"]):
            expected[item["name"]] = item["container_ipv4"]
    if os.environ["MGMT_NETWORK_ENABLED"] == "true":
        for item in json.loads(os.environ["MGMT_NETWORKS_JSON"]):
            expected[item["name"]] = item["container_ipv4"]
    running = data.get("State", {}).get("Running")
    ok = bool(running)
    for network, ip in expected.items():
        ok = ok and networks.get(network, {}).get("IPAddress") == ip
    sys.exit(0 if ok else 1)
    '
