---
- name: Validate platform_router state
  ansible.builtin.assert:
    that:
      - platform_router_state in ['present', 'absent']
      - platform_router_purge_data in [true, false, 'true', 'false', 'True', 'False']
      - (platform_router_build_image | default(false)) in [true, false, 'true', 'false', 'True', 'False']
      - (platform_router_softether_client_build_image | default(false)) in [true, false, 'true', 'false', 'True', 'False']
    fail_msg: "platform_router_state must be present|absent and platform_router boolean flags must be boolean-like."

- name: Check platform_router compose file
  ansible.builtin.stat:
    path: "{{ platform_router_compose_file }}"
  register: platform_router_compose_stat
  when: platform_router_state == 'absent'

- name: Check platform_router operator files on control node
  ansible.builtin.stat:
    path: "{{ item.path }}"
  delegate_to: localhost
  become: false
  register: platform_router_operator_file_stats
  loop:
    - { path: "{{ platform_router_operator_config_file }}", label: "platform_router config" }
    - { path: "{{ platform_router_operator_platform_networks_file }}", label: "platform_networks config" }
    - { path: "{{ platform_router_operator_l3_vps_links_file }}", label: "softether l3-vps links" }
  when: platform_router_state == 'present'

- name: Require platform_router operator files
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
    fail_msg: "Missing {{ item.item.label }}: {{ item.item.path }}"
  loop: "{{ platform_router_operator_file_stats.results }}"
  when: platform_router_state == 'present'

- name: Plan platform_router SoftEther client image build on orchestration controller
  ansible.builtin.shell: |
    set -euo pipefail
    test -f "$CONTEXT/Dockerfile"
    dockerfile_hash="$(sha256sum "$CONTEXT/Dockerfile" | awk '{print substr($1, 1, 12)}')"
    git_ref="$(git -C "$REPO_ROOT" rev-parse --short=12 HEAD 2>/dev/null || true)"
    if [ -z "$git_ref" ]; then
      git_ref="nogit"
    fi
    stamp="$(date -u +%Y%m%dT%H%M%SZ)"
    image_ref="${IMAGE_REPOSITORY}:${stamp}-${git_ref}-${dockerfile_hash}"
    python3 - "$image_ref" "$CONTEXT" <<'PY'
    import json
    import sys
    print(json.dumps({"image_ref": sys.argv[1], "context": sys.argv[2]}, sort_keys=True))
    PY
  args:
    executable: /bin/bash
  environment:
    CONTEXT: "{{ platform_router_softether_client_build_context }}"
    IMAGE_REPOSITORY: "{{ platform_router_softether_client_image_repository }}"
    REPO_ROOT: "{{ playbook_dir }}/../.."
  delegate_to: localhost
  become: false
  check_mode: false
  run_once: true
  register: platform_router_softether_client_build_plan_command
  changed_when: false
  when:
    - platform_router_state == 'present'
    - platform_router_softether_client_build_image | bool

- name: Store platform_router SoftEther client image build plan
  ansible.builtin.set_fact:
    platform_router_softether_client_build_plan: "{{ platform_router_softether_client_build_plan_command.stdout | from_json }}"
  run_once: true
  when:
    - platform_router_state == 'present'
    - platform_router_softether_client_build_image | bool

- name: Use generated platform_router SoftEther client image ref for this rollout
  ansible.builtin.set_fact:
    platform_router_softether_client_image: "{{ hostvars[ansible_play_hosts_all[0]].platform_router_softether_client_build_plan.image_ref }}"
    platform_router_softether_client_remote_archive: "/tmp/ai-sp-softether-vpnclient-{{ hostvars[ansible_play_hosts_all[0]].platform_router_softether_client_build_plan.image_ref | hash('sha1') }}.tar"
  when:
    - platform_router_state == 'present'
    - platform_router_softether_client_build_image | bool

- name: Build platform_router model
  ansible.builtin.shell: |
    set -euo pipefail
    python3 - <<'PY'
    import ipaddress
    import json
    import os
    import sys

    try:
        import yaml
    except Exception as exc:
        print(f"PyYAML is required to read platform_router config: {exc}", file=sys.stderr)
        sys.exit(1)

    alias = os.environ["INVENTORY_HOSTNAME"]
    config_file = os.environ["CONFIG_FILE"]
    platform_networks_file = os.environ["PLATFORM_NETWORKS_FILE"]
    l3_links_file = os.environ["L3_LINKS_FILE"]
    l3_secrets_dir = os.environ["L3_SECRETS_DIR"]

    def fail(message):
        print(message, file=sys.stderr)
        sys.exit(1)

    def load_yaml(path):
        with open(path, encoding="utf-8") as handle:
            return yaml.safe_load(handle) or {}

    config = load_yaml(config_file).get("platform_router") or {}
    platform_networks = load_yaml(platform_networks_file).get("nodes") or {}
    l3_links = [
        item for item in (load_yaml(l3_links_file).get("links") or [])
        if str(item.get("state", "present")).lower() == "present"
    ]

    selected = [
        link for link in (config.get("links") or [])
        if str(link.get("state", "present")).lower() == "present"
        and alias in (
            {str(link.get("source_alias") or ""), str(link.get("target_alias") or "")}
            | {str(item) for item in (link.get("source_aliases") or [])}
        )
    ]
    if not selected:
        fail(f"{alias} must participate in at least one present platform_router link")

    if alias not in platform_networks:
        fail(f"platform_networks config has no node entry for {alias}")
    node_networks = platform_networks[alias]
    for network_role in ("data", "app"):
        item = node_networks.get(network_role) or {}
        if not item.get("name") or not item.get("subnet"):
            fail(f"platform_networks {alias}.{network_role} requires name and subnet")

    data_subnet = ipaddress.ip_network(str(node_networks["data"]["subnet"]), strict=True)
    app_subnet = ipaddress.ip_network(str(node_networks["app"]["subnet"]), strict=True)

    def link_suffix(link_name):
        digits = "".join(ch for ch in str(link_name) if ch.isdigit())
        return "pg" + digits if digits else str(link_name).replace("_", "-").replace(".", "-")

    def sidecar_value(base, suffix, default_suffix):
        return base if suffix == default_suffix else f"{base}-{suffix}"

    def compose_network_name(prefix, suffix):
        return prefix if suffix == "pg48" else f"{prefix}_{suffix}"

    data_ipv4 = None
    app_ipv4 = None
    transport_networks = []
    management_networks = []
    policies = []
    softether_clients = []
    softether_servers = []

    for link in selected:
        link_name = str(link.get("l3_vps_link") or link.get("name") or "").strip()
        suffix = link_suffix(link_name)
        l3_matches = [item for item in l3_links if str(item.get("name") or "") == link_name]
        if len(l3_matches) != 1:
            fail(f"platform_router link {link.get('name')} references missing/non-unique l3_vps_link: {link_name}")
        l3_link = l3_matches[0]
        l3_client_aliases = {str(l3_link.get("client_alias") or "")} | {str(item) for item in (l3_link.get("client_aliases") or [])}
        if isinstance(l3_link.get("standby_clients"), dict):
            l3_client_aliases |= {str(item) for item in l3_link.get("standby_clients")}
        if alias not in ({str(l3_link.get("server_alias") or "")} | l3_client_aliases):
            fail(f"{alias} is not a participant in softether_l3_vps link {link_name}")

        role = "server" if alias == str(l3_link.get("server_alias") or "") else "client"
        runtime_mode = str(l3_link.get("runtime_mode") or "standalone").strip().lower()
        if runtime_mode not in {"standalone", "platform_router_sidecar"}:
            fail(f"softether_l3_vps link {link_name} has unsupported runtime_mode: {runtime_mode}")
        l3_network_name = str(l3_link.get(f"{role}_network_name") or "").strip()
        l3_network_subnet = ipaddress.ip_network(str(l3_link.get(f"{role}_network_subnet") or ""), strict=True)
        if not l3_network_name:
            fail(f"softether_l3_vps link {link_name} has no {role}_network_name")

        management_network = {"enabled": False}
        if role == "server":
            management_network_name = str(l3_link.get("server_management_network_name") or "").strip()
            management_network_subnet = str(l3_link.get("server_management_network_subnet") or "").strip()
            management_container_ipv4 = str(l3_link.get("server_management_container_ipv4") or "").strip()
            management_allowed_source_ipv4 = str(l3_link.get("server_management_allowed_source_ipv4") or "").strip()
            if any([management_network_name, management_network_subnet, management_container_ipv4, management_allowed_source_ipv4]):
                if not all([management_network_name, management_network_subnet, management_container_ipv4, management_allowed_source_ipv4]):
                    fail(f"softether_l3_vps link {link_name} server management network requires name, subnet, container IP, and allowed source IP")
                parsed_management_subnet = ipaddress.ip_network(management_network_subnet, strict=True)
                parsed_management_ip = ipaddress.ip_address(management_container_ipv4)
                parsed_management_source_ip = ipaddress.ip_address(management_allowed_source_ipv4)
                if parsed_management_ip not in parsed_management_subnet:
                    fail(f"softether_l3_vps link {link_name} management IP {parsed_management_ip} must be inside {parsed_management_subnet}")
                if parsed_management_source_ip not in parsed_management_subnet:
                    fail(f"softether_l3_vps link {link_name} management allowed source IP {parsed_management_source_ip} must be inside {parsed_management_subnet}")
                if parsed_management_subnet.overlaps(l3_network_subnet):
                    fail(f"softether_l3_vps link {link_name} management network {parsed_management_subnet} must not overlap transport network {l3_network_subnet}")
                management_network = {
                    "enabled": True,
                    "compose_name": compose_network_name("l3_mgmt", suffix),
                    "name": management_network_name,
                    "subnet": str(parsed_management_subnet),
                    "container_ipv4": str(parsed_management_ip),
                    "allowed_source_ipv4": str(parsed_management_source_ip),
                }

        router = (link.get("routers") or {}).get(alias) or {}
        if not router:
            fail(f"platform_router link {link.get('name')} has no routers.{alias} entry")

        link_data_ipv4 = ipaddress.ip_address(str(router.get("data_ipv4") or ""))
        link_app_ipv4 = ipaddress.ip_address(str(router.get("app_ipv4") or ""))
        if link_data_ipv4 not in data_subnet:
            fail(f"platform_router {alias} data IP {link_data_ipv4} must be inside {data_subnet}")
        if link_app_ipv4 not in app_subnet:
            fail(f"platform_router {alias} app IP {link_app_ipv4} must be inside {app_subnet}")
        if data_ipv4 is None:
            data_ipv4 = link_data_ipv4
        elif data_ipv4 != link_data_ipv4:
            fail(f"platform_router {alias} data_ipv4 must be identical across links")
        if app_ipv4 is None:
            app_ipv4 = link_app_ipv4
        elif app_ipv4 != link_app_ipv4:
            fail(f"platform_router {alias} app_ipv4 must be identical across links")

        transport_network_enabled = role == "server"
        transport_ipv4 = None
        if router.get("transport_ipv4"):
            transport_ipv4 = ipaddress.ip_address(str(router["transport_ipv4"]))
        next_hop_ipv4 = None
        if router.get("next_hop_ipv4"):
            next_hop_ipv4 = ipaddress.ip_address(str(router["next_hop_ipv4"]))
        if transport_network_enabled:
            if transport_ipv4 not in l3_network_subnet:
                fail(f"platform_router {alias} transport IP {transport_ipv4} must be inside {l3_network_subnet}")
            transport_networks.append({
                "compose_name": compose_network_name("l3_transport", suffix),
                "name": l3_network_name,
                "container_ipv4": str(transport_ipv4),
            })
        if transport_network_enabled and runtime_mode != "platform_router_sidecar" and next_hop_ipv4 not in l3_network_subnet:
            fail(f"platform_router {alias} next hop {next_hop_ipv4} must be inside {l3_network_subnet}")
        if management_network.get("enabled"):
            management_networks.append(management_network)

        client_name = None
        client_iface = ""
        client_server_ip = ""
        client_ip_for_snat = ""
        source_aliases = {str(link.get("source_alias") or "")} | {str(item) for item in (link.get("source_aliases") or [])}
        if alias in source_aliases and runtime_mode == "platform_router_sidecar":
            vpn_subnet = ipaddress.ip_network(str(l3_link["subnet"]), strict=True)
            server_ip = ipaddress.ip_address(str(l3_link["server_ip"]))
            standby_clients = l3_link.get("standby_clients") or {}
            standby_client = standby_clients.get(alias) if isinstance(standby_clients, dict) else {}
            client_ip = ipaddress.ip_address(str((standby_client or {}).get("client_ip") or l3_link["client_ip"]))
            client_user = str((standby_client or {}).get("client_user") or "")
            if server_ip not in vpn_subnet or client_ip not in vpn_subnet:
                fail(f"softether_l3_vps link {link_name} VPN endpoint IPs must be inside {vpn_subnet}")
            nic_name = sidecar_value(os.environ["SOFTETHER_CLIENT_NIC"], suffix, "pg48")
            client_name = str(link.get("name") or link_name)
            client_iface = "vpn_" + nic_name
            client_server_ip = str(server_ip)
            client_ip_for_snat = str(client_ip)
            softether_clients.append({
                "enabled": True,
                "name": client_name,
                "container_name": sidecar_value(os.environ["SOFTETHER_CLIENT_CONTAINER"], suffix, "pg48"),
                "image": os.environ["SOFTETHER_CLIENT_IMAGE"],
                "legacy_container_name": os.environ["LEGACY_SOFTETHER_CLIENT_CONTAINER"],
                "account_name": sidecar_value(os.environ["SOFTETHER_CLIENT_ACCOUNT"], suffix, "pg48"),
                "nic_name": nic_name,
                "iface": client_iface,
                "server": str(l3_link["server_sni"]) + ":" + str(int(l3_link.get("public_port") or 443)),
                "hub": str(l3_link["hub"]),
                "client_ip": str(client_ip),
                "client_alias": alias,
                "client_user": client_user,
                "server_ip": client_server_ip,
                "prefixlen": vpn_subnet.prefixlen,
                "secret_file": os.path.join(l3_secrets_dir, str(l3_link["name"]) + ".json"),
                "vpncmd_timeout_seconds": int(os.environ["SOFTETHER_CLIENT_VPNCMD_TIMEOUT_SECONDS"]),
                "data_dir": sidecar_value("softether_client_data", suffix, "pg48"),
            })

        if alias == str(link.get("target_alias") or "") and runtime_mode == "platform_router_sidecar":
            vpn_subnet = ipaddress.ip_network(str(l3_link["subnet"]), strict=True)
            server_ip = ipaddress.ip_address(str(l3_link["server_ip"]))
            client_ip = ipaddress.ip_address(str(l3_link["client_ip"]))
            if server_ip not in vpn_subnet or client_ip not in vpn_subnet:
                fail(f"softether_l3_vps link {link_name} VPN endpoint IPs must be inside {vpn_subnet}")
            if not management_network.get("enabled"):
                fail(f"softether_l3_vps link {link_name} server sidecar requires server management network")
            softether_servers.append({
                "enabled": True,
                "name": str(link.get("name") or link_name),
                "container_name": os.environ["SOFTETHER_SERVER_CONTAINER"],
                "image": os.environ["SOFTETHER_SERVER_IMAGE"],
                "legacy_container_name": os.environ["LEGACY_SOFTETHER_SERVER_CONTAINER"],
                "hub": str(l3_link["hub"]),
                "public_port": int(l3_link.get("public_port") or 443),
                "management_port": 5555,
                "extra_listeners": [992],
                "server_ip": str(server_ip),
                "client_ip": str(client_ip),
                "netmask": str(vpn_subnet.netmask),
                "secret_file": os.path.join(l3_secrets_dir, str(l3_link["name"]) + ".json"),
                "vpncmd_timeout_seconds": int(os.environ["SOFTETHER_CLIENT_VPNCMD_TIMEOUT_SECONDS"]),
                "management_allowed_source_ipv4": management_network["allowed_source_ipv4"],
            })

        for policy in link.get("policies") or []:
            if str(policy.get("state", "present")).lower() != "present":
                continue
            destination_ipv4 = ipaddress.ip_address(str(policy.get("destination_ipv4") or ""))
            source_cidr = ipaddress.ip_network(str(policy.get("source_cidr") or "0.0.0.0/0"), strict=False)
            destination_port = int(policy.get("destination_port") or 0)
            if destination_port < 1 or destination_port > 65535:
                fail(f"platform_router policy {policy.get('name')} has invalid destination_port")
            protocol = str(policy.get("protocol") or "tcp").lower()
            if protocol not in {"tcp", "udp"}:
                fail(f"platform_router policy {policy.get('name')} protocol must be tcp or udp")
            source_alias = str(policy.get("source_alias") or link.get("source_alias"))
            target_alias = str(policy.get("target_alias") or link.get("target_alias"))
            if alias not in {source_alias, target_alias}:
                continue
            target_source_cidr = ipaddress.ip_network(str(policy.get("target_source_cidr") or source_cidr), strict=False)
            effective_source_cidr = target_source_cidr if alias == target_alias else source_cidr
            policies.append({
                "name": str(policy.get("name") or f"{protocol}-{destination_ipv4}-{destination_port}"),
                "link_name": str(link.get("name") or link_name),
                "source_alias": source_alias,
                "target_alias": target_alias,
                "protocol": protocol,
                "source_cidr": str(effective_source_cidr),
                "destination_ipv4": str(destination_ipv4),
                "destination_port": destination_port,
                "route_destination": alias == source_alias,
                "source_side_snat": (
                    alias == source_alias
                    and runtime_mode == "platform_router_sidecar"
                    and alias in source_aliases
                ),
                "softether_client_name": client_name or "",
                "softether_client_iface": client_iface,
                "softether_client_server_ip": client_server_ip,
                "softether_client_ip": client_ip_for_snat,
            })

    if data_ipv4 is None or app_ipv4 is None:
        fail(f"platform_router {alias} has no data/app router addresses")

    softether_server_runtime = {
        "enabled": bool(softether_servers),
        "container_name": os.environ["SOFTETHER_SERVER_CONTAINER"],
        "image": os.environ["SOFTETHER_SERVER_IMAGE"],
        "legacy_container_name": os.environ["LEGACY_SOFTETHER_SERVER_CONTAINER"],
        "data_dir": "softether_server_data",
        "logs_dir": "softether_server_logs",
        "adminip_file": "softether_server_adminip.txt",
    }
    softether_client = softether_clients[0] if len(softether_clients) == 1 else {"enabled": False}
    softether_server = softether_server_runtime if softether_servers else {"enabled": False}
    management_network = management_networks[0] if len(management_networks) == 1 else {"enabled": False}
    transport_network_enabled = bool(transport_networks)
    transport_network_name = transport_networks[0]["name"] if len(transport_networks) == 1 else ""
    transport_ipv4 = transport_networks[0]["container_ipv4"] if len(transport_networks) == 1 else ""
    next_hop_ipv4 = ""

    model = {
        "alias": alias,
        "container_name": str(config.get("container_name") or os.environ["DEFAULT_CONTAINER_NAME"]),
        "link_name": str(selected[0].get("name") or selected[0].get("l3_vps_link") or ""),
        "role": "multi" if len(selected) > 1 else ("server" if softether_servers else "client"),
        "runtime_mode": "multi" if len(selected) > 1 else str((l3_links[0].get("runtime_mode") if l3_links else "standalone") or "standalone"),
        "transport_network_enabled": transport_network_enabled,
        "transport_network_name": transport_network_name,
        "transport_ipv4": str(transport_ipv4) if transport_ipv4 else "",
        "next_hop_ipv4": str(next_hop_ipv4) if next_hop_ipv4 else "",
        "management_network": management_network,
        "transport_networks": transport_networks,
        "management_networks": management_networks,
        "data_network_name": str(node_networks["data"]["name"]),
        "data_ipv4": str(data_ipv4),
        "app_network_name": str(node_networks["app"]["name"]),
        "app_ipv4": str(app_ipv4),
        "policies": policies,
        "softether_client": softether_client,
        "softether_server": softether_server,
        "softether_server_runtime": softether_server_runtime,
        "softether_clients": softether_clients,
        "softether_servers": softether_servers,
    }
    print(json.dumps(model, sort_keys=True))
    PY
  args:
    executable: /bin/bash
  environment:
    INVENTORY_HOSTNAME: "{{ inventory_hostname }}"
    CONFIG_FILE: "{{ platform_router_operator_config_file }}"
    PLATFORM_NETWORKS_FILE: "{{ platform_router_operator_platform_networks_file }}"
    L3_LINKS_FILE: "{{ platform_router_operator_l3_vps_links_file }}"
    L3_SECRETS_DIR: "{{ platform_router_operator_l3_vps_secrets_dir }}"
    DEFAULT_CONTAINER_NAME: "{{ platform_router_container_name }}"
    SOFTETHER_CLIENT_IMAGE: "{{ platform_router_softether_client_image }}"
    SOFTETHER_CLIENT_CONTAINER: "{{ platform_router_softether_client_container_name }}"
    SOFTETHER_CLIENT_NIC: "{{ platform_router_softether_client_nic_name }}"
    SOFTETHER_CLIENT_ACCOUNT: "{{ platform_router_softether_client_account_name }}"
    SOFTETHER_CLIENT_VPNCMD_TIMEOUT_SECONDS: "{{ platform_router_softether_client_vpncmd_timeout_seconds }}"
    LEGACY_SOFTETHER_CLIENT_CONTAINER: "{{ platform_router_legacy_softether_l3_vps_client_container_name }}"
    SOFTETHER_SERVER_IMAGE: "{{ platform_router_softether_server_image }}"
    SOFTETHER_SERVER_CONTAINER: "{{ platform_router_softether_server_container_name }}"
    LEGACY_SOFTETHER_SERVER_CONTAINER: "{{ platform_router_legacy_softether_l3_vps_server_container_name }}"
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  register: platform_router_model_command
  when: platform_router_state == 'present'

- name: Store platform_router model
  ansible.builtin.set_fact:
    platform_router_model: "{{ platform_router_model_command.stdout | from_json }}"
  when: platform_router_state == 'present'

- name: Validate platform_router SoftEther client secret presence
  ansible.builtin.shell: |
    set -euo pipefail
    python3 - "$MODEL_JSON" <<'PY'
    import json
    import os
    import sys
    model = json.loads(sys.argv[1])
    paths = []
    for item in model.get("softether_clients", []) + model.get("softether_servers", []):
        path = str(item.get("secret_file") or "")
        if path and path not in paths:
            paths.append(path)
    for path in paths:
        if not os.path.isfile(path) or os.path.getsize(path) <= 0:
            print(f"missing or empty SoftEther secret: {path}", file=sys.stderr)
            sys.exit(1)
    PY
  args:
    executable: /bin/bash
  environment:
    MODEL_JSON: "{{ platform_router_model | to_json }}"
  delegate_to: localhost
  become: false
  changed_when: false
  when:
    - platform_router_state == 'present'
    - ((platform_router_model.softether_clients | default([])) | length > 0) or ((platform_router_model.softether_servers | default([])) | length > 0)
    - not ansible_check_mode

- name: Load platform_router SoftEther client secret
  ansible.builtin.shell: |
    set -euo pipefail
    python3 - '{{ platform_router_model | to_json }}' <<'PY'
    import json
    import sys

    model = json.loads(sys.argv[1])
    required = ["server_password", "hub_password", "client_user", "client_password"]
    paths = []
    for item in model.get("softether_clients", []) + model.get("softether_servers", []):
        path = str(item.get("secret_file") or "")
        if path and path not in paths:
            paths.append(path)
    result = {}
    for path in paths:
        with open(path, encoding="utf-8") as handle:
            data = json.load(handle)
        missing = [key for key in ["server_password", "hub_password"] if not str(data.get(key) or "")]
        client_users = data.get("client_users") or {}
        if not client_users:
            missing.extend([key for key in ["client_user", "client_password"] if not str(data.get(key) or "")])
        elif not isinstance(client_users, dict):
            print(f"client_users in {path} must be a map", file=sys.stderr)
            sys.exit(1)
        else:
            for alias, client in client_users.items():
                if not isinstance(client, dict) or not str(client.get("client_user") or "") or not str(client.get("client_password") or ""):
                    print(f"client_users.{alias} in {path} requires client_user and client_password", file=sys.stderr)
                    sys.exit(1)
        if missing:
            print(f"missing keys in {path}: {', '.join(missing)}", file=sys.stderr)
            sys.exit(1)
        item = {key: str(data[key]) for key in ["server_password", "hub_password"]}
        item["client_user"] = str(data.get("client_user") or "")
        item["client_password"] = str(data.get("client_password") or "")
        item["client_users"] = data.get("client_users") or {}
        result[path] = item
    print(json.dumps(result, sort_keys=True))
    PY
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true
  register: platform_router_softether_client_secret_command
  when:
    - platform_router_state == 'present'
    - ((platform_router_model.softether_clients | default([])) | length > 0) or ((platform_router_model.softether_servers | default([])) | length > 0)
    - not ansible_check_mode

