- name: Configure platform_router SoftEther client sidecar
  ansible.builtin.shell: |
    set -euo pipefail
    router_container="{{ platform_router_model.container_name }}"
    client_container="{{ item.container_name }}"
    timeout_s="{{ item.vpncmd_timeout_seconds }}"
    account="{{ item.account_name }}"
    nic="{{ item.nic_name }}"
    iface="{{ item.iface }}"
    server="{{ item.server }}"
    hub="{{ item.hub }}"
    client_ip="{{ item.client_ip }}"
    prefix="{{ item.prefixlen }}"
    user="${CLIENT_USER}"
    password="${CLIENT_PASSWORD}"

    cleanup_vpncmd() {
      docker exec "$client_container" sh -c 'pkill -KILL vpncmd 2>/dev/null || true' >/dev/null 2>&1 || true
    }
    run_vpncmd() {
      timeout "${timeout_s}s" docker exec "$client_container" vpncmd "$@"
      rc="$?"
      if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
        cleanup_vpncmd
      fi
      return "$rc"
    }
    trap cleanup_vpncmd EXIT
    cleanup_vpncmd

    run_vpncmd localhost /CLIENT /CMD Check >/dev/null
    nics="$(run_vpncmd localhost /CLIENT /CMD NicList 2>/dev/null || true)"
    echo "$nics" | grep -Fq "$nic" || run_vpncmd localhost /CLIENT /CMD NicCreate "$nic" >/dev/null

    accounts="$(run_vpncmd localhost /CLIENT /CMD AccountList 2>/dev/null || true)"
    if echo "$accounts" | grep -Fq "$account"; then
      run_vpncmd localhost /CLIENT /CMD AccountDisconnect "$account" >/dev/null 2>&1 || true
      run_vpncmd localhost /CLIENT /CMD AccountDelete "$account" >/dev/null
    fi
    run_vpncmd localhost /CLIENT /CMD AccountCreate "$account" /SERVER:"$server" /HUB:"$hub" /USERNAME:"$user" /NICNAME:"$nic" >/dev/null
    run_vpncmd localhost /CLIENT /CMD AccountPasswordSet "$account" /PASSWORD:"$password" /TYPE:standard >/dev/null
    run_vpncmd localhost /CLIENT /CMD AccountStartupSet "$account" >/dev/null
    run_vpncmd localhost /CLIENT /CMD AccountConnect "$account" >/dev/null

    for attempt in $(seq 1 30); do
      if docker exec -u 0 "$router_container" ip link show "$iface" >/dev/null 2>&1; then
        break
      fi
      sleep 2
      if [ "$attempt" -eq 30 ]; then
        echo "SoftEther client interface did not appear: $iface" >&2
        exit 1
      fi
    done
    docker exec -u 0 "$router_container" ip link set "$iface" up
    docker exec -u 0 "$router_container" ip addr replace "$client_ip/$prefix" dev "$iface"
  args:
    executable: /bin/bash
  environment:
    CLIENT_USER: "{{ ((platform_router_softether_secrets[item.secret_file]).client_users[item.client_alias].client_user | default('')) or item.client_user or (platform_router_softether_secrets[item.secret_file]).client_user | default('') }}"
    CLIENT_PASSWORD: "{{ ((platform_router_softether_secrets[item.secret_file]).client_users[item.client_alias].client_password | default('')) or (platform_router_softether_secrets[item.secret_file]).client_password | default('') }}"
  no_log: true
  changed_when: false
  loop: "{{ platform_router_model.softether_clients | default([]) }}"
  when:
    - platform_router_state == 'present'
    - (platform_router_model.softether_clients | default([])) | length > 0
    - not ansible_check_mode

