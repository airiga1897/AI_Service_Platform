    server_ip="{{ item.server_ip }}"
    client_ip="{{ item.client_ip }}"
    netmask="{{ item.netmask }}"
    public_port="{{ item.public_port }}"

    cleanup_vpncmd() {
      docker exec "$server_container" sh -c 'pkill -KILL vpncmd 2>/dev/null || true' >/dev/null 2>&1 || true
    }
    run_vpncmd() {
      timeout "${timeout_s}s" docker exec "$server_container" vpncmd "$@"
      rc="$?"
      if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
        cleanup_vpncmd
      fi
      return "$rc"
    }
    trap cleanup_vpncmd EXIT
    cleanup_vpncmd

    if ! run_vpncmd localhost:5555 /SERVER /PASSWORD:"$password" /CMD ServerInfoGet >/dev/null 2>&1; then
      if run_vpncmd localhost:5555 /SERVER /PASSWORD: /CMD ServerInfoGet >/dev/null 2>&1; then
        run_vpncmd localhost:5555 /SERVER /PASSWORD: /CMD ServerPasswordSet "$password" >/dev/null
      else
        echo "platform_router SoftEther server data uses a different password; remove/reseed sidecar data explicitly" >&2
        exit 1
      fi
    fi

    listeners="$(run_vpncmd localhost:5555 /SERVER /PASSWORD:"$password" /CMD ListenerList 2>/dev/null || true)"
    for port in "$public_port" 992 5555; do
      echo "$listeners" | grep -Eq "(^|[^0-9])${port}([^0-9]|$)" || run_vpncmd localhost:5555 /SERVER /PASSWORD:"$password" /CMD ListenerCreate "$port" >/dev/null
    done
    if echo "$listeners" | grep -Eq '(^|[^0-9])1194([^0-9]|$)'; then
      run_vpncmd localhost:5555 /SERVER /PASSWORD:"$password" /CMD ListenerDelete 1194 >/dev/null
    fi

    hubs="$(run_vpncmd localhost:5555 /SERVER /PASSWORD:"$password" /CMD HubList 2>/dev/null || true)"
    echo "$hubs" | grep -Fq "$hub" || run_vpncmd localhost:5555 /SERVER /PASSWORD:"$password" /CMD HubCreate "$hub" /PASSWORD:"$hub_password" >/dev/null
    if [ "$hub" != "DEFAULT" ] && echo "$hubs" | grep -Eq '(^|[[:space:]|])DEFAULT([[:space:]|]|$)'; then
      run_vpncmd localhost:5555 /SERVER /PASSWORD:"$password" /CMD HubDelete DEFAULT >/dev/null
    fi

    input="$(mktemp)"
    trap 'rm -f "$input"; cleanup_vpncmd' EXIT
    users="$(run_vpncmd localhost:5555 /SERVER /PASSWORD:"$password" /HUB:"$hub" /CMD UserList 2>/dev/null || true)"
    {
      printf 'Hub %s\n' "$hub"
      python3 - "$client_users_json" "$legacy_client_user" "$legacy_client_password" <<'PY'
    import json
    import sys
    client_users = json.loads(sys.argv[1] or "{}")
    if client_users:
        for _alias, item in sorted(client_users.items()):
            user = str(item.get("client_user") or "").strip()
            password = str(item.get("client_password") or "").strip()
            if user and password:
                print(f"{user}|{password}")
    elif sys.argv[2] and sys.argv[3]:
        print(f"{sys.argv[2]}|{sys.argv[3]}")
    PY
      printf 'SecureNatEnable\n'
      printf 'SecureNatHostSet /MAC:none /IP:%s /MASK:%s\n' "$server_ip" "$netmask"
      printf 'DhcpSet /START:%s /END:%s /MASK:%s /EXPIRE:7200 /GW:%s /DNS:1.1.1.1 /DNS2:8.8.8.8 /DOMAIN:none /LOG:yes\n' "$client_ip" "$client_ip" "$netmask" "$server_ip"
      printf 'Flush\n'
    } | while IFS= read -r line; do
      case "$line" in
        *'|'*)
          client_user="${line%%|*}"
          client_password="${line#*|}"
          if ! echo "$users" | grep -Fq "$client_user"; then
            printf 'UserCreate %s /GROUP:none /REALNAME:none /NOTE:none\n' "$client_user"
          fi
          printf 'UserPasswordSet %s /PASSWORD:%s\n' "$client_user" "$client_password"
          ;;
        *)
          printf '%s\n' "$line"
          ;;
      esac
    done > "$input"
    timeout "${timeout_s}s" docker exec -i -e VPNCMD_PASSWORD="$password" "$server_container" sh -c 'tmp="$(mktemp)"; trap "rm -f \"$tmp\"" EXIT; cat > "$tmp"; timeout "$1" vpncmd localhost:5555 /SERVER /PASSWORD:"$VPNCMD_PASSWORD" /IN:"$tmp"; rc="$?"; if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then pkill -KILL vpncmd 2>/dev/null || true; fi; exit "$rc"' sh "$timeout_s" < "$input" >/tmp/platform-router-softether-server-config.out 2>&1 || {
      cleanup_vpncmd
      sed -E 's#/PASSWORD:[^[:space:]]+#/PASSWORD:<redacted>#g' /tmp/platform-router-softether-server-config.out >&2
      exit 1
    }
  args:
    executable: /bin/bash
  environment:
    SERVER_PASSWORD: "{{ (platform_router_softether_secrets[item.secret_file]).server_password | default('') }}"
    HUB_PASSWORD: "{{ (platform_router_softether_secrets[item.secret_file]).hub_password | default('') }}"
    CLIENT_USER: "{{ (platform_router_softether_secrets[item.secret_file]).client_user | default('') }}"
    CLIENT_PASSWORD: "{{ (platform_router_softether_secrets[item.secret_file]).client_password | default('') }}"
    CLIENT_USERS_JSON: "{{ (platform_router_softether_secrets[item.secret_file]).client_users | default({}) | to_json }}"
  no_log: true
  changed_when: false
  loop: "{{ platform_router_model.softether_servers | default([]) }}"
  when:
    - platform_router_state == 'present'
    - (platform_router_model.softether_servers | default([])) | length > 0
    - not ansible_check_mode

- name: Configure platform_router explicit route and service policy
  ansible.builtin.shell: |
    set -euo pipefail
    container="{{ platform_router_model.container_name }}"
    next_hop="{{ platform_router_model.next_hop_ipv4 }}"
    policies_json='{{ platform_router_model.policies | to_json }}'
    docker exec -u 0 "$container" sh -ceu 'sysctl -w net.ipv4.ip_forward=1 >/dev/null 2>&1 || true'
    docker exec -u 0 "$container" iptables -P FORWARD DROP
    docker exec -u 0 "$container" iptables -F FORWARD
    docker exec -u 0 "$container" iptables -t nat -N PLATFORM_ROUTER_POSTROUTING 2>/dev/null || true
    docker exec -u 0 "$container" iptables -t nat -C POSTROUTING -j PLATFORM_ROUTER_POSTROUTING 2>/dev/null ||
      docker exec -u 0 "$container" iptables -t nat -A POSTROUTING -j PLATFORM_ROUTER_POSTROUTING
    docker exec -u 0 "$container" iptables -t nat -F PLATFORM_ROUTER_POSTROUTING
    python3 - "$policies_json" <<'PY' | while IFS='|' read -r proto source_cidr destination_ipv4 destination_port route_destination source_side_snat vpn_iface vpn_next_hop snat_ip; do
    import json
    import sys
    for item in json.loads(sys.argv[1]):
        print("|".join([
            item["protocol"],
            item["source_cidr"],
            item["destination_ipv4"],
            str(item["destination_port"]),
            "true" if item["route_destination"] else "false",
            "true" if item["source_side_snat"] else "false",
            item.get("softether_client_iface") or "",
            item.get("softether_client_server_ip") or "",
            item.get("softether_client_ip") or "",
        ]))
    PY
      if [ "$route_destination" = "true" ]; then
        if [ -n "$vpn_iface" ]; then
          docker exec -u 0 "$container" ip route replace "$destination_ipv4/32" via "$vpn_next_hop" dev "$vpn_iface"
        else
          docker exec -u 0 "$container" ip route replace "$destination_ipv4/32" via "$next_hop"
        fi
      fi
      if [ "$source_side_snat" = "true" ]; then
        docker exec -u 0 "$container" iptables -t nat -A PLATFORM_ROUTER_POSTROUTING -p "$proto" -s "$source_cidr" -d "$destination_ipv4/32" --dport "$destination_port" -o "$vpn_iface" -j SNAT --to-source "$snat_ip"
      fi
      docker exec -u 0 "$container" iptables -A FORWARD -p "$proto" -s "$source_cidr" -d "$destination_ipv4/32" --dport "$destination_port" -j ACCEPT
      docker exec -u 0 "$container" iptables -A FORWARD -p "$proto" -s "$destination_ipv4/32" --sport "$destination_port" -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
    done
  args:
    executable: /bin/bash
  changed_when: false
  when:
    - platform_router_state == 'present'
    - not ansible_check_mode

- name: Verify platform_router dataplane tools
  ansible.builtin.shell: |
    set -euo pipefail
    docker exec -u 0 "$CONTAINER" sh -c 'ip route >/dev/null && iptables -S FORWARD >/dev/null'
  args:
    executable: /bin/bash
  environment:
    CONTAINER: "{{ platform_router_model.container_name }}"
  changed_when: false
  when:
    - platform_router_state == 'present'
    - not ansible_check_mode

- name: Stop platform_router container
  ansible.builtin.command:
    cmd: docker compose -f "{{ platform_router_compose_file }}" down
    chdir: "{{ platform_router_root_dir }}"
  changed_when: true
  when:
    - platform_router_state == 'absent'
    - platform_router_compose_stat.stat.exists | default(false)
    - not ansible_check_mode

- name: Purge platform_router runtime data when explicitly requested
  ansible.builtin.file:
    path: "{{ platform_router_root_dir }}"
    state: absent
  when:
    - platform_router_state == 'absent'
    - platform_router_purge_data in [true, 'true', 'True']
    - not ansible_check_mode
