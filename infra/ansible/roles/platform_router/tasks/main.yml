---
- name: Validate platform_router state
  ansible.builtin.assert:
    that:
      - platform_router_state in ['present', 'absent']
      - platform_router_purge_data in [true, false, 'true', 'false', 'True', 'False']
      - (platform_router_build_image | default(false)) in [true, false, 'true', 'false', 'True', 'False']
      - (platform_router_softether_runtime_build_image | default(false)) in [true, false, 'true', 'false', 'True', 'False']
      - (platform_router_softether_client_build_image | default(false)) in [true, false, 'true', 'false', 'True', 'False']
    fail_msg: "platform_router_state must be present|absent and platform_router boolean flags must be boolean-like."

- name: Check platform_router compose file
  ansible.builtin.stat:
    path: "{{ platform_router_compose_file }}"
  register: platform_router_compose_stat
  when: platform_router_state == 'absent'

- name: Check platform_router operator files on control node
  ansible.builtin.stat:
    path: "{{ item.path }}"
  delegate_to: localhost
  become: false
  register: platform_router_operator_file_stats
  loop:
    - { path: "{{ platform_router_operator_config_file }}", label: "platform_router config" }
    - { path: "{{ platform_router_operator_platform_networks_file }}", label: "platform_networks config" }
    - { path: "{{ platform_router_operator_l3_vps_links_file }}", label: "softether l3-vps links" }
  when: platform_router_state == 'present'

- name: Require platform_router operator files
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
    fail_msg: "Missing {{ item.item.label }}: {{ item.item.path }}"
  loop: "{{ platform_router_operator_file_stats.results }}"
  when: platform_router_state == 'present'

- name: Plan platform_router SoftEther runtime image build on orchestration controller
  ansible.builtin.shell: |
    set -euo pipefail
    test -f "$CONTEXT/Dockerfile"
    context_hash="$(find "$CONTEXT" -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print substr($1, 1, 12)}')"
    git_ref="$(git -C "$REPO_ROOT" rev-parse --short=12 HEAD 2>/dev/null || true)"
    if [ -z "$git_ref" ]; then
      git_ref="nogit"
    fi
    stamp="$(date -u +%Y%m%dT%H%M%SZ)"
    image_ref="${IMAGE_REPOSITORY}:${stamp}-${git_ref}-${context_hash}"
    python3 - "$image_ref" "$CONTEXT" <<'PY'
    import json
    import sys
    print(json.dumps({"image_ref": sys.argv[1], "context": sys.argv[2]}, sort_keys=True))
    PY
  args:
    executable: /bin/bash
  environment:
    CONTEXT: "{{ platform_router_softether_client_build_context }}"
    IMAGE_REPOSITORY: "{{ platform_router_softether_client_image_repository }}"
    REPO_ROOT: "{{ playbook_dir }}/../.."
  delegate_to: localhost
  become: false
  check_mode: false
  run_once: true
  register: platform_router_softether_client_build_plan_command
  changed_when: false
  when:
    - platform_router_state == 'present'
    - platform_router_softether_runtime_build_image | bool

- name: Store platform_router SoftEther runtime image build plan
  ansible.builtin.set_fact:
    platform_router_softether_client_build_plan: "{{ platform_router_softether_client_build_plan_command.stdout | from_json }}"
  run_once: true
  when:
    - platform_router_state == 'present'
    - platform_router_softether_runtime_build_image | bool

- name: Use generated platform_router SoftEther runtime image ref for this rollout
  ansible.builtin.set_fact:
    platform_router_softether_client_image: "{{ hostvars[ansible_play_hosts_all[0]].platform_router_softether_client_build_plan.image_ref }}"
    platform_router_softether_server_image: "{{ hostvars[ansible_play_hosts_all[0]].platform_router_softether_client_build_plan.image_ref }}"
    platform_router_softether_client_remote_archive: "/tmp/ai-sp-softether-runtime-{{ hostvars[ansible_play_hosts_all[0]].platform_router_softether_client_build_plan.image_ref | hash('sha1') }}.tar"
  when:
    - platform_router_state == 'present'
    - platform_router_softether_runtime_build_image | bool

- name: Build platform_router model
  ansible.builtin.shell: |
    set -euo pipefail
    python3 - <<'PY'
    import ipaddress
    import json
    import os
    import re
    import sys

    try:
        import yaml
    except Exception as exc:
        print(f"PyYAML is required to read platform_router config: {exc}", file=sys.stderr)
        sys.exit(1)

    alias = os.environ["INVENTORY_HOSTNAME"]
    config_file = os.environ["CONFIG_FILE"]
    platform_networks_file = os.environ["PLATFORM_NETWORKS_FILE"]
    l3_links_file = os.environ["L3_LINKS_FILE"]
    l3_secrets_dir = os.environ["L3_SECRETS_DIR"]

    def fail(message):
        print(message, file=sys.stderr)
        sys.exit(1)

    def load_yaml(path):
        with open(path, encoding="utf-8") as handle:
            return yaml.safe_load(handle) or {}

    config = load_yaml(config_file).get("platform_router") or {}
    platform_networks = load_yaml(platform_networks_file).get("nodes") or {}
    l3_links = [
        item for item in (load_yaml(l3_links_file).get("links") or [])
        if str(item.get("state", "present")).lower() == "present"
    ]
    all_configured_egress_paths = [
        item for item in (config.get("egress_paths") or [])
        if str(item.get("state", "present")).lower() == "present"
    ]
    requested_egress_aliases = [
        item for item in os.environ.get("EGRESS_PATH_ALIASES", "").split("+")
        if item
    ]
    all_egress_aliases = {
        str(item.get("alias") or "").strip()
        for item in all_configured_egress_paths
    }
    unknown_egress_aliases = set(requested_egress_aliases) - all_egress_aliases
    if unknown_egress_aliases:
        fail(
            "unknown platform_router egress aliases: "
            + ", ".join(sorted(unknown_egress_aliases))
        )
    configured_egress_paths = [
        item for item in all_configured_egress_paths
        if not requested_egress_aliases
        or str(item.get("alias") or "").strip() in requested_egress_aliases
    ]
    selected_egress_links = {
        str(item.get("l3_vps_link") or "").strip()
        for item in configured_egress_paths
    }
    all_egress_links = {
        str(item.get("l3_vps_link") or "").strip()
        for item in all_configured_egress_paths
    }

    def parse_mark(value, label):
        try:
            result = int(str(value), 0)
        except (TypeError, ValueError) as exc:
            fail(f"{label} must be an integer or hexadecimal mark: {exc}")
        if result < 1 or result > 0xFFFFFFFF:
            fail(f"{label} must be between 1 and 0xffffffff")
        return result

    seen_egress_aliases = set()
    seen_egress_marks = set()
    seen_egress_tables = set()
    seen_egress_links = set()
    seen_egress_subnets = set()
    for item in all_configured_egress_paths:
        path_alias = str(item.get("alias") or "").strip()
        link_name = str(item.get("l3_vps_link") or "").strip()
        source_alias = str(item.get("source_alias") or "").strip()
        target_alias = str(item.get("target_alias") or "").strip()
        if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]*", path_alias):
            fail("platform_router egress path alias is invalid")
        if not link_name or not source_alias or not target_alias or source_alias == target_alias:
            fail(f"platform_router egress path {path_alias} has invalid endpoints or link")
        route_mark = parse_mark(item.get("route_mark"), f"egress path {path_alias} route_mark")
        route_table = int(item.get("route_table") or 0)
        if route_table < 1 or route_table > 0x7FFFFFFF:
            fail(f"platform_router egress path {path_alias} route_table is invalid")
        matching_l3 = [value for value in l3_links if str(value.get("name") or "") == link_name]
        if len(matching_l3) != 1:
            fail(f"platform_router egress path {path_alias} references missing/non-unique link {link_name}")
        vpn_subnet = str(ipaddress.ip_network(str(matching_l3[0].get("subnet") or ""), strict=True))
        if str(matching_l3[0].get("runtime_mode") or "").strip().lower() != "platform_router_sidecar":
            fail(f"platform_router egress path {path_alias} must use platform_router_sidecar")
        if str(matching_l3[0].get("access_mode") or "").strip().lower() != "routed_tap":
            fail(f"platform_router egress path {path_alias} must use routed_tap")
        if path_alias in seen_egress_aliases or route_mark in seen_egress_marks or route_table in seen_egress_tables or link_name in seen_egress_links or vpn_subnet in seen_egress_subnets:
            fail("platform_router egress aliases, marks, tables, links, and VPN subnets must be unique")
        seen_egress_aliases.add(path_alias)
        seen_egress_marks.add(route_mark)
        seen_egress_tables.add(route_table)
        seen_egress_links.add(link_name)
        seen_egress_subnets.add(vpn_subnet)

    selected = [
        link for link in (config.get("links") or [])
        if str(link.get("state", "present")).lower() == "present"
        and (
            str(link.get("l3_vps_link") or link.get("name") or "") not in all_egress_links
            or str(link.get("l3_vps_link") or link.get("name") or "") in selected_egress_links
        )
        and alias in (
            {str(link.get("source_alias") or ""), str(link.get("target_alias") or "")}
            | {str(item) for item in (link.get("source_aliases") or [])}
        )
    ]
    if not selected:
        fail(f"{alias} must participate in at least one present platform_router link")

    if alias not in platform_networks:
        fail(f"platform_networks config has no node entry for {alias}")
    node_networks = platform_networks[alias]
    for network_role in ("data", "app"):
        item = node_networks.get(network_role) or {}
        if not item.get("name") or not item.get("subnet"):
            fail(f"platform_networks {alias}.{network_role} requires name and subnet")

    data_subnet = ipaddress.ip_network(str(node_networks["data"]["subnet"]), strict=True)
    app_subnet = ipaddress.ip_network(str(node_networks["app"]["subnet"]), strict=True)

    def link_suffix(link_name):
        digits = "".join(ch for ch in str(link_name) if ch.isdigit())
        return "pg" + digits if digits else str(link_name).replace("_", "-").replace(".", "-")

    def sidecar_value(base, suffix, default_suffix):
        return base if suffix == default_suffix else f"{base}-{suffix}"

    def compose_network_name(prefix, suffix):
        return prefix if suffix == "pg48" else f"{prefix}_{suffix}"

    data_ipv4 = None
    app_ipv4 = None
    transport_networks = []
    management_networks = []
    policies = []
    softether_clients = []
    softether_servers = []
    egress_paths = []

    for link in selected:
        link_name = str(link.get("l3_vps_link") or link.get("name") or "").strip()
        suffix = link_suffix(link_name)
        l3_matches = [item for item in l3_links if str(item.get("name") or "") == link_name]
        if len(l3_matches) != 1:
            fail(f"platform_router link {link.get('name')} references missing/non-unique l3_vps_link: {link_name}")
        l3_link = l3_matches[0]
        l3_client_aliases = {str(l3_link.get("client_alias") or "")} | {str(item) for item in (l3_link.get("client_aliases") or [])}
        if isinstance(l3_link.get("standby_clients"), dict):
            l3_client_aliases |= {str(item) for item in l3_link.get("standby_clients")}
        if alias not in ({str(l3_link.get("server_alias") or "")} | l3_client_aliases):
            fail(f"{alias} is not a participant in softether_l3_vps link {link_name}")

        role = "server" if alias == str(l3_link.get("server_alias") or "") else "client"
        runtime_mode = str(l3_link.get("runtime_mode") or "standalone").strip().lower()
        if runtime_mode not in {"standalone", "platform_router_sidecar"}:
            fail(f"softether_l3_vps link {link_name} has unsupported runtime_mode: {runtime_mode}")
        l3_network_name = str(l3_link.get(f"{role}_network_name") or "").strip()
        l3_network_subnet = ipaddress.ip_network(str(l3_link.get(f"{role}_network_subnet") or ""), strict=True)
        if not l3_network_name:
            fail(f"softether_l3_vps link {link_name} has no {role}_network_name")

        management_network = {"enabled": False}
        if role == "server":
            management_network_name = str(l3_link.get("server_management_network_name") or "").strip()
            management_network_subnet = str(l3_link.get("server_management_network_subnet") or "").strip()
            management_container_ipv4 = str(l3_link.get("server_management_container_ipv4") or "").strip()
            management_allowed_source_ipv4 = str(l3_link.get("server_management_allowed_source_ipv4") or "").strip()
            if any([management_network_name, management_network_subnet, management_container_ipv4, management_allowed_source_ipv4]):
                if not all([management_network_name, management_network_subnet, management_container_ipv4, management_allowed_source_ipv4]):
                    fail(f"softether_l3_vps link {link_name} server management network requires name, subnet, container IP, and allowed source IP")
                parsed_management_subnet = ipaddress.ip_network(management_network_subnet, strict=True)
                parsed_management_ip = ipaddress.ip_address(management_container_ipv4)
                parsed_management_source_ip = ipaddress.ip_address(management_allowed_source_ipv4)
                if parsed_management_ip not in parsed_management_subnet:
                    fail(f"softether_l3_vps link {link_name} management IP {parsed_management_ip} must be inside {parsed_management_subnet}")
                if parsed_management_source_ip not in parsed_management_subnet:
                    fail(f"softether_l3_vps link {link_name} management allowed source IP {parsed_management_source_ip} must be inside {parsed_management_subnet}")
                if parsed_management_subnet.overlaps(l3_network_subnet):
                    fail(f"softether_l3_vps link {link_name} management network {parsed_management_subnet} must not overlap transport network {l3_network_subnet}")
                management_network = {
                    "enabled": True,
                    "compose_name": compose_network_name("l3_mgmt", suffix),
                    "name": management_network_name,
                    "subnet": str(parsed_management_subnet),
                    "container_ipv4": str(parsed_management_ip),
                    "allowed_source_ipv4": str(parsed_management_source_ip),
                }

        router = (link.get("routers") or {}).get(alias) or {}
        if not router:
            fail(f"platform_router link {link.get('name')} has no routers.{alias} entry")

        link_data_ipv4 = ipaddress.ip_address(str(router.get("data_ipv4") or ""))
        link_app_ipv4 = ipaddress.ip_address(str(router.get("app_ipv4") or ""))
        if link_data_ipv4 not in data_subnet:
            fail(f"platform_router {alias} data IP {link_data_ipv4} must be inside {data_subnet}")
        if link_app_ipv4 not in app_subnet:
            fail(f"platform_router {alias} app IP {link_app_ipv4} must be inside {app_subnet}")
        if data_ipv4 is None:
            data_ipv4 = link_data_ipv4
        elif data_ipv4 != link_data_ipv4:
            fail(f"platform_router {alias} data_ipv4 must be identical across links")
        if app_ipv4 is None:
            app_ipv4 = link_app_ipv4
        elif app_ipv4 != link_app_ipv4:
            fail(f"platform_router {alias} app_ipv4 must be identical across links")

        transport_network_enabled = role == "server"
        transport_ipv4 = None
        if router.get("transport_ipv4"):
            transport_ipv4 = ipaddress.ip_address(str(router["transport_ipv4"]))
        next_hop_ipv4 = None
        if router.get("next_hop_ipv4"):
            next_hop_ipv4 = ipaddress.ip_address(str(router["next_hop_ipv4"]))
        if transport_network_enabled:
            if transport_ipv4 not in l3_network_subnet:
                fail(f"platform_router {alias} transport IP {transport_ipv4} must be inside {l3_network_subnet}")
            transport_networks.append({
                "compose_name": compose_network_name("l3_transport", suffix),
                "name": l3_network_name,
                "container_ipv4": str(transport_ipv4),
            })
        if transport_network_enabled and runtime_mode != "platform_router_sidecar" and next_hop_ipv4 not in l3_network_subnet:
            fail(f"platform_router {alias} next hop {next_hop_ipv4} must be inside {l3_network_subnet}")
        if management_network.get("enabled"):
            management_networks.append(management_network)

        client_name = None
        client_iface = ""
        client_server_ip = ""
        source_aliases = {str(link.get("source_alias") or "")} | {str(item) for item in (link.get("source_aliases") or [])}
        if alias in source_aliases and runtime_mode == "platform_router_sidecar":
            vpn_subnet = ipaddress.ip_network(str(l3_link["subnet"]), strict=True)
            server_ip = ipaddress.ip_address(str(l3_link["server_ip"]))
            standby_clients = l3_link.get("standby_clients") or {}
            standby_client = standby_clients.get(alias) if isinstance(standby_clients, dict) else {}
            client_ip = ipaddress.ip_address(str((standby_client or {}).get("client_ip") or l3_link["client_ip"]))
            client_user = str((standby_client or {}).get("client_user") or "")
            if server_ip not in vpn_subnet or client_ip not in vpn_subnet:
                fail(f"softether_l3_vps link {link_name} VPN endpoint IPs must be inside {vpn_subnet}")
            nic_name = sidecar_value(os.environ["SOFTETHER_CLIENT_NIC"], suffix, "pg48")
            client_name = str(link.get("name") or link_name)
            client_iface = "vpn_" + nic_name
            client_server_ip = str(server_ip)
            softether_clients.append({
                "enabled": True,
                "name": client_name,
                "container_name": sidecar_value(os.environ["SOFTETHER_CLIENT_CONTAINER"], suffix, "pg48"),
                "image": os.environ["SOFTETHER_CLIENT_IMAGE"],
                "legacy_container_name": os.environ["LEGACY_SOFTETHER_CLIENT_CONTAINER"],
                "account_name": sidecar_value(os.environ["SOFTETHER_CLIENT_ACCOUNT"], suffix, "pg48"),
                "nic_name": nic_name,
                "iface": client_iface,
                "server": str(l3_link["server_sni"]) + ":" + str(int(l3_link.get("public_port") or 443)),
                "hub": str(l3_link["hub"]),
                "client_ip": str(client_ip),
                "client_alias": alias,
                "client_user": client_user,
                "server_ip": client_server_ip,
                "prefixlen": vpn_subnet.prefixlen,
                "secret_file": os.path.join(l3_secrets_dir, str(l3_link["name"]) + ".json"),
                "vpncmd_timeout_seconds": int(os.environ["SOFTETHER_CLIENT_VPNCMD_TIMEOUT_SECONDS"]),
                "data_dir": sidecar_value("softether_client_data", suffix, "pg48"),
            })

        if alias == str(link.get("target_alias") or "") and runtime_mode == "platform_router_sidecar":
            vpn_subnet = ipaddress.ip_network(str(l3_link["subnet"]), strict=True)
            server_ip = ipaddress.ip_address(str(l3_link["server_ip"]))
            client_ip = ipaddress.ip_address(str(l3_link["client_ip"]))
            if server_ip not in vpn_subnet or client_ip not in vpn_subnet:
                fail(f"softether_l3_vps link {link_name} VPN endpoint IPs must be inside {vpn_subnet}")
            access_mode = str(l3_link.get("access_mode") or "secure_nat").strip().lower()
            if access_mode not in {"secure_nat", "routed_tap"}:
                fail(f"softether_l3_vps link {link_name} has unsupported access_mode: {access_mode}")
            tap_name = str(l3_link.get("tap_name") or "").strip()
            client_pool_start = ipaddress.ip_address(str(l3_link.get("client_pool_start") or client_ip))
            client_pool_end = ipaddress.ip_address(str(l3_link.get("client_pool_end") or client_ip))
            pushed_routes = [
                ipaddress.ip_network(str(item), strict=True)
                for item in (l3_link.get("pushed_routes") or [])
            ]
            dhcp_enabled = l3_link.get("dhcp_enabled", True)
            if not isinstance(dhcp_enabled, bool):
                fail(f"softether l3-vps link {link_name} dhcp_enabled must be boolean")
            if access_mode == "routed_tap":
                if not tap_name or len(tap_name) > 11 or not all(ch.isalnum() or ch in "_-" for ch in tap_name):
                    fail(f"softether_l3_vps link {link_name} routed_tap requires a safe tap_name of at most 11 characters")
                if client_pool_start not in vpn_subnet or client_pool_end not in vpn_subnet or client_pool_start > client_pool_end:
                    fail(f"softether_l3_vps link {link_name} client pool must be ordered and inside {vpn_subnet}")
                if server_ip >= client_pool_start and server_ip <= client_pool_end:
                    fail(f"softether_l3_vps link {link_name} server IP must not be inside the client pool")
                if dhcp_enabled and not pushed_routes:
                    fail(f"softether_l3_vps link {link_name} routed_tap requires at least one pushed route")
            managed_client_user_prefix = str(
                l3_link.get("managed_client_user_prefix") or ""
            ).strip()
            protected_client_users = [
                str(value).strip()
                for value in (l3_link.get("protected_client_users") or [])
                if str(value).strip()
            ]
            managed_client_user_limit = int(
                l3_link.get("managed_client_user_limit") or 0
            )
            if managed_client_user_prefix:
                if not re.fullmatch(
                    r"[A-Za-z][A-Za-z0-9_]{2,23}",
                    managed_client_user_prefix,
                ):
                    fail(
                        f"softether_l3_vps link {link_name} has unsafe "
                        "managed_client_user_prefix"
                    )
                if managed_client_user_limit < 1 or managed_client_user_limit > 20:
                    fail(
                        f"softether_l3_vps link {link_name} managed client user "
                        "limit must be between 1 and 20"
                    )
                if any(
                    value.startswith(managed_client_user_prefix)
                    for value in protected_client_users
                ):
                    fail(
                        f"softether_l3_vps link {link_name} protected client users "
                        "must be outside the managed prefix"
                    )
                if any(
                    not re.fullmatch(r"[A-Za-z0-9_]{1,64}", value)
                    for value in protected_client_users
                ):
                    fail(
                        f"softether_l3_vps link {link_name} has an unsafe "
                        "protected client username"
                    )
            admin_allowed_source = str(
                l3_link.get("server_admin_allowed_source_ipv4")
                or management_network.get("allowed_source_ipv4")
                or "127.0.0.1"
            )
            if admin_allowed_source != "127.0.0.1":
                parsed_admin_source = ipaddress.ip_address(admin_allowed_source)
                if parsed_admin_source not in l3_network_subnet and not management_network.get("enabled"):
                    fail(
                        f"softether_l3_vps link {link_name} admin source {parsed_admin_source} "
                        f"must be in the server transport network when no management network is configured"
                    )
            softether_servers.append({
                "enabled": True,
                "name": str(link.get("name") or link_name),
                "container_name": os.environ["SOFTETHER_SERVER_CONTAINER"],
                "image": os.environ["SOFTETHER_SERVER_IMAGE"],
                "legacy_container_name": os.environ["LEGACY_SOFTETHER_SERVER_CONTAINER"],
                "hub": str(l3_link["hub"]),
                "public_port": int(l3_link.get("public_port") or 443),
                "management_port": 5555,
                "extra_listeners": [992],
                "server_ip": str(server_ip),
                "client_ip": str(client_ip),
                "client_pool_start": str(client_pool_start),
                "client_pool_end": str(client_pool_end),
                "netmask": str(vpn_subnet.netmask),
                "prefixlen": vpn_subnet.prefixlen,
                "access_mode": access_mode,
                "tap_name": tap_name,
                "tap_iface": "tap_" + tap_name if tap_name else "",
                "pushed_routes": [str(item) for item in pushed_routes],
                "dhcp_enabled": dhcp_enabled,
                "secret_file": os.path.join(l3_secrets_dir, str(l3_link["name"]) + ".json"),
                "vpncmd_timeout_seconds": int(os.environ["SOFTETHER_CLIENT_VPNCMD_TIMEOUT_SECONDS"]),
                "management_allowed_source_ipv4": admin_allowed_source,
                "managed_client_user_prefix": managed_client_user_prefix,
                "managed_client_user_limit": managed_client_user_limit,
                "protected_client_users": protected_client_users,
            })

        for policy in link.get("policies") or []:
            if str(policy.get("state", "present")).lower() != "present":
                continue
            destination_ipv4 = ipaddress.ip_address(str(policy.get("destination_ipv4") or ""))
            source_cidr = ipaddress.ip_network(str(policy.get("source_cidr") or "0.0.0.0/0"), strict=False)
            destination_port = int(policy.get("destination_port") or 0)
            if destination_port < 1 or destination_port > 65535:
                fail(f"platform_router policy {policy.get('name')} has invalid destination_port")
            protocol = str(policy.get("protocol") or "tcp").lower()
            if protocol not in {"tcp", "udp"}:
                fail(f"platform_router policy {policy.get('name')} protocol must be tcp or udp")
            source_alias = str(policy.get("source_alias") or link.get("source_alias"))
            target_alias = str(policy.get("target_alias") or link.get("target_alias"))
            if alias not in {source_alias, target_alias}:
                continue
            policy_vpn_next_hop = client_server_ip
            if (
                alias == source_alias
                and client_name
                and target_alias != str(link.get("target_alias") or "")
            ):
                peer_clients = l3_link.get("standby_clients") or {}
                peer_client = peer_clients.get(target_alias) if isinstance(peer_clients, dict) else {}
                peer_client_ip_value = str((peer_client or {}).get("client_ip") or "")
                if not peer_client_ip_value:
                    fail(
                        f"platform_router policy {policy.get('name')} target client "
                        f"{target_alias} has no configured VPN client IP"
                    )
                peer_client_ip = ipaddress.ip_address(peer_client_ip_value)
                if peer_client_ip not in vpn_subnet:
                    fail(
                        f"platform_router policy {policy.get('name')} target client "
                        f"{target_alias} must have an IP inside {vpn_subnet}"
                    )
                policy_vpn_next_hop = str(peer_client_ip)
            target_source_cidr = ipaddress.ip_network(str(policy.get("target_source_cidr") or source_cidr), strict=False)
            effective_source_cidr = target_source_cidr if alias == target_alias else source_cidr
            target_snat_ipv4 = ""
            if alias == target_alias and policy.get("target_snat_ipv4"):
                parsed_target_snat_ipv4 = ipaddress.ip_address(str(policy["target_snat_ipv4"]))
                if parsed_target_snat_ipv4 not in {data_ipv4, app_ipv4}:
                    fail(
                        f"platform_router policy {policy.get('name')} target_snat_ipv4 "
                        f"must equal the target router data_ipv4 or app_ipv4"
                    )
                target_snat_ipv4 = str(parsed_target_snat_ipv4)
            return_route_cidr = ""
            return_route_next_hop = ""
            if (
                alias == target_alias
                and client_name
                and target_source_cidr == source_cidr
                and source_alias != str(link.get("target_alias") or "")
            ):
                peer_clients = l3_link.get("standby_clients") or {}
                peer_client = peer_clients.get(source_alias) if isinstance(peer_clients, dict) else {}
                peer_client_ip_value = str((peer_client or {}).get("client_ip") or "")
                if not peer_client_ip_value:
                    fail(
                        f"platform_router policy {policy.get('name')} source client "
                        f"{source_alias} has no configured VPN client IP"
                    )
                peer_client_ip = ipaddress.ip_address(peer_client_ip_value)
                if peer_client_ip not in vpn_subnet:
                    fail(
                        f"platform_router policy {policy.get('name')} source client "
                        f"{source_alias} must have an IP inside {vpn_subnet}"
                    )
                return_route_cidr = str(source_cidr)
                return_route_next_hop = str(peer_client_ip)
            policies.append({
                "name": str(policy.get("name") or f"{protocol}-{destination_ipv4}-{destination_port}"),
                "link_name": str(link.get("name") or link_name),
                "source_alias": source_alias,
                "target_alias": target_alias,
                "protocol": protocol,
                "source_cidr": str(effective_source_cidr),
                "destination_ipv4": str(destination_ipv4),
                "destination_port": destination_port,
                "route_destination": alias == source_alias,
                "softether_client_name": client_name or "",
                "softether_client_iface": client_iface,
                "softether_client_next_hop": policy_vpn_next_hop,
                "softether_return_cidr": return_route_cidr,
                "softether_return_next_hop": return_route_next_hop,
                "target_snat_ipv4": target_snat_ipv4,
            })

    for item in configured_egress_paths:
        source_alias = str(item["source_alias"])
        target_alias = str(item["target_alias"])
        if alias not in {source_alias, target_alias}:
            continue
        path_alias = str(item["alias"])
        link_name = str(item["l3_vps_link"])
        matching_links = [
            value for value in (config.get("links") or [])
            if str(value.get("l3_vps_link") or value.get("name") or "") == link_name
            and str(value.get("state", "present")).lower() == "present"
        ]
        if len(matching_links) != 1:
            fail(f"platform_router egress path {path_alias} requires one present platform_router link")
        matching_l3 = [value for value in l3_links if str(value.get("name") or "") == link_name][0]
        source_cidrs = [
            ipaddress.ip_network(str(value), strict=True)
            for value in (item.get("source_cidrs") or [])
        ]
        if not source_cidrs or any(value.version != 4 or value.prefixlen != 32 for value in source_cidrs):
            fail(f"platform_router egress path {path_alias} requires IPv4 /32 source_cidrs")
        route_mark = parse_mark(item.get("route_mark"), f"egress path {path_alias} route_mark")
        route_table = int(item["route_table"])
        source_gateway = ipaddress.ip_address(str(item.get("source_gateway_ipv4") or ""))
        target_snat = ipaddress.ip_address(str(item.get("target_snat_ipv4") or ""))
        role = "source" if alias == source_alias else "target"
        path = {
            "alias": path_alias,
            "role": role,
            "source_alias": source_alias,
            "target_alias": target_alias,
            "l3_vps_link": link_name,
            "route_mark": f"0x{route_mark:x}",
            "route_mark_decimal": route_mark,
            "route_table": route_table,
            "route_rule_priority": 10000 + route_table,
            "gateway_ipv4": str(source_gateway),
            "target_snat_ipv4": str(target_snat),
            "source_cidrs": [str(value) for value in source_cidrs],
            "tunnel_next_hop": str(matching_l3["server_ip"]),
            "status": "planned",
        }
        if path["route_rule_priority"] > 32765:
            fail(f"platform_router egress path {path_alias} route priority is too large")
        if role == "source":
            if source_gateway != app_ipv4:
                fail(f"platform_router egress path {path_alias} gateway must equal the source app router IP")
            clients = [value for value in softether_clients if value["name"] == str(matching_links[0].get("name") or link_name)]
            if len(clients) != 1:
                fail(f"platform_router egress path {path_alias} has no unique source tunnel")
            path["tunnel_iface"] = clients[0]["iface"]
        else:
            if target_snat != app_ipv4:
                fail(f"platform_router egress path {path_alias} SNAT must equal the target app router IP")
            servers = [value for value in softether_servers if value["name"] == str(matching_links[0].get("name") or link_name)]
            if len(servers) != 1 or not servers[0].get("tap_iface"):
                fail(f"platform_router egress path {path_alias} has no unique target tap")
            path["tunnel_iface"] = servers[0]["tap_iface"]
        egress_paths.append(path)

    if data_ipv4 is None or app_ipv4 is None:
        fail(f"platform_router {alias} has no data/app router addresses")

    def unique_networks(values, label):
        result = []
        by_name = {}
        for value in values:
            name = value["name"]
            comparable = {key: item for key, item in value.items() if key != "compose_name"}
            if name in by_name and by_name[name] != comparable:
                fail(f"platform_router {alias} has conflicting {label} network {name}")
            if name not in by_name:
                by_name[name] = comparable
                result.append(value)
        return result

    transport_networks = unique_networks(transport_networks, "transport")
    management_networks = unique_networks(management_networks, "management")

    softether_server_runtime = {
        "enabled": bool(softether_servers),
        "container_name": os.environ["SOFTETHER_SERVER_CONTAINER"],
        "image": os.environ["SOFTETHER_SERVER_IMAGE"],
        "legacy_container_name": os.environ["LEGACY_SOFTETHER_SERVER_CONTAINER"],
        "data_dir": "softether_server_data",
        "logs_dir": "softether_server_logs",
        "adminip_file": "softether_server_adminip.txt",
    }
    softether_client = softether_clients[0] if len(softether_clients) == 1 else {"enabled": False}
    softether_server = softether_server_runtime if softether_servers else {"enabled": False}
    management_network = management_networks[0] if len(management_networks) == 1 else {"enabled": False}
    transport_network_enabled = bool(transport_networks)
    transport_network_name = transport_networks[0]["name"] if len(transport_networks) == 1 else ""
    transport_ipv4 = transport_networks[0]["container_ipv4"] if len(transport_networks) == 1 else ""
    next_hop_ipv4 = ""

    model = {
        "alias": alias,
        "container_name": str(config.get("container_name") or os.environ["DEFAULT_CONTAINER_NAME"]),
        "link_name": str(selected[0].get("name") or selected[0].get("l3_vps_link") or ""),
        "role": "multi" if len(selected) > 1 else ("server" if softether_servers else "client"),
        "runtime_mode": "multi" if len(selected) > 1 else str((l3_links[0].get("runtime_mode") if l3_links else "standalone") or "standalone"),
        "transport_network_enabled": transport_network_enabled,
        "transport_network_name": transport_network_name,
        "transport_ipv4": str(transport_ipv4) if transport_ipv4 else "",
        "next_hop_ipv4": str(next_hop_ipv4) if next_hop_ipv4 else "",
        "management_network": management_network,
        "transport_networks": transport_networks,
        "management_networks": management_networks,
        "data_network_name": str(node_networks["data"]["name"]),
        "data_ipv4": str(data_ipv4),
        "app_network_name": str(node_networks["app"]["name"]),
        "app_ipv4": str(app_ipv4),
        "policies": policies,
        "egress_paths": egress_paths,
        "softether_client": softether_client,
        "softether_server": softether_server,
        "softether_server_runtime": softether_server_runtime,
        "softether_clients": softether_clients,
        "softether_servers": softether_servers,
    }
    print(json.dumps(model, sort_keys=True))
    PY
  args:
    executable: /bin/bash
  environment:
    INVENTORY_HOSTNAME: "{{ inventory_hostname }}"
    CONFIG_FILE: "{{ platform_router_operator_config_file }}"
    PLATFORM_NETWORKS_FILE: "{{ platform_router_operator_platform_networks_file }}"
    L3_LINKS_FILE: "{{ platform_router_operator_l3_vps_links_file }}"
    L3_SECRETS_DIR: "{{ platform_router_operator_l3_vps_secrets_dir }}"
    EGRESS_PATH_ALIASES: "{{ platform_router_egress_path_aliases | default('') }}"
    DEFAULT_CONTAINER_NAME: "{{ platform_router_container_name }}"
    SOFTETHER_CLIENT_IMAGE: "{{ platform_router_softether_client_image }}"
    SOFTETHER_CLIENT_CONTAINER: "{{ platform_router_softether_client_container_name }}"
    SOFTETHER_CLIENT_NIC: "{{ platform_router_softether_client_nic_name }}"
    SOFTETHER_CLIENT_ACCOUNT: "{{ platform_router_softether_client_account_name }}"
    SOFTETHER_CLIENT_VPNCMD_TIMEOUT_SECONDS: "{{ platform_router_softether_client_vpncmd_timeout_seconds }}"
    LEGACY_SOFTETHER_CLIENT_CONTAINER: "{{ platform_router_legacy_softether_l3_vps_client_container_name }}"
    SOFTETHER_SERVER_IMAGE: "{{ platform_router_softether_server_image }}"
    SOFTETHER_SERVER_CONTAINER: "{{ platform_router_softether_server_container_name }}"
    LEGACY_SOFTETHER_SERVER_CONTAINER: "{{ platform_router_legacy_softether_l3_vps_server_container_name }}"
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  register: platform_router_model_command
  when: platform_router_state == 'present'

- name: Store platform_router model
  ansible.builtin.set_fact:
    platform_router_model: "{{ platform_router_model_command.stdout | from_json }}"
  when: platform_router_state == 'present'

- name: Accept cumulative platform_router egress selector
  ansible.builtin.assert:
    that:
      - >-
        (
          platform_router_model.egress_paths
          | default([])
          | map(attribute='alias')
          | reject('in', platform_router_egress_path_aliases.split('+'))
          | list
          | length
        ) == 0
    fail_msg: "Resolved platform_router model contains an egress path outside the cumulative selector."
  when:
    - platform_router_state == 'present'
    - platform_router_egress_path_aliases | default('') | length > 0

- name: Show safe platform_router preflight contract
  ansible.builtin.debug:
    msg:
      action: platform-router
      alias: "{{ inventory_hostname }}"
      check_mode: "{{ ansible_check_mode | bool }}"
      check_mode_mutations: false
      runtime_mutations: false
      receipt_written: false
      cumulative_selector: "{{ platform_router_egress_path_aliases | default('') }}"
      egress_paths: "{{ platform_router_model.egress_paths | default([]) }}"
      softether_clients: "{{ platform_router_model.softether_clients | default([]) | map(attribute='name') | list }}"
      softether_hubs: "{{ platform_router_model.softether_servers | default([]) | map(attribute='hub') | list }}"
      existing_policy_links: "{{ platform_router_model.policies | default([]) | map(attribute='link_name') | unique | list }}"
  when:
    - platform_router_state == 'present'
    - ansible_check_mode

- name: Validate platform_router SoftEther client secret presence
  ansible.builtin.shell: |
    set -euo pipefail
    python3 - "$MODEL_JSON" <<'PY'
    import json
    import os
    import sys
    model = json.loads(sys.argv[1])
    paths = []
    for item in model.get("softether_clients", []) + model.get("softether_servers", []):
        path = str(item.get("secret_file") or "")
        if path and path not in paths:
            paths.append(path)
    for path in paths:
        if not os.path.isfile(path) or os.path.getsize(path) <= 0:
            print(f"missing or empty SoftEther secret: {path}", file=sys.stderr)
            sys.exit(1)
    PY
  args:
    executable: /bin/bash
  environment:
    MODEL_JSON: "{{ platform_router_model | to_json }}"
  delegate_to: localhost
  become: false
  changed_when: false
  when:
    - platform_router_state == 'present'
    - ((platform_router_model.softether_clients | default([])) | length > 0) or ((platform_router_model.softether_servers | default([])) | length > 0)
    - not ansible_check_mode

- name: Load platform_router SoftEther client secret
  ansible.builtin.shell: |
    set -euo pipefail
    python3 - '{{ platform_router_model | to_json }}' <<'PY'
    import json
    import sys

    model = json.loads(sys.argv[1])
    required = ["server_password", "hub_password", "client_user", "client_password"]
    paths = []
    for item in model.get("softether_clients", []) + model.get("softether_servers", []):
        path = str(item.get("secret_file") or "")
        if path and path not in paths:
            paths.append(path)
    result = {}
    for path in paths:
        with open(path, encoding="utf-8") as handle:
            data = json.load(handle)
        missing = [key for key in ["server_password", "hub_password"] if not str(data.get(key) or "")]
        client_users = data.get("client_users") or {}
        if not client_users:
            missing.extend([key for key in ["client_user", "client_password"] if not str(data.get(key) or "")])
        elif not isinstance(client_users, dict):
            print(f"client_users in {path} must be a map", file=sys.stderr)
            sys.exit(1)
        else:
            for alias, client in client_users.items():
                if not isinstance(client, dict) or not str(client.get("client_user") or "") or not str(client.get("client_password") or ""):
                    print(f"client_users.{alias} in {path} requires client_user and client_password", file=sys.stderr)
                    sys.exit(1)
        if missing:
            print(f"missing keys in {path}: {', '.join(missing)}", file=sys.stderr)
            sys.exit(1)
        item = {key: str(data[key]) for key in ["server_password", "hub_password"]}
        item["client_user"] = str(data.get("client_user") or "")
        item["client_password"] = str(data.get("client_password") or "")
        item["client_users"] = data.get("client_users") or {}
        result[path] = item
    server_paths = {
        str(item.get("secret_file") or "")
        for item in model.get("softether_servers", [])
        if str(item.get("secret_file") or "")
    }
    server_passwords = {result[path]["server_password"] for path in server_paths}
    if len(server_passwords) > 1:
        print(
            "all hubs in one per-node SoftEther server runtime must share its server_password",
            file=sys.stderr,
        )
        sys.exit(1)
    print(json.dumps(result, sort_keys=True))
    PY
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true
  register: platform_router_softether_client_secret_command
  when:
    - platform_router_state == 'present'
    - ((platform_router_model.softether_clients | default([])) | length > 0) or ((platform_router_model.softether_servers | default([])) | length > 0)
    - not ansible_check_mode

- name: Store platform_router SoftEther client secret
  ansible.builtin.set_fact:
    platform_router_softether_secrets: "{{ platform_router_softether_client_secret_command.stdout | from_json }}"
    platform_router_softether_client_secret: "{{ ((platform_router_softether_client_secret_command.stdout | from_json).values() | list | first) | default({}) }}"
  no_log: true
  when:
    - platform_router_state == 'present'
    - ((platform_router_model.softether_clients | default([])) | length > 0) or ((platform_router_model.softether_servers | default([])) | length > 0)
    - platform_router_softether_client_secret_command is defined
    - not (platform_router_softether_client_secret_command.skipped | default(false))
    - not ansible_check_mode

- name: Plan platform_router image build on orchestration controller
  ansible.builtin.shell: |
    set -euo pipefail
    test -f "$CONTEXT/Dockerfile"
    dockerfile_hash="$(sha256sum "$CONTEXT/Dockerfile" | awk '{print substr($1, 1, 12)}')"
    git_ref="$(git -C "$REPO_ROOT" rev-parse --short=12 HEAD 2>/dev/null || true)"
    if [ -z "$git_ref" ]; then
      git_ref="nogit"
    fi
    stamp="$(date -u +%Y%m%dT%H%M%SZ)"
    image_ref="${IMAGE_REPOSITORY}:${stamp}-${git_ref}-${dockerfile_hash}"
    python3 - "$image_ref" "$CONTEXT" <<'PY'
    import json
    import sys
    print(json.dumps({"image_ref": sys.argv[1], "context": sys.argv[2]}, sort_keys=True))
    PY
  args:
    executable: /bin/bash
  environment:
    CONTEXT: "{{ platform_router_build_context }}"
    IMAGE_REPOSITORY: "{{ platform_router_image_repository }}"
    REPO_ROOT: "{{ playbook_dir }}/../.."
  delegate_to: localhost
  become: false
  check_mode: false
  run_once: true
  register: platform_router_build_plan_command
  changed_when: false
  when:
    - platform_router_state == 'present'
    - platform_router_build_image | bool

- name: Store platform_router image build plan
  ansible.builtin.set_fact:
    platform_router_build_plan: "{{ platform_router_build_plan_command.stdout | from_json }}"
  run_once: true
  when:
    - platform_router_state == 'present'
    - platform_router_build_image | bool

- name: Use generated platform_router image ref for this rollout
  ansible.builtin.set_fact:
    platform_router_image: "{{ hostvars[ansible_play_hosts_all[0]].platform_router_build_plan.image_ref }}"
    platform_router_remote_archive: "/tmp/ai-sp-platform-router-{{ hostvars[ansible_play_hosts_all[0]].platform_router_build_plan.image_ref | hash('sha1') }}.tar"
  when:
    - platform_router_state == 'present'
    - platform_router_build_image | bool

- name: Ensure platform_router runtime directory
  ansible.builtin.file:
    path: "{{ platform_router_root_dir }}"
    state: directory
    mode: "0750"
  when: platform_router_state == 'present'

- name: Render platform_router Docker Compose
  ansible.builtin.template:
    src: docker-compose.platform-router.yml.j2
    dest: "{{ platform_router_compose_file }}"
    mode: "0640"
  register: platform_router_compose_template
  when: platform_router_state == 'present'

- name: Render platform_router route reconciler
  ansible.builtin.template:
    src: platform-router-reconcile.sh.j2
    dest: "{{ platform_router_root_dir }}/platform-router-reconcile.sh"
    mode: "0755"
  register: platform_router_reconcile_template
  when: platform_router_state == 'present'

- name: Render platform_router host marked-route reconciler
  ansible.builtin.template:
    src: platform-router-host-routes.sh.j2
    dest: "{{ platform_router_host_routes_script }}"
    mode: "0755"
  register: platform_router_host_routes_template
  when: platform_router_state == 'present'

- name: Render platform_router host marked-route systemd unit
  ansible.builtin.template:
    src: platform-router-host-routes.service.j2
    dest: "/etc/systemd/system/{{ platform_router_host_routes_service }}"
    mode: "0644"
  register: platform_router_host_routes_unit
  when: platform_router_state == 'present'

- name: Reload systemd after platform_router host-route unit change
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - platform_router_state == 'present'
    - platform_router_host_routes_unit.changed | default(false)
    - not ansible_check_mode

- name: Render platform_router SoftEther server admin IP allowlist
  ansible.builtin.copy:
    dest: "{{ platform_router_root_dir }}/{{ platform_router_model.softether_server_runtime.adminip_file }}"
    content: "{{ (['127.0.0.1'] + (platform_router_model.softether_servers | default([]) | map(attribute='management_allowed_source_ipv4') | list)) | unique | reject('equalto', '') | join('\n') }}\n"
    mode: "0644"
  when:
    - platform_router_state == 'present'
    - (platform_router_model.softether_servers | default([])) | length > 0

- name: Ensure Docker runtime baseline for platform_router
  ansible.builtin.include_role:
    name: docker_runtime_baseline
  when:
    - not ansible_check_mode
    - platform_router_state == 'present' or (platform_router_compose_stat.stat.exists | default(false))

- name: Ensure Docker service is running for platform_router
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  when:
