---
- name: Validate policy_gateway state
  ansible.builtin.assert:
    that:
      - policy_gateway_state in ['present', 'absent']
      - policy_gateway_purge_data in [true, false, 'true', 'false', 'True', 'False']
      - (policy_gateway_build_image | default(false)) in [true, false, 'true', 'false', 'True', 'False']
    fail_msg: "policy_gateway_state must be present|absent and policy_gateway boolean flags must be boolean-like."

- name: Check policy_gateway compose file
  ansible.builtin.stat:
    path: "{{ policy_gateway_compose_file }}"
  register: policy_gateway_compose_stat
  when: policy_gateway_state == 'absent'

- name: Check VPN network plan on control node
  ansible.builtin.stat:
    path: "{{ policy_gateway_operator_networks_file }}"
  delegate_to: localhost
  become: false
  register: policy_gateway_networks_file_stat
  when: policy_gateway_state == 'present'

- name: Require VPN network plan for policy_gateway
  ansible.builtin.assert:
    that:
      - policy_gateway_networks_file_stat.stat.exists
      - policy_gateway_networks_file_stat.stat.isreg
    fail_msg: "Missing generated VPN network plan on control node: {{ policy_gateway_operator_networks_file }}."
  when: policy_gateway_state == 'present'

- name: Resolve policy_gateway network assignment
  ansible.builtin.shell: |
    set -euo pipefail
    python3 - <<'PY'
    import csv
    import json
    import os
    import sys

    path = os.environ["NETWORKS_FILE"]
    alias = os.environ["ALIAS"]
    with open(path, newline="", encoding="utf-8") as handle:
        rows = list(csv.DictReader(handle))
    for row in rows:
        if row.get("alias") == alias:
            required = ["policy_subnet", "policy_gateway_ip"]
            missing = [key for key in required if not row.get(key)]
            if missing:
                print(f"network plan row for {alias} is missing: {', '.join(missing)}", file=sys.stderr)
                raise SystemExit(1)
            print(json.dumps(row, sort_keys=True))
            raise SystemExit(0)
    print(f"network plan has no row for alias: {alias}", file=sys.stderr)
    raise SystemExit(1)
    PY
  args:
    executable: /bin/bash
  environment:
    NETWORKS_FILE: "{{ policy_gateway_operator_networks_file }}"
    ALIAS: "{{ inventory_hostname }}"
  delegate_to: localhost
  become: false
  register: policy_gateway_network_plan_command
  changed_when: false
  when: policy_gateway_state == 'present'

- name: Store policy_gateway network assignment
  ansible.builtin.set_fact:
    policy_gateway_policy_network_subnet: "{{ (policy_gateway_network_plan_command.stdout | from_json).policy_subnet }}"
    policy_gateway_policy_ipv4: "{{ (policy_gateway_network_plan_command.stdout | from_json).policy_gateway_ip }}"
  when: policy_gateway_state == 'present'

- name: Plan policy_gateway image build on orchestration controller
  ansible.builtin.shell: |
    set -euo pipefail
    test -f "$CONTEXT/Dockerfile"
    dockerfile_hash="$(sha256sum "$CONTEXT/Dockerfile" | awk '{print substr($1, 1, 12)}')"
    git_ref="$(git -C "$REPO_ROOT" rev-parse --short=12 HEAD 2>/dev/null || true)"
    if [ -z "$git_ref" ]; then
      git_ref="nogit"
    fi
    stamp="$(date -u +%Y%m%dT%H%M%SZ)"
    image_ref="${IMAGE_REPOSITORY}:${stamp}-${git_ref}-${dockerfile_hash}"
    python3 - "$image_ref" "$CONTEXT" <<'PY'
    import json
    import sys
    print(json.dumps({"image_ref": sys.argv[1], "context": sys.argv[2]}, sort_keys=True))
    PY
  args:
    executable: /bin/bash
  environment:
    CONTEXT: "{{ policy_gateway_build_context }}"
    IMAGE_REPOSITORY: "{{ policy_gateway_image_repository }}"
    REPO_ROOT: "{{ playbook_dir }}/../.."
  delegate_to: localhost
  become: false
  run_once: true
  register: policy_gateway_build_plan_command
  changed_when: false
  when:
    - policy_gateway_state == 'present'
    - policy_gateway_build_image | bool

- name: Store policy_gateway image build plan
  ansible.builtin.set_fact:
    policy_gateway_build_plan: "{{ policy_gateway_build_plan_command.stdout | from_json }}"
  run_once: true
  when:
    - policy_gateway_state == 'present'
    - policy_gateway_build_image | bool

- name: Use generated policy_gateway image ref for this rollout
  ansible.builtin.set_fact:
    policy_gateway_image: "{{ hostvars[ansible_play_hosts_all[0]].policy_gateway_build_plan.image_ref }}"
    policy_gateway_remote_archive: "/tmp/ai-sp-policy-gateway-{{ hostvars[ansible_play_hosts_all[0]].policy_gateway_build_plan.image_ref | hash('sha1') }}.tar"
  when:
    - policy_gateway_state == 'present'
    - policy_gateway_build_image | bool

- name: Ensure policy_gateway runtime directory
  ansible.builtin.file:
    path: "{{ policy_gateway_root_dir }}"
    state: directory
    mode: "0750"
  when: policy_gateway_state == 'present'

- name: Render policy_gateway Docker Compose
  ansible.builtin.template:
    src: docker-compose.policy-gateway.yml.j2
    dest: "{{ policy_gateway_compose_file }}"
    mode: "0640"
  register: policy_gateway_compose_template
  when: policy_gateway_state == 'present'

- name: Ensure Docker runtime baseline for policy_gateway
  ansible.builtin.include_role:
    name: docker_runtime_baseline
  when:
    - not ansible_check_mode
    - policy_gateway_state == 'present' or (policy_gateway_compose_stat.stat.exists | default(false))

- name: Ensure Docker service is running for policy_gateway
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  when:
    - policy_gateway_state == 'present'
    - not ansible_check_mode

- name: Verify Docker Compose plugin is available for policy_gateway
  ansible.builtin.command:
    cmd: docker compose version
  changed_when: false
  when:
    - policy_gateway_state == 'present'
    - not ansible_check_mode

- name: Build policy_gateway image on orchestration controller
  ansible.builtin.shell: |
    set -euo pipefail
    archive="$(mktemp /tmp/ai-sp-policy-gateway.XXXXXX.tar)"
    docker build -t "$IMAGE_REF" -f "$CONTEXT/Dockerfile" "$CONTEXT"
    image_id="$(docker image inspect --format '{{ "{{" }}.Id{{ "}}" }}' "$IMAGE_REF")"
    docker save -o "$archive" "$IMAGE_REF"
    chmod 0644 "$archive"
    python3 - "$IMAGE_REF" "$image_id" "$archive" <<'PY'
    import json
    import sys
    print(json.dumps({"image_ref": sys.argv[1], "image_id": sys.argv[2], "archive": sys.argv[3]}, sort_keys=True))
    PY
  args:
    executable: /bin/bash
  environment:
    CONTEXT: "{{ hostvars[ansible_play_hosts_all[0]].policy_gateway_build_plan.context }}"
    IMAGE_REF: "{{ hostvars[ansible_play_hosts_all[0]].policy_gateway_build_plan.image_ref }}"
  delegate_to: localhost
  become: true
  run_once: true
  register: policy_gateway_build_command
  changed_when: true
  when:
    - policy_gateway_state == 'present'
    - policy_gateway_build_image | bool
    - not ansible_check_mode

- name: Store policy_gateway image build artifact
  ansible.builtin.set_fact:
    policy_gateway_build_artifact: "{{ policy_gateway_build_command.stdout | from_json }}"
  run_once: true
  when:
    - policy_gateway_state == 'present'
    - policy_gateway_build_image | bool
    - not ansible_check_mode

- name: Copy policy_gateway image archive to host
  ansible.builtin.copy:
    src: "{{ hostvars[ansible_play_hosts_all[0]].policy_gateway_build_artifact.archive }}"
    dest: "{{ policy_gateway_remote_archive }}"
    mode: "0600"
  when:
    - policy_gateway_state == 'present'
    - policy_gateway_build_image | bool
    - not ansible_check_mode

- name: Load policy_gateway image archive on host
  ansible.builtin.shell: |
    set -euo pipefail
    docker load -i "$ARCHIVE" >/dev/null
    actual="$(docker image inspect --format '{{ "{{" }}.Id{{ "}}" }}' "$IMAGE_REF")"
    if [ "$actual" != "$EXPECTED_IMAGE_ID" ]; then
      echo "policy_gateway image ID mismatch for $IMAGE_REF: expected $EXPECTED_IMAGE_ID, got $actual" >&2
      exit 1
    fi
    docker run --rm --network none "$IMAGE_REF" sh -c 'ip -V >/dev/null && iptables --version >/dev/null'
  args:
    executable: /bin/bash
  environment:
    ARCHIVE: "{{ policy_gateway_remote_archive }}"
    IMAGE_REF: "{{ hostvars[ansible_play_hosts_all[0]].policy_gateway_build_artifact.image_ref }}"
    EXPECTED_IMAGE_ID: "{{ hostvars[ansible_play_hosts_all[0]].policy_gateway_build_artifact.image_id }}"
  changed_when: true
  when:
    - policy_gateway_state == 'present'
    - policy_gateway_build_image | bool
    - not ansible_check_mode

- name: Remove staged policy_gateway image archive from host
  ansible.builtin.file:
    path: "{{ policy_gateway_remote_archive }}"
    state: absent
  when:
    - policy_gateway_build_image | bool
    - policy_gateway_remote_archive is defined
    - not ansible_check_mode

- name: Remove policy_gateway image archive from orchestration controller
  ansible.builtin.file:
    path: "{{ hostvars[ansible_play_hosts_all[0]].policy_gateway_build_artifact.archive }}"
    state: absent
  delegate_to: localhost
  become: true
  run_once: true
  when:
    - policy_gateway_state == 'present'
    - policy_gateway_build_image | bool
    - not ansible_check_mode

- name: Ensure VPN policy Docker network exists for policy_gateway
  ansible.builtin.command:
    cmd: docker network create --subnet "{{ policy_gateway_policy_network_subnet }}" "{{ policy_gateway_policy_network_name }}"
  register: policy_gateway_policy_network_create
  changed_when: policy_gateway_policy_network_create.rc == 0
  failed_when:
    - policy_gateway_policy_network_create.rc != 0
    - "'already exists' not in (policy_gateway_policy_network_create.stderr | default(''))"
  when:
    - policy_gateway_state == 'present'
    - not ansible_check_mode

- name: Start policy_gateway container
  ansible.builtin.command:
    cmd: docker compose -f "{{ policy_gateway_compose_file }}" up -d
    chdir: "{{ policy_gateway_root_dir }}"
  register: policy_gateway_compose_up
  changed_when: >
    (policy_gateway_compose_up.stdout ~ policy_gateway_compose_up.stderr)
    is search('(?i)(creating|created|recreating|recreated|starting|started|pulling|pulled|building|built)')
  when:
    - policy_gateway_state == 'present'
    - not ansible_check_mode

- name: Verify running policy_gateway container network attachment
  ansible.builtin.shell: |
    set -euo pipefail
    docker inspect "$CONTAINER" | python3 -c 'import json, os, sys; data = json.load(sys.stdin)[0]; network = os.environ["EXPECTED_NETWORK"]; expected_ip = os.environ["EXPECTED_IP"]; actual_ip = data.get("NetworkSettings", {}).get("Networks", {}).get(network, {}).get("IPAddress"); running = data.get("State", {}).get("Running"); sys.exit(0 if running and actual_ip == expected_ip else 1)'
  args:
    executable: /bin/bash
  environment:
    CONTAINER: "{{ policy_gateway_container_name }}"
    EXPECTED_NETWORK: "{{ policy_gateway_policy_network_name }}"
    EXPECTED_IP: "{{ policy_gateway_policy_ipv4 }}"
  changed_when: false
  register: policy_gateway_container_ready
  until: policy_gateway_container_ready.rc == 0
  retries: 15
  delay: 2
  when:
    - policy_gateway_state == 'present'
    - not ansible_check_mode

- name: Verify policy_gateway dataplane tools
  ansible.builtin.shell: |
    set -euo pipefail
    docker exec -u 0 "$CONTAINER" sh -c 'ip route >/dev/null && iptables -t nat -S POSTROUTING >/dev/null'
  args:
    executable: /bin/bash
  environment:
    CONTAINER: "{{ policy_gateway_container_name }}"
  changed_when: false
  when:
    - policy_gateway_state == 'present'
    - not ansible_check_mode

- name: Stop policy_gateway container
  ansible.builtin.command:
    cmd: docker compose -f "{{ policy_gateway_compose_file }}" down
    chdir: "{{ policy_gateway_root_dir }}"
  changed_when: true
  when:
    - policy_gateway_state == 'absent'
    - policy_gateway_compose_stat.stat.exists | default(false)
    - not ansible_check_mode

- name: Purge policy_gateway runtime data when explicitly requested
  ansible.builtin.file:
    path: "{{ policy_gateway_root_dir }}"
    state: absent
  when:
    - policy_gateway_state == 'absent'
    - policy_gateway_purge_data in [true, 'true', 'True']
    - not ansible_check_mode
