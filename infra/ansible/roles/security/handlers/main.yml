---
# Хендлеры роли `security`. Имена (`name:`) используются как
# идентификаторы для `notify:` в задачах — это технический контракт,
# поэтому они оставлены на английском в snake_case-стиле Ansible.

- name: restart sshd
  systemd:
    name: sshd
    state: restarted

- name: restart fail2ban
  systemd:
    name: fail2ban
    state: restarted
