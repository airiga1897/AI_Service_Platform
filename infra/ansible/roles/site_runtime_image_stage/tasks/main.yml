---
- name: Проверить входные параметры подготовки образа site_runtime
  ansible.builtin.assert:
    that:
      - site_runtime_stage_state == 'present'
      - site_runtime_instance | length > 0
      - site_runtime_image_ref | length > 0
      - site_runtime_image_archive | length > 0
      - site_runtime_image_manifest | length > 0
    fail_msg: "Для site_runtime stage-image необходимы instance, неизменяемый image ref, archive и manifest."

- name: Вычислить каноническую модель site_runtime на orchestration-узле
  ansible.builtin.command:
    argv:
      - python3
      - "{{ site_runtime_resolver }}"
      - --registry
      - "{{ site_runtime_services_registry }}"
      - --instances
      - "{{ site_runtime_instances_file }}"
      - --state
      - "{{ site_runtime_state_file }}"
      - --nodes
      - "{{ site_runtime_nodes_file }}"
      - --instance
      - "{{ site_runtime_instance }}"
      - --image-ref
      - "{{ site_runtime_image_ref }}"
      - --limit
      - "{{ inventory_hostname }}"
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  register: site_runtime_model_command

- name: Сохранить каноническую модель site_runtime
  ansible.builtin.set_fact:
    site_runtime_model: "{{ site_runtime_model_command.stdout | from_json }}"

- name: Прочитать manifest образа на orchestration-узле
  ansible.builtin.slurp:
    src: "{{ site_runtime_image_manifest }}"
  delegate_to: localhost
  become: false
  register: site_runtime_manifest_slurp

- name: Сохранить manifest образа
  ansible.builtin.set_fact:
    site_runtime_manifest: "{{ site_runtime_manifest_slurp.content | b64decode | from_json }}"

- name: Проверить контракт manifest образа
  ansible.builtin.assert:
    that:
      - site_runtime_manifest.schema_version | int == 1
      - site_runtime_manifest.instance == site_runtime_model.instance
      - site_runtime_manifest.target_alias == site_runtime_model.target_alias
      - site_runtime_manifest.image_ref == site_runtime_model.image_ref
      - site_runtime_manifest.distribution_digest == site_runtime_model.distribution_digest
      - site_runtime_manifest.transport_tag == site_runtime_model.transport_tag
      - site_runtime_manifest.platform == site_runtime_model.platform
      - site_runtime_manifest.config_image_id is match('^sha256:[0-9a-f]{64}$')
      - site_runtime_manifest.archive_sha256 is match('^[0-9a-f]{64}$')
    fail_msg: "Manifest образа site_runtime не соответствует каноническому идентификатору развёртывания."

- name: Вычислить checksum архива на orchestration-узле
  ansible.builtin.stat:
    path: "{{ site_runtime_image_archive }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: site_runtime_control_archive

- name: Проверить checksum архива на orchestration-узле
  ansible.builtin.assert:
    that:
      - site_runtime_control_archive.stat.exists
      - site_runtime_control_archive.stat.isreg
      - site_runtime_control_archive.stat.checksum == site_runtime_manifest.archive_sha256
    fail_msg: "Checksum архива site_runtime не совпадает на orchestration-узле."

- name: Проверить ранее загруженный transport image
  ansible.builtin.command:
    argv: [docker, image, inspect, "{{ site_runtime_model.transport_tag }}"]
  check_mode: false
  changed_when: false
  failed_when: false
  register: site_runtime_existing_image

- name: Определить совпадение существующего образа
  ansible.builtin.set_fact:
    site_runtime_existing_image_info: >-
      {{
        (site_runtime_existing_image.stdout | from_json | first)
        if site_runtime_existing_image.rc == 0
        else {}
      }}

- name: Сопоставить существующий образ с манифестом
  ansible.builtin.set_fact:
    site_runtime_image_already_loaded: >-
      {{
        site_runtime_existing_image.rc == 0
        and (site_runtime_existing_image_info.Id | default('')) == site_runtime_manifest.config_image_id
        and (site_runtime_existing_image_info.Os | default('')) == 'linux'
        and (site_runtime_existing_image_info.Architecture | default('')) == 'amd64'
      }}

- name: Зафиксировать контейнеры до подготовки образа
  ansible.builtin.command:
    argv: [docker, ps, -aq]
  check_mode: false
  changed_when: false
  register: site_runtime_containers_before

- name: Передать и загрузить неизменяемый образ
  when:
    - not ansible_check_mode
    - not site_runtime_image_already_loaded
  block:
    - name: Создать каталоги receipt и временных файлов site_runtime
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ site_runtime_stage_root }}/images/{{ site_runtime_instance }}", mode: "0750" }
        - { path: "{{ site_runtime_stage_root }}/tmp", mode: "0700" }

    - name: Скопировать архив образа во временный каталог целевого узла
      ansible.builtin.copy:
        src: "{{ site_runtime_image_archive }}"
        dest: "{{ site_runtime_stage_root }}/tmp/{{ site_runtime_instance }}.tar"
        mode: "0600"

    - name: Проверить checksum архива на целевом узле
      ansible.builtin.stat:
        path: "{{ site_runtime_stage_root }}/tmp/{{ site_runtime_instance }}.tar"
        checksum_algorithm: sha256
      register: site_runtime_target_archive
      failed_when: site_runtime_target_archive.stat.checksum != site_runtime_manifest.archive_sha256

    - name: Загрузить неизменяемый образ site_runtime
      ansible.builtin.command:
        argv: [docker, image, load, --input, "{{ site_runtime_stage_root }}/tmp/{{ site_runtime_instance }}.tar"]
      register: site_runtime_docker_load
      changed_when: true
  always:
    - name: Удалить временный архив с целевого узла
      ansible.builtin.file:
        path: "{{ site_runtime_stage_root }}/tmp/{{ site_runtime_instance }}.tar"
        state: absent

- name: Создать каталог receipt site_runtime
  ansible.builtin.file:
    path: "{{ site_runtime_stage_root }}/images/{{ site_runtime_instance }}"
    state: directory
    mode: "0750"
  when: not ansible_check_mode

- name: Проверить подготовленный transport image
  ansible.builtin.command:
    argv: [docker, image, inspect, "{{ site_runtime_model.transport_tag }}"]
  check_mode: false
  changed_when: false
  register: site_runtime_loaded_image
  when: not ansible_check_mode

- name: Проверить идентификатор и платформу подготовленного образа
  ansible.builtin.assert:
    that:
      - (site_runtime_loaded_image.stdout | from_json | first).Id == site_runtime_manifest.config_image_id
      - (site_runtime_loaded_image.stdout | from_json | first).Os == 'linux'
      - (site_runtime_loaded_image.stdout | from_json | first).Architecture == 'amd64'
  when: not ansible_check_mode

- name: Записать неизменяемый receipt образа
  ansible.builtin.copy:
    content: "{{ site_runtime_manifest | to_nice_json }}"
    dest: "{{ site_runtime_stage_root }}/images/{{ site_runtime_instance }}/{{ site_runtime_model.distribution_digest | regex_replace('^sha256:', '') }}.json"
    mode: "0640"
  when: not ansible_check_mode

- name: Зафиксировать контейнеры после подготовки образа
  ansible.builtin.command:
    argv: [docker, ps, -aq]
  check_mode: false
  changed_when: false
  register: site_runtime_containers_after

- name: Убедиться, что подготовка образа не изменила контейнеры
  ansible.builtin.assert:
    that:
      - (site_runtime_containers_before.stdout_lines | sort) == (site_runtime_containers_after.stdout_lines | sort)
    fail_msg: "site_runtime stage-image не должен создавать, удалять или заменять контейнеры."

- name: Вывести результат подготовки неизменяемого образа site_runtime
  ansible.builtin.debug:
    msg:
      instance: "{{ site_runtime_model.instance }}"
      target_alias: "{{ site_runtime_model.target_alias }}"
      deployment_identity: "{{ site_runtime_model.image_ref }}"
      config_image_id: "{{ site_runtime_manifest.config_image_id }}"
      transport_tag: "{{ site_runtime_model.transport_tag }}"
      already_loaded: "{{ site_runtime_image_already_loaded }}"
      product_containers_started: false
