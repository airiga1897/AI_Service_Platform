---
- name: Проверить границы check-only рубежа публикации
  ansible.builtin.assert:
    that:
      - ansible_check_mode
        or site_runtime_publication_action == 'publication-prepare'
        or site_runtime_publication_action == 'publication-http01'
      - site_runtime_instance | length > 0
      - site_runtime_publication_action in ['publication-check', 'publication-prepare', 'publication-http01']
      - inventory_hostname == 'vps3'
    fail_msg: >-
      publication-check допускается только с -Check; mutation-действия публикации — только для site_runtime instance на vps3.

- name: Разрешить canonical publication model
  ansible.builtin.command:
    argv:
      - python3
      - "{{ site_runtime_publication_resolver }}"
      - --registry
      - "{{ site_runtime_services_registry }}"
      - --instances
      - "{{ site_runtime_instances_file }}"
      - --state
      - "{{ site_runtime_state_file }}"
      - --instance
      - "{{ site_runtime_instance }}"
      - --limit
      - "{{ inventory_hostname }}"
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  register: site_runtime_publication_resolved

- name: Прочитать canonical publication model
  ansible.builtin.set_fact:
    site_runtime_publication_model: "{{ site_runtime_publication_resolved.stdout | from_json }}"

- name: Проверить текущее DNS-разрешение домена и CNAME target
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - >-
        import json, socket, sys;
        domain=sys.argv[1]; target=sys.argv[2];
        resolve=lambda name: sorted({item[4][0] for item in socket.getaddrinfo(name, 443, family=socket.AF_INET)});
        domain_ips=resolve(domain); target_ips=resolve(target);
        print(json.dumps({'domain_ips':domain_ips,'target_ips':target_ips,'matches':bool(domain_ips) and domain_ips==target_ips}, sort_keys=True))
      - "{{ site_runtime_publication_model.domain }}"
      - "{{ site_runtime_publication_model.dns.expected_target }}"
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  register: site_runtime_publication_dns

- name: Проверить private application network
  ansible.builtin.command:
    argv:
      - docker
      - network
      - inspect
      - "{{ site_runtime_publication_model.edge.application_network }}"
      - --format
      - "{{ '{{json .Containers}}' }}"
  check_mode: false
  changed_when: false
  register: site_runtime_publication_app_network

- name: Проверить сети действующего edge HAProxy
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - "{{ site_runtime_publication_edge_container }}"
      - --format
      - "{{ '{{json .NetworkSettings.Networks}}' }}"
  check_mode: false
  changed_when: false
  register: site_runtime_publication_edge_networks

- name: Проверить отсутствие host ports у private runtime
  ansible.builtin.shell: >-
    set -euo pipefail;
    for name in
    site-runtime-{{ site_runtime_instance }}-anchor
    {{ site_runtime_instance }}-redis-1
    {{ site_runtime_instance }}-web-1
    {{ site_runtime_instance }}-worker-1
    {{ site_runtime_instance }}-beat-1
    {{ site_runtime_instance }}-nginx-1;
    do
      bindings="$(docker inspect "$name" --format '{{ '{{json .HostConfig.PortBindings}}' }}')";
      test "$bindings" = 'null' || test "$bindings" = '{}';
    done
  args:
    executable: /bin/bash
  check_mode: false
  changed_when: false

- name: Проверить current.json принятого runtime перед ACME preparation
  ansible.builtin.stat:
    path: "{{ site_runtime_publication_stage_root }}/deployments/{{ site_runtime_instance }}/current.json"
    checksum_algorithm: sha256
  check_mode: false
  register: site_runtime_publication_current_stat
  when: site_runtime_publication_action == 'publication-prepare'

- name: Прочитать current.json принятого runtime перед ACME preparation
  ansible.builtin.slurp:
    src: "{{ site_runtime_publication_stage_root }}/deployments/{{ site_runtime_instance }}/current.json"
  check_mode: false
  register: site_runtime_publication_current_slurp
  when:
    - site_runtime_publication_action == 'publication-prepare'
    - site_runtime_publication_current_stat.stat.exists | default(false)

- name: Проверить действующий Compose перед ACME preparation
  ansible.builtin.stat:
    path: "{{ site_runtime_publication_runtime_root }}/{{ site_runtime_instance }}/docker-compose.yml"
    checksum_algorithm: sha256
  check_mode: false
  register: site_runtime_publication_compose_stat
  when: site_runtime_publication_action == 'publication-prepare'

- name: Проверить будущий ACME webroot volume без создания
  ansible.builtin.command:
    argv:
      - docker
      - volume
      - inspect
      - "{{ site_runtime_publication_model.storage.acme_webroot.volume }}"
  check_mode: false
  changed_when: false
  failed_when: false
  register: site_runtime_publication_acme_volume
  when: site_runtime_publication_action == 'publication-prepare'

- name: Проверить будущий TLS volume без создания
  ansible.builtin.command:
    argv:
      - docker
      - volume
      - inspect
      - "{{ site_runtime_publication_model.storage.tls.volume }}"
  check_mode: false
  changed_when: false
  failed_when: false
  register: site_runtime_publication_tls_volume
  when: site_runtime_publication_action == 'publication-prepare'

- name: Проверить ownership существующих ACME/TLS volumes
  ansible.builtin.set_fact:
    site_runtime_publication_acme_volume_labels: >-
      {{
        ((site_runtime_publication_acme_volume.stdout | from_json | first).Labels | default({}, true))
        if site_runtime_publication_acme_volume.rc == 0 else {}
      }}
    site_runtime_publication_tls_volume_labels: >-
      {{
        ((site_runtime_publication_tls_volume.stdout | from_json | first).Labels | default({}, true))
        if site_runtime_publication_tls_volume.rc == 0 else {}
      }}
  when: site_runtime_publication_action == 'publication-prepare'

- name: Принять ownership существующих ACME/TLS volumes
  ansible.builtin.assert:
    that:
      - >-
        site_runtime_publication_acme_volume.rc != 0 or (
          site_runtime_publication_acme_volume_labels.get('ai-service-platform.managed') == 'site_runtime'
          and site_runtime_publication_acme_volume_labels.get('ai-service-platform.instance') == site_runtime_instance
          and site_runtime_publication_acme_volume_labels.get('ai-service-platform.storage') == 'acme_webroot'
        )
      - >-
        site_runtime_publication_tls_volume.rc != 0 or (
          site_runtime_publication_tls_volume_labels.get('ai-service-platform.managed') == 'site_runtime'
          and site_runtime_publication_tls_volume_labels.get('ai-service-platform.instance') == site_runtime_instance
          and site_runtime_publication_tls_volume_labels.get('ai-service-platform.storage') == 'tls'
        )
    fail_msg: >-
      Существующий ACME/TLS volume не принадлежит canonical site_runtime instance;
      автоматическое подключение или перезапись запрещены.
  when: site_runtime_publication_action == 'publication-prepare'

- name: Принять наличие действующего deployment snapshot
  ansible.builtin.assert:
    that:
      - site_runtime_publication_current_stat.stat.exists | default(false)
      - site_runtime_publication_compose_stat.stat.exists | default(false)
    fail_msg: Для publication-prepare требуется принятый current.json и действующий Compose.
  when: site_runtime_publication_action == 'publication-prepare'

- name: Прочитать deployment identity для ACME preparation
  ansible.builtin.set_fact:
    site_runtime_publication_current: >-
      {{ site_runtime_publication_current_slurp.content | b64decode | from_json }}
  when: site_runtime_publication_action == 'publication-prepare'

- name: Зафиксировать пути ACME preparation
  ansible.builtin.set_fact:
    site_runtime_publication_instance_root: "{{ site_runtime_publication_runtime_root }}/{{ site_runtime_instance }}"
    site_runtime_publication_override_path: "{{ site_runtime_publication_runtime_root }}/{{ site_runtime_instance }}/docker-compose.publication.yml"
    site_runtime_publication_nginx_path: "{{ site_runtime_publication_runtime_root }}/{{ site_runtime_instance }}/nginx-publication-acme.conf"
    site_runtime_publication_instance_journal_root: "{{ site_runtime_publication_journal_root }}/{{ site_runtime_instance }}"
    site_runtime_publication_preparation_id: "{{ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}-prepare"
  when: site_runtime_publication_action == 'publication-prepare'

- name: Проверить существующий Compose overlay публикации
  ansible.builtin.stat:
    path: "{{ site_runtime_publication_override_path }}"
    checksum_algorithm: sha256
  check_mode: false
  register: site_runtime_publication_override_stat
  when: site_runtime_publication_action == 'publication-prepare'

- name: Проверить существующую ACME-конфигурацию Nginx
  ansible.builtin.stat:
    path: "{{ site_runtime_publication_nginx_path }}"
    checksum_algorithm: sha256
  check_mode: false
  register: site_runtime_publication_nginx_stat
  when: site_runtime_publication_action == 'publication-prepare'

- name: Сохранить предыдущий Compose overlay для аварийного восстановления
  ansible.builtin.slurp:
    src: "{{ site_runtime_publication_override_path }}"
  check_mode: false
  register: site_runtime_publication_override_previous
  when:
    - site_runtime_publication_action == 'publication-prepare'
    - site_runtime_publication_override_stat.stat.exists | default(false)

- name: Сохранить предыдущую ACME-конфигурацию для аварийного восстановления
  ansible.builtin.slurp:
    src: "{{ site_runtime_publication_nginx_path }}"
  check_mode: false
  register: site_runtime_publication_nginx_previous
  when:
    - site_runtime_publication_action == 'publication-prepare'
    - site_runtime_publication_nginx_stat.stat.exists | default(false)

- name: Проверить текущие mounts Nginx перед ACME preparation
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - "{{ site_runtime_instance }}-nginx-1"
      - --format
      - "{{ '{{json .Mounts}}' }}"
  check_mode: false
  changed_when: false
  register: site_runtime_publication_nginx_mounts_before
  when: site_runtime_publication_action == 'publication-prepare'

- name: Определить необходимость ACME preparation
  ansible.builtin.set_fact:
    site_runtime_publication_already_prepared: >-
      {{
        site_runtime_publication_acme_volume.rc == 0
        and site_runtime_publication_tls_volume.rc == 0
        and site_runtime_publication_override_stat.stat.exists | default(false)
        and site_runtime_publication_override_stat.stat.checksum | default('') == site_runtime_publication_model.render.preparation.checksums.compose_override_fragment
        and site_runtime_publication_nginx_stat.stat.exists | default(false)
        and site_runtime_publication_nginx_stat.stat.checksum | default('') == site_runtime_publication_model.render.preparation.checksums.nginx_acme_fragment
        and ((site_runtime_publication_nginx_mounts_before.stdout | from_json)
          | selectattr('Type', 'equalto', 'volume')
          | selectattr('Name', 'equalto', site_runtime_publication_model.storage.acme_webroot.volume)
          | selectattr('Destination', 'equalto', site_runtime_publication_model.storage.acme_webroot.container_path)
          | selectattr('RW', 'equalto', false) | list | length) == 1
        and ((site_runtime_publication_nginx_mounts_before.stdout | from_json)
          | selectattr('Type', 'equalto', 'volume')
          | selectattr('Name', 'equalto', site_runtime_publication_model.storage.tls.volume)
          | selectattr('Destination', 'equalto', site_runtime_publication_model.storage.tls.container_path)
          | selectattr('RW', 'equalto', false) | list | length) == 1
      }}
  when: site_runtime_publication_action == 'publication-prepare'

- name: Выполнить реальную подготовку ACME/TLS storage и Nginx
  when:
    - site_runtime_publication_action == 'publication-prepare'
    - not ansible_check_mode
    - not site_runtime_publication_already_prepared | bool
  block:
    - name: Подготовить каталог publication journal
      ansible.builtin.file:
        path: "{{ site_runtime_publication_instance_journal_root }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Создать persistent ACME webroot volume
      ansible.builtin.command:
        argv:
          - docker
          - volume
          - create
          - --label
          - ai-service-platform.managed=site_runtime
          - --label
          - "ai-service-platform.instance={{ site_runtime_instance }}"
          - --label
          - ai-service-platform.storage=acme_webroot
          - "{{ site_runtime_publication_model.storage.acme_webroot.volume }}"
      when: site_runtime_publication_acme_volume.rc != 0

    - name: Создать persistent TLS volume
      ansible.builtin.command:
        argv:
          - docker
          - volume
          - create
          - --label
          - ai-service-platform.managed=site_runtime
          - --label
          - "ai-service-platform.instance={{ site_runtime_instance }}"
          - --label
          - ai-service-platform.storage=tls
          - "{{ site_runtime_publication_model.storage.tls.volume }}"
      when: site_runtime_publication_tls_volume.rc != 0

    - name: Записать canonical Compose overlay публикации
      ansible.builtin.copy:
        content: "{{ site_runtime_publication_model.render.preparation.documents.compose_override_fragment }}"
        dest: "{{ site_runtime_publication_override_path }}"
        owner: root
        group: root
        mode: "0640"

    - name: Записать ACME-only конфигурацию Nginx
      ansible.builtin.copy:
        content: "{{ site_runtime_publication_model.render.preparation.documents.nginx_acme_fragment }}"
        dest: "{{ site_runtime_publication_nginx_path }}"
        owner: root
        group: root
        mode: "0640"

    - name: Проверить объединённый Compose до изменения Nginx
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ site_runtime_publication_instance_root }}/docker-compose.yml"
          - -f
          - "{{ site_runtime_publication_override_path }}"
          - config
          - --quiet
      changed_when: false

    - name: Пересоздать только Nginx с ACME/TLS mounts
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ site_runtime_publication_instance_root }}/docker-compose.yml"
          - -f
          - "{{ site_runtime_publication_override_path }}"
          - up
          - -d
          - --no-build
          - --pull
          - never
          - --no-deps
          - nginx

    - name: Дождаться private health после обновления Nginx
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ site_runtime_instance }}-web-1"
          - python
          - -c
          - >-
            import urllib.request;
            [urllib.request.urlopen('http://127.0.0.1:8080' + path, timeout=5).read()
            for path in ('/healthz/','/readyz/','/worker-healthz/')]
      register: site_runtime_publication_private_health
      retries: 20
      delay: 3
      until: site_runtime_publication_private_health.rc == 0
      changed_when: false

    - name: Проверить ACME webroot и закрытый публичный root
      ansible.builtin.shell: |
        set -euo pipefail
        nginx_image="$(docker inspect "{{ site_runtime_instance }}-nginx-1" --format '{{ '{{.Image}}' }}')"
        cleanup() {
          docker run --rm \
            -v "{{ site_runtime_publication_model.storage.acme_webroot.volume }}:/var/www/acme" \
            "$nginx_image" sh -ec 'rm -f /var/www/acme/.well-known/acme-challenge/platform-preparation-probe' >/dev/null
        }
        trap cleanup EXIT
        docker run --rm \
          -v "{{ site_runtime_publication_model.storage.acme_webroot.volume }}:/var/www/acme" \
          "$nginx_image" sh -ec \
          'mkdir -p /var/www/acme/.well-known/acme-challenge; printf prepared > /var/www/acme/.well-known/acme-challenge/platform-preparation-probe'
        docker exec "{{ site_runtime_instance }}-web-1" python - "{{ site_runtime_publication_model.domain }}" <<'PY'
        import sys
        import urllib.error
        import urllib.request

        domain = sys.argv[1]
        request = urllib.request.Request(
            "http://127.0.0.1:8080/.well-known/acme-challenge/platform-preparation-probe",
            headers={"Host": domain},
        )
        if urllib.request.urlopen(request, timeout=5).read() != b"prepared":
            raise SystemExit("ACME webroot не отдал контрольный marker")
        root = urllib.request.Request("http://127.0.0.1:8080/", headers={"Host": domain})
        try:
            urllib.request.urlopen(root, timeout=5)
        except urllib.error.HTTPError as exc:
            if exc.code != 404:
                raise
        else:
            raise SystemExit("Публичный root должен возвращать 404 до отдельного route apply")
        PY
      args:
        executable: /bin/bash
      changed_when: false

    - name: Принять mounts Nginx и неизменность application artifacts до записи journal
      ansible.builtin.shell: |
        python3 - \
          "{{ site_runtime_instance }}-nginx-1" \
          "{{ site_runtime_publication_model.storage.acme_webroot.volume }}" \
          "{{ site_runtime_publication_model.storage.acme_webroot.container_path }}" \
          "{{ site_runtime_publication_model.storage.tls.volume }}" \
          "{{ site_runtime_publication_model.storage.tls.container_path }}" \
          "{{ site_runtime_publication_stage_root }}/deployments/{{ site_runtime_instance }}/current.json" \
          "{{ site_runtime_publication_current_stat.stat.checksum }}" \
          "{{ site_runtime_publication_instance_root }}/docker-compose.yml" \
          "{{ site_runtime_publication_compose_stat.stat.checksum }}" <<'PY'
        import hashlib
        import json
        from pathlib import Path
        import subprocess
        import sys

        (
            nginx_container,
            acme_volume,
            acme_path,
            tls_volume,
            tls_path,
            current_path,
            current_checksum,
            compose_path,
            compose_checksum,
        ) = sys.argv[1:]

        def sha256(path):
            return hashlib.sha256(Path(path).read_bytes()).hexdigest()

        if sha256(current_path) != current_checksum:
            raise SystemExit("application current.json изменился во время preparation")
        if sha256(compose_path) != compose_checksum:
            raise SystemExit("базовый Compose изменился во время preparation")
        inspected = subprocess.run(
            ["docker", "inspect", nginx_container],
            check=True,
            capture_output=True,
            text=True,
        )
        info = json.loads(inspected.stdout)[0]
        if not info.get("State", {}).get("Running"):
            raise SystemExit("Nginx не запущен после preparation")
        if info.get("HostConfig", {}).get("PortBindings"):
            raise SystemExit("У Nginx обнаружены host port bindings")

        def require_read_only_volume(name, destination):
            matches = [
                mount
                for mount in info.get("Mounts", [])
                if mount.get("Type") == "volume"
                and mount.get("Name") == name
                and mount.get("Destination") == destination
                and mount.get("RW") is False
            ]
            if len(matches) != 1:
                raise SystemExit(f"Не принят read-only volume mount {destination}")

        require_read_only_volume(acme_volume, acme_path)
        require_read_only_volume(tls_volume, tls_path)
        PY
      args:
        executable: /bin/bash
      changed_when: false

    - name: Записать успешный publication preparation journal
      ansible.builtin.copy:
        content: >-
          {{ {'preparation_id': site_runtime_publication_preparation_id,
          'time_utc': now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ'),
          'instance': site_runtime_instance, 'domain': site_runtime_publication_model.domain,
          'deployment_id': site_runtime_publication_current.deployment_id,
          'deployment_digest': site_runtime_publication_current.digest,
          'base_compose_checksum': site_runtime_publication_current.compose_checksum,
          'storage': {'acme_webroot': site_runtime_publication_model.storage.acme_webroot.volume,
          'tls': site_runtime_publication_model.storage.tls.volume},
          'preparation_render_checksums': site_runtime_publication_model.render.preparation.checksums,
          'private_health': 'succeeded', 'acme_probe': 'succeeded',
          'certificate_requested': False, 'edge_changed': False,
          'public_route_enabled': False, 'final_status': 'succeeded'} | to_nice_json }}
        dest: "{{ site_runtime_publication_instance_journal_root }}/{{ site_runtime_publication_preparation_id }}.json"
        owner: root
        group: root
        mode: "0640"

    - name: Обновить current receipt publication preparation
      ansible.builtin.copy:
        content: >-
          {{ {'preparation_id': site_runtime_publication_preparation_id,
          'instance': site_runtime_instance, 'domain': site_runtime_publication_model.domain,
          'deployment_id': site_runtime_publication_current.deployment_id,
          'deployment_digest': site_runtime_publication_current.digest,
          'base_compose_checksum': site_runtime_publication_current.compose_checksum,
          'storage': {'acme_webroot': site_runtime_publication_model.storage.acme_webroot.volume,
          'tls': site_runtime_publication_model.storage.tls.volume},
          'preparation_render_checksums': site_runtime_publication_model.render.preparation.checksums,
          'final_status': 'succeeded'} | to_nice_json }}
        dest: "{{ site_runtime_publication_instance_journal_root }}/current.json"
        owner: root
        group: root
        mode: "0640"

  rescue:
    - name: Восстановить предыдущий Compose overlay после ошибки
      ansible.builtin.copy:
        content: "{{ site_runtime_publication_override_previous.content | b64decode }}"
        dest: "{{ site_runtime_publication_override_path }}"
        owner: root
        group: root
        mode: "0640"
      when: site_runtime_publication_override_stat.stat.exists | default(false)

    - name: Удалить новый Compose overlay после ошибки первого preparation
      ansible.builtin.file:
        path: "{{ site_runtime_publication_override_path }}"
        state: absent
      when: not site_runtime_publication_override_stat.stat.exists | default(false)

    - name: Восстановить предыдущую ACME-конфигурацию после ошибки
      ansible.builtin.copy:
        content: "{{ site_runtime_publication_nginx_previous.content | b64decode }}"
        dest: "{{ site_runtime_publication_nginx_path }}"
        owner: root
        group: root
        mode: "0640"
      when: site_runtime_publication_nginx_stat.stat.exists | default(false)

    - name: Удалить новую ACME-конфигурацию после ошибки первого preparation
      ansible.builtin.file:
        path: "{{ site_runtime_publication_nginx_path }}"
        state: absent
      when: not site_runtime_publication_nginx_stat.stat.exists | default(false)

    - name: Восстановить предыдущую конфигурацию Nginx
      ansible.builtin.command:
        argv: >-
          {{
            ['docker', 'compose', '-f', site_runtime_publication_instance_root + '/docker-compose.yml']
            + (['-f', site_runtime_publication_override_path]
              if site_runtime_publication_override_stat.stat.exists | default(false) else [])
            + ['up', '-d', '--no-build', '--pull', 'never', '--no-deps', 'nginx']
          }}

    - name: Записать failed publication preparation journal
      ansible.builtin.copy:
        content: >-
          {{ {'preparation_id': site_runtime_publication_preparation_id,
          'time_utc': now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ'),
          'instance': site_runtime_instance, 'domain': site_runtime_publication_model.domain,
          'deployment_id': site_runtime_publication_current.deployment_id,
          'deployment_digest': site_runtime_publication_current.digest,
          'base_compose_checksum': site_runtime_publication_current.compose_checksum,
          'certificate_requested': False, 'edge_changed': False,
          'public_route_enabled': False, 'final_status': 'failed',
          'volumes_preserved_for_diagnostics': True} | to_nice_json }}
        dest: "{{ site_runtime_publication_instance_journal_root }}/{{ site_runtime_publication_preparation_id }}.json"
        owner: root
        group: root
        mode: "0640"

    - name: Остановить publication preparation после сохранения диагностики
      ansible.builtin.fail:
        msg: >-
          ACME/TLS preparation не принята; предыдущая конфигурация Nginx восстановлена,
          volumes сохранены для диагностики, public route не изменён.

- name: Проверить ACME webroot volume после реального preparation
  ansible.builtin.command:
    argv:
      - docker
      - volume
      - inspect
      - "{{ site_runtime_publication_model.storage.acme_webroot.volume }}"
  check_mode: false
  changed_when: false
  register: site_runtime_publication_acme_volume_after
  when:
    - site_runtime_publication_action == 'publication-prepare'
    - not ansible_check_mode

- name: Проверить TLS volume после реального preparation
  ansible.builtin.command:
    argv:
      - docker
      - volume
      - inspect
      - "{{ site_runtime_publication_model.storage.tls.volume }}"
  check_mode: false
  changed_when: false
  register: site_runtime_publication_tls_volume_after
  when:
    - site_runtime_publication_action == 'publication-prepare'
    - not ansible_check_mode

- name: Проверить Nginx после реального preparation
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - "{{ site_runtime_instance }}-nginx-1"
  check_mode: false
  changed_when: false
  register: site_runtime_publication_nginx_after
  when:
    - site_runtime_publication_action == 'publication-prepare'
    - not ansible_check_mode

- name: Проверить private health и закрытый публичный root после preparation
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ site_runtime_instance }}-web-1"
      - python
      - -c
      - >-
        import sys, urllib.error, urllib.request;
        [urllib.request.urlopen('http://127.0.0.1:8080' + path, timeout=5).read()
        for path in ('/healthz/','/readyz/','/worker-healthz/')];
        request=urllib.request.Request('http://127.0.0.1:8080/', headers={'Host':sys.argv[1]});
        exec("try:\n urllib.request.urlopen(request, timeout=5)\nexcept urllib.error.HTTPError as exc:\n assert exc.code == 404\nelse:\n raise SystemExit('Публичный root должен возвращать 404')")
      - "{{ site_runtime_publication_model.domain }}"
  check_mode: false
  changed_when: false
  register: site_runtime_publication_health_after
  when:
    - site_runtime_publication_action == 'publication-prepare'
    - not ansible_check_mode

- name: Проверить application current.json после preparation
  ansible.builtin.stat:
    path: "{{ site_runtime_publication_stage_root }}/deployments/{{ site_runtime_instance }}/current.json"
    checksum_algorithm: sha256
  check_mode: false
  register: site_runtime_publication_current_after
  when:
    - site_runtime_publication_action == 'publication-prepare'
    - not ansible_check_mode

- name: Проверить базовый Compose после preparation
  ansible.builtin.stat:
    path: "{{ site_runtime_publication_instance_root }}/docker-compose.yml"
    checksum_algorithm: sha256
  check_mode: false
  register: site_runtime_publication_compose_after
  when:
    - site_runtime_publication_action == 'publication-prepare'
    - not ansible_check_mode

- name: Проверить edge network после preparation
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - "{{ site_runtime_publication_edge_container }}"
      - --format
      - "{{ '{{json .NetworkSettings.Networks}}' }}"
  check_mode: false
  changed_when: false
  register: site_runtime_publication_edge_networks_after
  when:
    - site_runtime_publication_action == 'publication-prepare'
    - not ansible_check_mode

- name: Принять реальную подготовку ACME/TLS storage
  ansible.builtin.assert:
    that:
      - site_runtime_publication_current_after.stat.checksum == site_runtime_publication_current_stat.stat.checksum
      - site_runtime_publication_compose_after.stat.checksum == site_runtime_publication_compose_stat.stat.checksum
      - site_runtime_publication_edge_networks_after.stdout == site_runtime_publication_edge_networks.stdout
      - (site_runtime_publication_acme_volume_after.stdout | from_json | first).Labels['ai-service-platform.storage'] == 'acme_webroot'
      - (site_runtime_publication_tls_volume_after.stdout | from_json | first).Labels['ai-service-platform.storage'] == 'tls'
      - (site_runtime_publication_nginx_after.stdout | from_json | first).State.Running | bool
      - not ((site_runtime_publication_nginx_after.stdout | from_json | first).HostConfig.PortBindings | default({}))
      - ((site_runtime_publication_nginx_after.stdout | from_json | first).Mounts
        | selectattr('Type', 'equalto', 'volume')
        | selectattr('Name', 'equalto', site_runtime_publication_model.storage.acme_webroot.volume)
        | selectattr('Destination', 'equalto', site_runtime_publication_model.storage.acme_webroot.container_path)
        | selectattr('RW', 'equalto', false) | list | length) == 1
      - ((site_runtime_publication_nginx_after.stdout | from_json | first).Mounts
        | selectattr('Type', 'equalto', 'volume')
        | selectattr('Name', 'equalto', site_runtime_publication_model.storage.tls.volume)
        | selectattr('Destination', 'equalto', site_runtime_publication_model.storage.tls.container_path)
        | selectattr('RW', 'equalto', false) | list | length) == 1
    fail_msg: >-
      ACME/TLS storage, Nginx mounts или неизменность application current/base Compose/edge не прошли приёмку.
  when:
    - site_runtime_publication_action == 'publication-prepare'
    - not ansible_check_mode

- name: Проверить receipt подготовленного Nginx перед HTTP-01 ingress
  ansible.builtin.stat:
    path: "{{ site_runtime_publication_journal_root }}/{{ site_runtime_instance }}/current.json"
    checksum_algorithm: sha256
  check_mode: false
  register: site_runtime_publication_http01_receipt_stat
  when: site_runtime_publication_action == 'publication-http01'

- name: Прочитать receipt подготовленного Nginx перед HTTP-01 ingress
  ansible.builtin.slurp:
    src: "{{ site_runtime_publication_journal_root }}/{{ site_runtime_instance }}/current.json"
  check_mode: false
  register: site_runtime_publication_http01_receipt_slurp
  when:
    - site_runtime_publication_action == 'publication-http01'
    - site_runtime_publication_http01_receipt_stat.stat.exists | default(false)

- name: Разобрать receipt подготовленного Nginx
  ansible.builtin.set_fact:
    site_runtime_publication_http01_receipt: >-
      {{ site_runtime_publication_http01_receipt_slurp.content | b64decode | from_json }}
  when:
    - site_runtime_publication_action == 'publication-http01'
    - site_runtime_publication_http01_receipt_stat.stat.exists | default(false)

- name: Принять prerequisites HTTP-01 ingress
  ansible.builtin.assert:
    that:
      - site_runtime_publication_http01_receipt_stat.stat.exists | default(false)
      - site_runtime_publication_http01_receipt.final_status == 'succeeded'
      - site_runtime_publication_http01_receipt.domain == site_runtime_publication_model.domain
      - site_runtime_publication_http01_receipt.storage.acme_webroot == site_runtime_publication_model.storage.acme_webroot.volume
      - site_runtime_publication_http01_receipt.storage.tls == site_runtime_publication_model.storage.tls.volume
      - site_runtime_publication_http01_receipt.preparation_render_checksums == site_runtime_publication_model.render.preparation.checksums
    fail_msg: Nginx ACME/TLS preparation не принят; HTTP-01 ingress запрещён.
  when: site_runtime_publication_action == 'publication-http01'

- name: Проверить Nginx ACME backend перед HTTP-01 ingress
  ansible.builtin.shell: |
    python3 - \
      "{{ site_runtime_instance }}-nginx-1" \
      "{{ site_runtime_publication_model.storage.acme_webroot.volume }}" \
      "{{ site_runtime_publication_model.storage.acme_webroot.container_path }}" <<'PY'
    import json
    import subprocess
    import sys

    container, volume, destination = sys.argv[1:]
    info = json.loads(subprocess.run(
        ["docker", "inspect", container], check=True, capture_output=True, text=True
    ).stdout)[0]
    if not info.get("State", {}).get("Running"):
        raise SystemExit("Nginx ACME backend не запущен")
    matches = [mount for mount in info.get("Mounts", []) if
        mount.get("Type") == "volume" and mount.get("Name") == volume and
        mount.get("Destination") == destination and mount.get("RW") is False]
    if len(matches) != 1:
        raise SystemExit("ACME webroot не подключён к Nginx read-only")
    subprocess.run(["docker", "exec", container, "nginx", "-t"], check=True)
    PY
  args:
    executable: /bin/bash
  check_mode: false
  changed_when: false
  when: site_runtime_publication_action == 'publication-http01'

- name: Прочитать действующий HAProxy config перед HTTP-01 ingress
  ansible.builtin.slurp:
    src: "{{ site_runtime_publication_edge_config }}"
  check_mode: false
  register: site_runtime_publication_http01_haproxy_slurp
  when: site_runtime_publication_action == 'publication-http01'

- name: Прочитать действующий HAProxy config в память
  ansible.builtin.set_fact:
    site_runtime_publication_http01_haproxy_current: >-
      {{ site_runtime_publication_http01_haproxy_slurp.content | b64decode }}
  when: site_runtime_publication_action == 'publication-http01'

- name: Определить состояние HTTP-01 route
  ansible.builtin.set_fact:
    site_runtime_publication_http01_frontend_count: >-
      {{
        site_runtime_publication_http01_haproxy_current.count(
          site_runtime_publication_model.render.http01.documents.haproxy_frontend_rules
        )
      }}
    site_runtime_publication_http01_backend_count: >-
      {{
        site_runtime_publication_http01_haproxy_current.count(
          site_runtime_publication_model.render.http01.documents.haproxy_backend
        )
      }}
  when: site_runtime_publication_action == 'publication-http01'

- name: Принять безопасную точку вставки HTTP-01 route
  ansible.builtin.assert:
    that:
      - (site_runtime_publication_http01_haproxy_current.split(site_runtime_publication_model.render.http01.insertion_anchor) | length) == 2
      - >-
        (site_runtime_publication_http01_frontend_count | int == 0
        and site_runtime_publication_http01_backend_count | int == 0)
        or
        (site_runtime_publication_http01_frontend_count | int == 1
        and site_runtime_publication_http01_backend_count | int == 1)
      - not site_runtime_publication_model.edge.public_route_enabled | bool
    fail_msg: HAProxy config содержит частичный, дублированный или небезопасный HTTP-01 route.
  when: site_runtime_publication_action == 'publication-http01'

- name: Сформировать prospective HAProxy config в памяти
  ansible.builtin.set_fact:
    site_runtime_publication_http01_route_already_applied: >-
      {{
        site_runtime_publication_http01_frontend_count | int == 1
        and site_runtime_publication_http01_backend_count | int == 1
      }}
    site_runtime_publication_http01_haproxy_future: >-
      {{
        site_runtime_publication_http01_haproxy_current
        if (
          site_runtime_publication_http01_frontend_count | int == 1
          and site_runtime_publication_http01_backend_count | int == 1
        )
        else
        (
          site_runtime_publication_http01_haproxy_current.replace(
            site_runtime_publication_model.render.http01.insertion_anchor,
            site_runtime_publication_model.render.http01.documents.haproxy_frontend_rules
            ~ site_runtime_publication_model.render.http01.insertion_anchor
          )
          ~ site_runtime_publication_model.render.http01.documents.haproxy_backend
        )
      }}
  when: site_runtime_publication_action == 'publication-http01'

- name: Проверить prospective HAProxy config без записи файла
  ansible.builtin.shell: |
    docker exec -i {{ site_runtime_publication_edge_container }} haproxy -c -f /dev/stdin <<'HAPROXY'
    {{ site_runtime_publication_http01_haproxy_future }}
    HAPROXY
  args:
    executable: /bin/bash
  check_mode: false
  changed_when: false
  when: site_runtime_publication_action == 'publication-http01'

- name: Проверить текущий внешний ACME placeholder
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - >-
        import sys, urllib.error, urllib.request;
        request=urllib.request.Request('http://' + sys.argv[1] + '/.well-known/acme-challenge/platform-http01-check');
        exec("try:\n urllib.request.urlopen(request, timeout=10)\nexcept urllib.error.HTTPError as exc:\n assert exc.code == 404; print(exc.code)\nelse:\n raise SystemExit('ACME placeholder должен возвращать 404')")
      - "{{ site_runtime_publication_model.domain }}"
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  register: site_runtime_publication_http01_external
  when: site_runtime_publication_action == 'publication-http01'

- name: Зафиксировать состояние перед реальным HTTP-01 route
  ansible.builtin.set_fact:
    site_runtime_publication_http01_edge_network_was_attached: >-
      {{
        site_runtime_publication_model.edge.application_network
        in (site_runtime_publication_edge_networks.stdout | from_json)
      }}
    site_runtime_publication_http01_mutation_required: >-
      {{
        not site_runtime_publication_http01_route_already_applied | bool
        or
        site_runtime_publication_model.edge.application_network
        not in (site_runtime_publication_edge_networks.stdout | from_json)
      }}
    site_runtime_publication_http01_id: "{{ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}-http01"
    site_runtime_publication_http01_journal_root: >-
      {{ site_runtime_publication_journal_root }}/{{ site_runtime_instance }}
  when: site_runtime_publication_action == 'publication-http01'

- name: Применить только HTTP-01 ingress с аварийным восстановлением
  when:
    - site_runtime_publication_action == 'publication-http01'
    - not ansible_check_mode
  block:
    - name: Подготовить каталог HTTP-01 journal
      ansible.builtin.file:
        path: "{{ site_runtime_publication_http01_journal_root }}"
        state: directory
        owner: root
        group: root
        mode: "0750"
      when: site_runtime_publication_http01_mutation_required | bool

    - name: Сохранить snapshot HAProxy перед HTTP-01 route
      ansible.builtin.copy:
        content: "{{ site_runtime_publication_http01_haproxy_current }}"
        dest: >-
          {{ site_runtime_publication_http01_journal_root }}/{{ site_runtime_publication_http01_id }}.haproxy.cfg
        owner: root
        group: root
        mode: "0640"
      when: site_runtime_publication_http01_mutation_required | bool

    - name: Подключить edge HAProxy к private application network
      ansible.builtin.command:
        argv:
          - docker
          - network
          - connect
          - "{{ site_runtime_publication_model.edge.application_network }}"
          - "{{ site_runtime_publication_edge_container }}"
      when: not site_runtime_publication_http01_edge_network_was_attached | bool

    - name: Атомарно записать принятый HTTP-01 HAProxy config
      ansible.builtin.copy:
        content: "{{ site_runtime_publication_http01_haproxy_future }}"
        dest: "{{ site_runtime_publication_edge_config }}"
        owner: root
        group: root
        mode: "0644"
      register: site_runtime_publication_http01_config_apply
      when: not site_runtime_publication_http01_route_already_applied | bool

    - name: Перезапустить HAProxy после изменения HTTP-01 config
      ansible.builtin.command:
        argv:
          - docker
          - restart
          - "{{ site_runtime_publication_edge_container }}"
      when: site_runtime_publication_http01_config_apply.changed | default(false)

    - name: Принять HAProxy и private application network после применения
      ansible.builtin.shell: |
        set -euo pipefail
        python3 - \
          "{{ site_runtime_publication_edge_container }}" \
          "{{ site_runtime_publication_model.edge.application_network }}" \
          "{{ site_runtime_publication_edge_config }}" \
          "{{ site_runtime_publication_http01_haproxy_future | hash('sha256') }}" <<'PY'
        import hashlib
        import json
        from pathlib import Path
        import subprocess
        import sys

        container, network, config_path, expected_checksum = sys.argv[1:]
        inspected = subprocess.run(
            ["docker", "inspect", container],
            check=True,
            capture_output=True,
            text=True,
        )
        info = json.loads(inspected.stdout)[0]
        if not info.get("State", {}).get("Running"):
            raise SystemExit("edge HAProxy не запущен")
        if network not in info.get("NetworkSettings", {}).get("Networks", {}):
            raise SystemExit("edge HAProxy не подключён к private application network")
        checksum = hashlib.sha256(Path(config_path).read_bytes()).hexdigest()
        if checksum != expected_checksum:
            raise SystemExit("HAProxy config checksum не совпадает с принятым prospective config")
        PY
        docker exec "{{ site_runtime_publication_edge_container }}" \
          haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg
      args:
        executable: /bin/bash
      register: site_runtime_publication_http01_edge_acceptance
      retries: 15
      delay: 2
      until: site_runtime_publication_http01_edge_acceptance.rc == 0
      changed_when: false

    - name: Создать временный marker для внешней проверки HTTP-01 route
      ansible.builtin.shell: |
        set -euo pipefail
        nginx_image="$(docker inspect "{{ site_runtime_instance }}-nginx-1" --format '{{ '{{.Image}}' }}')"
        docker run --rm \
          -v "{{ site_runtime_publication_model.storage.acme_webroot.volume }}:/var/www/acme" \
          "$nginx_image" sh -ec \
          'mkdir -p /var/www/acme/.well-known/acme-challenge; printf %s "$1" > "/var/www/acme/.well-known/acme-challenge/$1"' \
          sh "{{ site_runtime_publication_http01_id }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Проверить применённый HTTP-01 route извне
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - >-
            import sys, urllib.request;
            token=sys.argv[2];
            body=urllib.request.urlopen(
              'http://' + sys.argv[1] + '/.well-known/acme-challenge/' + token,
              timeout=15).read().decode();
            assert body == token;
            print(200)
          - "{{ site_runtime_publication_model.domain }}"
          - "{{ site_runtime_publication_http01_id }}"
      delegate_to: localhost
      become: false
      check_mode: false
      changed_when: false
      register: site_runtime_publication_http01_applied_external

    - name: Удалить временный HTTP-01 marker
      ansible.builtin.shell: |
        set -euo pipefail
        nginx_image="$(docker inspect "{{ site_runtime_instance }}-nginx-1" --format '{{ '{{.Image}}' }}')"
        docker run --rm \
          -v "{{ site_runtime_publication_model.storage.acme_webroot.volume }}:/var/www/acme" \
          "$nginx_image" sh -ec 'rm -f "/var/www/acme/.well-known/acme-challenge/$1"' \
          sh "{{ site_runtime_publication_http01_id }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Записать успешный HTTP-01 journal
      ansible.builtin.copy:
        content: >-
          {{ {'http01_id': site_runtime_publication_http01_id,
          'time_utc': now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ'),
          'instance': site_runtime_instance, 'domain': site_runtime_publication_model.domain,
          'route_host': site_runtime_publication_model.domain,
          'route_path_prefix': '/.well-known/acme-challenge/',
          'backend': site_runtime_publication_model.edge.http_acme_backend,
          'application_network': site_runtime_publication_model.edge.application_network,
          'previous_haproxy_checksum': site_runtime_publication_http01_haproxy_current | hash('sha256'),
          'current_haproxy_checksum': site_runtime_publication_http01_haproxy_future | hash('sha256'),
          'render_checksums': site_runtime_publication_model.render.http01.checksums,
          'external_probe': 'succeeded', 'certificate_requested': False,
          'application_published': False, 'final_status': 'succeeded'} | to_nice_json }}
        dest: >-
          {{ site_runtime_publication_http01_journal_root }}/{{ site_runtime_publication_http01_id }}.json
        owner: root
        group: root
        mode: "0640"
      when: site_runtime_publication_http01_mutation_required | bool

    - name: Дополнить current receipt принятым HTTP-01 route
      ansible.builtin.copy:
        content: >-
          {{ site_runtime_publication_http01_receipt | combine({
          'http01': {'http01_id': site_runtime_publication_http01_id,
          'route_host': site_runtime_publication_model.domain,
          'route_path_prefix': '/.well-known/acme-challenge/',
          'backend': site_runtime_publication_model.edge.http_acme_backend,
          'application_network': site_runtime_publication_model.edge.application_network,
          'haproxy_checksum': site_runtime_publication_http01_haproxy_future | hash('sha256'),
          'render_checksums': site_runtime_publication_model.render.http01.checksums,
          'final_status': 'succeeded'}}, recursive=True) | to_nice_json }}
        dest: "{{ site_runtime_publication_http01_journal_root }}/current.json"
        owner: root
        group: root
        mode: "0640"
      when: site_runtime_publication_http01_mutation_required | bool

  rescue:
    - name: Удалить диагностический HTTP-01 marker после ошибки
      ansible.builtin.shell: |
        nginx_image="$(docker inspect "{{ site_runtime_instance }}-nginx-1" --format '{{ '{{.Image}}' }}' 2>/dev/null || true)"
        if [ -n "$nginx_image" ]; then
          docker run --rm \
            -v "{{ site_runtime_publication_model.storage.acme_webroot.volume }}:/var/www/acme" \
            "$nginx_image" sh -ec 'rm -f "/var/www/acme/.well-known/acme-challenge/$1"' \
            sh "{{ site_runtime_publication_http01_id }}" >/dev/null 2>&1 || true
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Восстановить предыдущий HAProxy config после ошибки
      ansible.builtin.copy:
        content: "{{ site_runtime_publication_http01_haproxy_current }}"
        dest: "{{ site_runtime_publication_edge_config }}"
        owner: root
        group: root
        mode: "0644"
      when: not site_runtime_publication_http01_route_already_applied | bool

    - name: Перезапустить HAProxy после аварийного восстановления
      ansible.builtin.command:
        argv:
          - docker
          - restart
          - "{{ site_runtime_publication_edge_container }}"
      when: not site_runtime_publication_http01_route_already_applied | bool

    - name: Вернуть исходное network attachment после ошибки
      ansible.builtin.command:
        argv:
          - docker
          - network
          - disconnect
          - "{{ site_runtime_publication_model.edge.application_network }}"
          - "{{ site_runtime_publication_edge_container }}"
      failed_when: false
      when: not site_runtime_publication_http01_edge_network_was_attached | bool

    - name: Записать failed HTTP-01 journal
      ansible.builtin.copy:
        content: >-
          {{ {'http01_id': site_runtime_publication_http01_id,
          'time_utc': now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ'),
          'instance': site_runtime_instance, 'domain': site_runtime_publication_model.domain,
          'route_host': site_runtime_publication_model.domain,
          'route_path_prefix': '/.well-known/acme-challenge/',
          'certificate_requested': False, 'application_published': False,
          'rollback_attempted': True, 'final_status': 'failed'} | to_nice_json }}
        dest: >-
          {{ site_runtime_publication_http01_journal_root }}/{{ site_runtime_publication_http01_id }}.json
        owner: root
        group: root
        mode: "0640"

    - name: Остановить HTTP-01 apply после аварийного восстановления
      ansible.builtin.fail:
        msg: >-
          HTTP-01 route не принят; предыдущий HAProxy config и исходное network attachment восстановлены.

- name: Проверить итоговые сети edge HAProxy после HTTP-01 рубежа
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - "{{ site_runtime_publication_edge_container }}"
      - --format
      - "{{ '{{json .NetworkSettings.Networks}}' }}"
  check_mode: false
  changed_when: false
  register: site_runtime_publication_http01_edge_networks_final
  when: site_runtime_publication_action == 'publication-http01'

- name: Прочитать итоговый HAProxy config после HTTP-01 рубежа
  ansible.builtin.slurp:
    src: "{{ site_runtime_publication_edge_config }}"
  check_mode: false
  register: site_runtime_publication_http01_haproxy_final_slurp
  when: site_runtime_publication_action == 'publication-http01'

- name: Зафиксировать итоговый HAProxy config в памяти
  ansible.builtin.set_fact:
    site_runtime_publication_http01_haproxy_final: >-
      {{ site_runtime_publication_http01_haproxy_final_slurp.content | b64decode }}
  when: site_runtime_publication_action == 'publication-http01'

- name: Сформировать безопасный результат проверки публикации
  ansible.builtin.set_fact:
    site_runtime_publication_result:
      action: "{{ site_runtime_publication_action }}"
      instance: "{{ site_runtime_instance }}"
      domain: "{{ site_runtime_publication_model.domain }}"
      dns_matches_expected_target: "{{ (site_runtime_publication_dns.stdout | from_json).matches }}"
      ingress_alias: "{{ site_runtime_publication_model.edge.ingress_alias }}"
      public_route_enabled: false
      check_mode_mutations: false
      edge_app_network_attached: >-
        {{
          site_runtime_publication_model.edge.application_network
          in (
            (site_runtime_publication_http01_edge_networks_final.stdout | from_json)
            if site_runtime_publication_action == 'publication-http01'
            else (site_runtime_publication_edge_networks.stdout | from_json)
          )
        }}
      edge_app_network_attachment_planned: "{{ ansible_check_mode }}"
      http_acme_backend: "{{ site_runtime_publication_model.edge.http_acme_backend }}"
      https_backend: "{{ site_runtime_publication_model.edge.https_backend }}"
      tls_termination: "{{ site_runtime_publication_model.tls.termination }}"
      external_health: "{{ site_runtime_publication_model.health.external }}"
      private_endpoints: "{{ site_runtime_publication_model.health.private }}"
      security: "{{ site_runtime_publication_model.security }}"
      render_checksums: "{{ site_runtime_publication_model.render.checksums }}"

- name: Дополнить результат check-only HTTP-01 ingress contract
  ansible.builtin.set_fact:
    site_runtime_publication_result: >-
      {{ site_runtime_publication_result | combine({
        'http01': {
          'prerequisites_accepted': true,
          'current_external_status': site_runtime_publication_http01_external.stdout | int,
          'applied_external_status': (
            site_runtime_publication_http01_applied_external.stdout | int
            if not ansible_check_mode else none
          ),
          'previous_haproxy_checksum': site_runtime_publication_http01_haproxy_current | hash('sha256'),
          'current_haproxy_checksum': site_runtime_publication_http01_haproxy_final | hash('sha256'),
          'prospective_haproxy_checksum': site_runtime_publication_http01_haproxy_future | hash('sha256'),
          'render_checksums': site_runtime_publication_model.render.http01.checksums,
          'route_host': site_runtime_publication_model.domain,
          'route_path_prefix': '/.well-known/acme-challenge/',
          'future_backend': site_runtime_publication_model.edge.http_acme_backend,
          'haproxy_config_valid': true,
          'already_applied': (
            site_runtime_publication_http01_route_already_applied | bool
            and site_runtime_publication_http01_edge_network_was_attached | bool
          ),
          'mutation_performed': (
            not ansible_check_mode
            and site_runtime_publication_http01_mutation_required | bool
          ),
          'edge_network_attachment_planned': (
            site_runtime_publication_model.edge.application_network
            not in (site_runtime_publication_http01_edge_networks_final.stdout | from_json)
          ),
          'edge_network_attached': (
            site_runtime_publication_model.edge.application_network
            in (site_runtime_publication_http01_edge_networks_final.stdout | from_json)
          ),
          'route_applied': (
            site_runtime_publication_http01_haproxy_final | hash('sha256')
            == site_runtime_publication_http01_haproxy_future | hash('sha256')
            and site_runtime_publication_http01_haproxy_final.count(
              site_runtime_publication_model.render.http01.documents.haproxy_frontend_rules
            ) == 1
            and site_runtime_publication_http01_haproxy_final.count(
              site_runtime_publication_model.render.http01.documents.haproxy_backend
            ) == 1
          ),
          'certificate_requested': false,
          'application_published': false,
          'check_mode_mutations': false
        }
      }, recursive=True) }}
  when: site_runtime_publication_action == 'publication-http01'

- name: Принять отсутствие изменений HTTP-01 check-only рубежа
  ansible.builtin.assert:
    that:
      - not site_runtime_publication_result.http01.certificate_requested | bool
      - not site_runtime_publication_result.http01.application_published | bool
      - not site_runtime_publication_result.http01.check_mode_mutations | bool
      - not site_runtime_publication_result.http01.mutation_performed | bool
      - site_runtime_publication_result.http01.current_external_status | int == 404
    fail_msg: HTTP-01 check-only contract обнаружил преждевременную публикацию или mutation.
  when:
    - site_runtime_publication_action == 'publication-http01'
    - ansible_check_mode

- name: Принять реальный HTTP-01 ingress без публикации приложения
  ansible.builtin.assert:
    that:
      - site_runtime_publication_result.http01.edge_network_attached | bool
      - site_runtime_publication_result.http01.route_applied | bool
      - site_runtime_publication_result.http01.applied_external_status | int == 200
      - not site_runtime_publication_result.http01.certificate_requested | bool
      - not site_runtime_publication_result.http01.application_published | bool
      - not site_runtime_publication_result.public_route_enabled | bool
    fail_msg: Реальный HTTP-01 route не прошёл итоговую безопасную приёмку.
  when:
    - site_runtime_publication_action == 'publication-http01'
    - not ansible_check_mode

- name: Дополнить результат future ACME/TLS storage contract
  ansible.builtin.set_fact:
    site_runtime_publication_result: >-
      {{ site_runtime_publication_result | combine({
        'current_json_checksum': site_runtime_publication_current_stat.stat.checksum,
        'current_compose_file_checksum': site_runtime_publication_compose_stat.stat.checksum,
        'current_compose_checksum': site_runtime_publication_current.compose_checksum,
        'current_deployment_id': site_runtime_publication_current.deployment_id,
        'acme_webroot_volume': site_runtime_publication_model.storage.acme_webroot.volume,
        'tls_volume': site_runtime_publication_model.storage.tls.volume,
        'acme_webroot_volume_present': site_runtime_publication_acme_volume.rc == 0,
        'tls_volume_present': site_runtime_publication_tls_volume.rc == 0,
        'already_prepared': site_runtime_publication_already_prepared | bool,
        'preparation_render_checksums': site_runtime_publication_model.render.preparation.checksums,
        'future_compose_contract_checksum': (
          site_runtime_publication_current.compose_checksum ~ ':' ~
          site_runtime_publication_model.render.preparation.checksums.compose_override_fragment
        ) | hash('sha256'),
        'volumes_created': false,
        'certificate_requested': false,
        'runtime_changed': false,
        'edge_changed': false
      }, recursive=True) }}
  when: site_runtime_publication_action == 'publication-prepare'

- name: Дополнить результат реального ACME/TLS preparation
  ansible.builtin.set_fact:
    site_runtime_publication_result: >-
      {{ site_runtime_publication_result | combine({
        'already_prepared': site_runtime_publication_already_prepared | bool,
        'acme_webroot_volume_present': true,
        'tls_volume_present': true,
        'volumes_created': (
          not site_runtime_publication_already_prepared | bool
          and (site_runtime_publication_acme_volume.rc != 0 or site_runtime_publication_tls_volume.rc != 0)
        ),
        'nginx_updated': not site_runtime_publication_already_prepared | bool,
        'application_current_unchanged': true,
        'base_compose_unchanged': true,
        'private_health': 'succeeded',
        'acme_only_root_status': 404,
        'certificate_requested': false,
        'runtime_changed': not site_runtime_publication_already_prepared | bool,
        'edge_changed': false,
        'public_route_enabled': false
      }, recursive=True) }}
  when:
    - site_runtime_publication_action == 'publication-prepare'
    - not ansible_check_mode

- name: Принять read-only проверку публикации
  ansible.builtin.assert:
    that:
      - site_runtime_publication_result.dns_matches_expected_target | bool
      - not site_runtime_publication_result.public_route_enabled | bool
      - not site_runtime_publication_result.check_mode_mutations | bool
    fail_msg: DNS или check-only contract будущей публикации не принят.

- name: Принять отсутствие изменений на ACME preparation рубеже
  ansible.builtin.assert:
    that:
      - not site_runtime_publication_result.volumes_created | bool
      - not site_runtime_publication_result.certificate_requested | bool
      - not site_runtime_publication_result.runtime_changed | bool
      - not site_runtime_publication_result.edge_changed | bool
    fail_msg: publication-prepare не должен изменять volumes, TLS, runtime или edge.
  when:
    - site_runtime_publication_action == 'publication-prepare'
    - ansible_check_mode

- name: Вывести результат проверки публикации без секретов
  ansible.builtin.debug:
    var: site_runtime_publication_result
