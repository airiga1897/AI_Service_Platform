---
softether_l3_state: present
softether_l3_purge_data: false

softether_l3_operator_tunnels_file: "{{ playbook_dir }}/../../operator/softether/l3/tunnels.yml"
softether_l3_operator_secrets_dir: "{{ playbook_dir }}/../../operator/softether/l3/secrets"

softether_l3_root_dir: /opt/ai-service-platform/softether_l3
softether_l3_data_dir: "{{ softether_l3_root_dir }}/softether_data"
softether_l3_logs_dir: "{{ softether_l3_root_dir }}/softether_logs"
softether_l3_compose_file: "{{ softether_l3_root_dir }}/docker-compose.yml"
softether_l3_adminip_file: "{{ softether_l3_root_dir }}/adminip.txt"

softether_l3_image: softethervpn/vpnserver:stable
softether_l3_container_name: softether-l3
softether_l3_router_image: ai-service-platform/policy-router:local
softether_l3_router_container_name: softether-l3-router
softether_l3_router_build_context: "{{ playbook_dir }}/../docker/policy-router"
softether_l3_router_remote_build_context: "{{ softether_l3_root_dir }}/policy-router-build-context"

softether_l3_network_name: ai_service_softether_l3
softether_l3_network_subnet: 172.26.0.0/24
softether_l3_container_ipv4: 172.26.0.2

softether_l3_vpncmd_timeout_seconds: 20
softether_l3_startup_timeout_seconds: 60
softether_l3_tap_device_prefix: l3pg
softether_l3_postgres_host_gateway: 172.26.0.1
softether_l3_postgres_port: 5432
