---
- name: Validate softether_l3 state
  ansible.builtin.assert:
    that:
      - softether_l3_state in ['present', 'absent']
      - softether_l3_purge_data in [true, false, 'true', 'false', 'True', 'False']
    fail_msg: "softether_l3_state must be present|absent and purge flag must be boolean-like."

- name: Check softether_l3 compose file
  ansible.builtin.stat:
    path: "{{ softether_l3_compose_file }}"
  register: softether_l3_compose_stat
  when: softether_l3_state == 'absent'

- name: Build softether_l3 model from operator intent
  ansible.builtin.shell: |
    set -euo pipefail
    python3 - <<'PY'
    import ipaddress
    import json
    import os
    import sys

    try:
        import yaml
    except Exception as exc:
        print(f"PyYAML is required to read softether_l3 tunnels: {exc}", file=sys.stderr)
        sys.exit(1)

    alias = os.environ["INVENTORY_HOSTNAME"]
    path = os.environ["TUNNELS_FILE"]
    tap_prefix = os.environ["TAP_PREFIX"]
    secrets_dir = os.environ["SECRETS_DIR"]

    def fail(message):
        print(message, file=sys.stderr)
        sys.exit(1)

    if not os.path.isfile(path):
        fail(f"softether_l3 tunnels file not found: {path}")
    with open(path, encoding="utf-8") as handle:
        config = yaml.safe_load(handle) or {}
    tunnels = [t for t in config.get("tunnels", []) if t.get("state", "present") == "present"]
    seen_hubs = set()
    selected = []
    for tunnel in tunnels:
        hub = str(tunnel.get("hub") or "").strip()
        if not hub:
            fail("each softether_l3 tunnel requires hub")
        if hub in seen_hubs:
            fail(f"softether_l3 hub {hub} is used by more than one tunnel")
        seen_hubs.add(hub)
        if alias in [tunnel.get("listener_alias"), tunnel.get("peer_alias")]:
            selected.append(tunnel)
    if len(selected) != 1:
        fail(f"{alias} must participate in exactly one present softether_l3 tunnel; found {len(selected)}")
    tunnel = selected[0]
    role = "listener" if alias == tunnel.get("listener_alias") else "peer"
    subnet = ipaddress.ip_network(str(tunnel["subnet"]), strict=True)
    listener_ip = ipaddress.ip_address(str(tunnel["listener_ip"]))
    peer_ip = ipaddress.ip_address(str(tunnel["peer_ip"]))
    if listener_ip not in subnet or peer_ip not in subnet or listener_ip == peer_ip:
        fail(f"softether_l3 tunnel {tunnel['name']} endpoint IPs must be unique and inside subnet {subnet}")
    tap_suffix = "".join(ch.lower() if ch.isalnum() else "" for ch in str(tunnel["name"]))
    # Linux IFNAMSIZ leaves 15 visible chars; SoftEther creates tap_<device>.
    tap_device = (tap_prefix + tap_suffix)[:11]
    model = {
        "name": tunnel["name"],
        "role": role,
        "listener_alias": tunnel["listener_alias"],
        "peer_alias": tunnel["peer_alias"],
        "sni": tunnel["sni"],
        "public_port": int(tunnel.get("public_port") or 443),
        "hub": tunnel["hub"],
        "subnet": str(subnet),
        "prefixlen": subnet.prefixlen,
        "listener_ip": str(listener_ip),
        "peer_ip": str(peer_ip),
        "local_ip": str(listener_ip if role == "listener" else peer_ip),
        "remote_ip": str(peer_ip if role == "listener" else listener_ip),
        "tap_device": tap_device,
        "tap_interface": "tap_" + tap_device,
        "purpose": tunnel.get("purpose") or "",
        "secret_file": os.path.join(secrets_dir, tunnel["name"] + ".json"),
    }
    print(json.dumps(model, sort_keys=True))
    PY
  args:
    executable: /bin/bash
  environment:
    INVENTORY_HOSTNAME: "{{ inventory_hostname }}"
    TUNNELS_FILE: "{{ softether_l3_operator_tunnels_file }}"
    SECRETS_DIR: "{{ softether_l3_operator_secrets_dir }}"
    TAP_PREFIX: "{{ softether_l3_tap_device_prefix }}"
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  register: softether_l3_model_command
  when: softether_l3_state == 'present'

- name: Store softether_l3 model
  ansible.builtin.set_fact:
    softether_l3_model: "{{ softether_l3_model_command.stdout | from_json }}"
  when: softether_l3_state == 'present'

- name: Validate softether_l3 tunnel secret presence on control node
  ansible.builtin.shell: |
    set -euo pipefail
    python3 - <<'PY'
    import json
    import os
    import sys
    path = os.environ["SECRET_FILE"]
    required = {"server_password", "hub_password", "peer_user", "peer_password"}
    if not os.path.isfile(path):
        print(f"softether_l3 secret file not found: {path}", file=sys.stderr)
        sys.exit(1)
    try:
        with open(path, encoding="utf-8") as handle:
            data = json.load(handle)
    except Exception as exc:
        print(f"softether_l3 secret JSON is invalid: {path}: {exc}", file=sys.stderr)
        sys.exit(1)
    missing = sorted(key for key in required if not str(data.get(key) or "").strip())
    if missing:
        print(f"softether_l3 secret file {path} is missing required keys: {', '.join(missing)}", file=sys.stderr)
        sys.exit(1)
    print(f"softether_l3 secret file is present and has required keys: {path}")
    PY
  args:
    executable: /bin/bash
  environment:
    SECRET_FILE: "{{ softether_l3_model.secret_file }}"
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  when: softether_l3_state == 'present'

- name: Load softether_l3 tunnel secret from control node
  ansible.builtin.shell: |
    set -euo pipefail
    python3 - <<'PY'
    import json
    import os
    path = os.environ["SECRET_FILE"]
    required = {"server_password", "hub_password", "peer_user", "peer_password"}
    with open(path, encoding="utf-8") as handle:
        data = json.load(handle)
    print(json.dumps({key: str(data[key]) for key in sorted(required)}))
    PY
  args:
    executable: /bin/bash
  environment:
    SECRET_FILE: "{{ softether_l3_model.secret_file }}"
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  no_log: true
  register: softether_l3_secret_command
  when: softether_l3_state == 'present'

- name: Store softether_l3 secret map
  ansible.builtin.set_fact:
    softether_l3_secret_map: "{{ softether_l3_secret_command.stdout | from_json }}"
  no_log: true
  when: softether_l3_state == 'present'

- name: Ensure softether_l3 runtime directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ softether_l3_root_dir }}"
    - "{{ softether_l3_data_dir }}"
    - "{{ softether_l3_logs_dir }}"
  when: softether_l3_state == 'present'

- name: Render softether_l3 admin IP allowlist
  ansible.builtin.copy:
    dest: "{{ softether_l3_adminip_file }}"
    content: |
      127.0.0.1
      {{ softether_l3_container_ipv4 }}
    mode: "0644"
  register: softether_l3_adminip_copy
  when: softether_l3_state == 'present'

- name: Render softether_l3 Docker Compose
  ansible.builtin.template:
    src: docker-compose.softether-l3.yml.j2
    dest: "{{ softether_l3_compose_file }}"
    mode: "0640"
  register: softether_l3_compose_template
  when: softether_l3_state == 'present'

- name: Ensure Docker runtime baseline for softether_l3
  ansible.builtin.include_role:
    name: docker_runtime_baseline
  when:
    - not ansible_check_mode
    - softether_l3_state == 'present' or (softether_l3_compose_stat.stat.exists | default(false))

- name: Ensure softether_l3 Docker network exists
  ansible.builtin.command:
    cmd: docker network create --subnet "{{ softether_l3_network_subnet }}" "{{ softether_l3_network_name }}"
  register: softether_l3_network_create
  changed_when: softether_l3_network_create.rc == 0
  failed_when:
    - softether_l3_network_create.rc != 0
    - "'already exists' not in (softether_l3_network_create.stderr | default(''))"
  when:
    - softether_l3_state == 'present'
    - not ansible_check_mode

- name: Copy policy-router build context for softether_l3 router sidecar
  ansible.builtin.copy:
    src: "{{ softether_l3_router_build_context }}/"
    dest: "{{ softether_l3_router_remote_build_context }}/"
    mode: preserve
  when:
    - softether_l3_state == 'present'
    - not ansible_check_mode

- name: Build local policy-router image for softether_l3 router sidecar
  ansible.builtin.command:
    cmd: docker build -t "{{ softether_l3_router_image }}" "{{ softether_l3_router_remote_build_context }}"
  changed_when: true
  when:
    - softether_l3_state == 'present'
    - not ansible_check_mode

- name: Start softether_l3 containers
  ansible.builtin.command:
    cmd: docker compose -f "{{ softether_l3_compose_file }}" up -d
    chdir: "{{ softether_l3_root_dir }}"
  register: softether_l3_compose_up
  changed_when: >
    (softether_l3_compose_up.stdout ~ softether_l3_compose_up.stderr)
    is search('(?i)(creating|created|recreating|recreated|starting|started|pulling|pulled|building|built)')
  when:
    - softether_l3_state == 'present'
    - not ansible_check_mode

- name: Restart softether_l3 when runtime files changed
  ansible.builtin.command:
    cmd: docker compose -f "{{ softether_l3_compose_file }}" restart
    chdir: "{{ softether_l3_root_dir }}"
  changed_when: true
  when:
    - softether_l3_state == 'present'
    - not ansible_check_mode
    - not softether_l3_compose_up.changed
    - >
      (softether_l3_compose_template.changed | default(false))
      or (softether_l3_adminip_copy.changed | default(false))

- name: Configure softether_l3 server and tunnel
  ansible.builtin.shell: |
    set -euo pipefail
    container="{{ softether_l3_container_name }}"
    password="${SERVER_PASSWORD}"
    hub="${HUB_NAME}"
    hub_password="${HUB_PASSWORD}"
    peer_user="${PEER_USER}"
    peer_password="${PEER_PASSWORD}"
    role="${NODE_ROLE}"
    connection="${CONNECTION_NAME}"
    sni="${LISTENER_SNI}"
    port="${LISTENER_PORT}"
    timeout_s="${VPNCMD_TIMEOUT}"

    run_vpncmd_file() {
      local input_file="$1"
      timeout "${timeout_s}s" docker exec -i -e VPNCMD_PASSWORD="$password" "$container" sh -c 'tmp="$(mktemp)"; trap "rm -f \"$tmp\"" EXIT; cat > "$tmp"; vpncmd localhost:5555 /SERVER /PASSWORD:"$VPNCMD_PASSWORD" /IN:"$tmp" >/dev/null' < "$input_file"
    }

    if ! timeout "${timeout_s}s" docker exec "$container" vpncmd localhost:5555 /SERVER /PASSWORD:"$password" /CMD ServerInfoGet >/dev/null 2>&1; then
      timeout "${timeout_s}s" docker exec "$container" vpncmd localhost:5555 /SERVER /PASSWORD: /CMD ServerPasswordSet "$password" >/dev/null
    fi

    listeners="$(timeout "${timeout_s}s" docker exec "$container" vpncmd localhost:5555 /SERVER /PASSWORD:"$password" /CMD ListenerList 2>/dev/null || true)"
    echo "$listeners" | grep -Eq '(^|[^0-9])443([^0-9]|$)' || timeout "${timeout_s}s" docker exec "$container" vpncmd localhost:5555 /SERVER /PASSWORD:"$password" /CMD ListenerCreate 443 >/dev/null

    hubs="$(timeout "${timeout_s}s" docker exec "$container" vpncmd localhost:5555 /SERVER /PASSWORD:"$password" /CMD HubList 2>/dev/null || true)"
    echo "$hubs" | grep -Fq "$hub" || timeout "${timeout_s}s" docker exec "$container" vpncmd localhost:5555 /SERVER /PASSWORD:"$password" /CMD HubCreate "$hub" /PASSWORD:"$hub_password" >/dev/null

    input="$(mktemp)"
    trap 'rm -f "$input"' EXIT
    users="$(timeout "${timeout_s}s" docker exec "$container" vpncmd localhost:5555 /SERVER /PASSWORD:"$password" /HUB:"$hub" /CMD UserList 2>/dev/null || true)"
    cascades=""
    if [ "$role" = "peer" ]; then
      cascades="$(timeout "${timeout_s}s" docker exec "$container" vpncmd localhost:5555 /SERVER /PASSWORD:"$password" /HUB:"$hub" /CMD CascadeList 2>/dev/null || true)"
    fi
    {
      printf 'Hub %s\n' "$hub"
      if ! echo "$users" | grep -Fq "$peer_user"; then
        printf 'UserCreate %s /GROUP:none /REALNAME:none /NOTE:none\n' "$peer_user"
      fi
      printf 'UserPasswordSet %s /PASSWORD:%s\n' "$peer_user" "$peer_password"
      if [ "$role" = "peer" ]; then
        if echo "$cascades" | grep -Fq "$connection"; then
          printf 'CascadeDelete %s\n' "$connection"
        fi
        printf 'CascadeCreate %s /SERVER:%s:%s /HUB:%s /USERNAME:%s\n' "$connection" "$sni" "$port" "$hub" "$peer_user"
        printf 'CascadePasswordSet %s /PASSWORD:%s /TYPE:standard\n' "$connection" "$peer_password"
        printf 'CascadeOnline %s\n' "$connection"
      fi
      printf 'Flush\n'
    } > "$input"
    run_vpncmd_file "$input"
  args:
    executable: /bin/bash
  environment:
    SERVER_PASSWORD: "{{ softether_l3_secret_map.server_password }}"
    HUB_PASSWORD: "{{ softether_l3_secret_map.hub_password }}"
    PEER_USER: "{{ softether_l3_secret_map.peer_user }}"
    PEER_PASSWORD: "{{ softether_l3_secret_map.peer_password }}"
    HUB_NAME: "{{ softether_l3_model.hub }}"
    NODE_ROLE: "{{ softether_l3_model.role }}"
    CONNECTION_NAME: "{{ softether_l3_model.name }}"
    LISTENER_SNI: "{{ softether_l3_model.sni }}"
    LISTENER_PORT: "{{ softether_l3_model.public_port }}"
    VPNCMD_TIMEOUT: "{{ softether_l3_vpncmd_timeout_seconds }}"
  no_log: true
  when:
    - softether_l3_state == 'present'
    - not ansible_check_mode

- name: Ensure softether_l3 local bridge TAP exists
  ansible.builtin.shell: |
    set -euo pipefail
    iface="{{ softether_l3_model.tap_interface }}"
    tap="{{ softether_l3_model.tap_device }}"
    if docker exec "{{ softether_l3_router_container_name }}" ip link show "$iface" >/dev/null 2>&1; then
      exit 0
    fi
    docker exec "{{ softether_l3_container_name }}" vpncmd localhost:5555 /SERVER /PASSWORD:"${SERVER_PASSWORD}" /CMD BridgeCreate "{{ softether_l3_model.hub }}" /DEVICE:"$tap" /TAP:yes >/dev/null
    docker exec "{{ softether_l3_container_name }}" vpncmd localhost:5555 /SERVER /PASSWORD:"${SERVER_PASSWORD}" /CMD Flush >/dev/null
  args:
    executable: /bin/bash
  environment:
    SERVER_PASSWORD: "{{ softether_l3_secret_map.server_password }}"
  no_log: true
  when:
    - softether_l3_state == 'present'
    - not ansible_check_mode

- name: Verify softether_l3 peer cascade connection is online
  ansible.builtin.shell: |
    set -euo pipefail
    tmp="$(mktemp)"
    trap 'rm -f "$tmp"' EXIT
    printf 'CascadeStatusGet %s\n' "{{ softether_l3_model.name }}" |
      docker exec -i -e VPNCMD_PASSWORD="${SERVER_PASSWORD}" "{{ softether_l3_container_name }}" sh -c 'cat > /tmp/ai-sp-l3-status.in; vpncmd localhost:5555 /SERVER /PASSWORD:"$VPNCMD_PASSWORD" /HUB:"{{ softether_l3_model.hub }}" /IN:/tmp/ai-sp-l3-status.in; rm -f /tmp/ai-sp-l3-status.in' > "$tmp" 2>&1
    status="$(sed -n 's/^[[:space:]]*Session Status[[:space:]]*|[[:space:]]*//p' "$tmp" | tail -n 1)"
    if printf '%s\n' "$status" | grep -Eq 'Connection Completed|Session Established'; then
      printf 'softether_l3 cascade online: %s\n' "$status"
      exit 0
    fi
    echo "softether_l3 cascade is not online; status=${status:-unknown}" >&2
    echo "--- CascadeStatusGet output tail ---" >&2
    tail -80 "$tmp" >&2
    echo "--- end CascadeStatusGet output tail ---" >&2
    exit 1
  args:
    executable: /bin/bash
  environment:
    SERVER_PASSWORD: "{{ softether_l3_secret_map.server_password }}"
  register: softether_l3_peer_cascade_status
  changed_when: false
  retries: 12
  delay: 5
  until: softether_l3_peer_cascade_status.rc == 0
  when:
    - softether_l3_state == 'present'
    - softether_l3_model.role == 'peer'
    - not ansible_check_mode

- name: Configure softether_l3 router dataplane
  ansible.builtin.shell: |
    set -euo pipefail
    router="{{ softether_l3_router_container_name }}"
    iface="{{ softether_l3_model.tap_interface }}"
    local_ip="{{ softether_l3_model.local_ip }}"
    remote_ip="{{ softether_l3_model.remote_ip }}"
    prefix="{{ softether_l3_model.prefixlen }}"
    role="{{ softether_l3_model.role }}"
    pg_gateway="{{ softether_l3_postgres_host_gateway }}"
    pg_port="{{ softether_l3_postgres_port }}"
    docker exec "$router" sh -ceu "
      ip link set '$iface' up
      ip addr replace '$local_ip/$prefix' dev '$iface'
      if [ \"$(cat /proc/sys/net/ipv4/ip_forward 2>/dev/null || echo 0)\" != 1 ]; then
        sysctl -w net.ipv4.ip_forward=1 >/dev/null
      fi
      iptables -t nat -C POSTROUTING -d '$remote_ip/32' -p tcp --dport '$pg_port' -j SNAT --to-source '$local_ip' 2>/dev/null || iptables -t nat -A POSTROUTING -d '$remote_ip/32' -p tcp --dport '$pg_port' -j SNAT --to-source '$local_ip'
      if [ '$role' = listener ]; then
        iptables -t nat -C PREROUTING -d '$local_ip/32' -p tcp --dport '$pg_port' -j DNAT --to-destination '$pg_gateway:$pg_port' 2>/dev/null || iptables -t nat -A PREROUTING -d '$local_ip/32' -p tcp --dport '$pg_port' -j DNAT --to-destination '$pg_gateway:$pg_port'
      fi
    "
    ip route replace "$remote_ip/32" via "{{ softether_l3_container_ipv4 }}"
  args:
    executable: /bin/bash
  changed_when: false
  when:
    - softether_l3_state == 'present'
    - not ansible_check_mode

- name: Verify softether_l3 router dataplane
  ansible.builtin.shell: |
    set -euo pipefail
    docker exec "{{ softether_l3_router_container_name }}" ip addr show "{{ softether_l3_model.tap_interface }}" | grep -F "{{ softether_l3_model.local_ip }}/"
    ip route get "{{ softether_l3_model.remote_ip }}" | grep -F "{{ softether_l3_container_ipv4 }}"
    docker exec "{{ softether_l3_router_container_name }}" ping -c 2 -W 2 "{{ softether_l3_model.remote_ip }}"
  args:
    executable: /bin/bash
  changed_when: false
  when:
    - softether_l3_state == 'present'
    - not ansible_check_mode

- name: Stop softether_l3 containers
  ansible.builtin.command:
    cmd: docker compose -f "{{ softether_l3_compose_file }}" down
    chdir: "{{ softether_l3_root_dir }}"
  changed_when: true
  when:
    - softether_l3_state == 'absent'
    - softether_l3_compose_stat.stat.exists | default(false)
    - not ansible_check_mode

- name: Purge softether_l3 runtime data when explicitly requested
  ansible.builtin.file:
    path: "{{ softether_l3_root_dir }}"
    state: absent
  when:
    - softether_l3_state == 'absent'
    - softether_l3_purge_data in [true, 'true', 'True']
    - not ansible_check_mode
