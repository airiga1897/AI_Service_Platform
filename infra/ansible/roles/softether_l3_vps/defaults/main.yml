---
softether_l3_vps_state: present
softether_l3_vps_purge_data: false

softether_l3_vps_operator_links_file: "{{ playbook_dir }}/../../operator/softether/l3-vps/links.yml"
softether_l3_vps_operator_secrets_dir: "{{ playbook_dir }}/../../operator/softether/l3-vps/secrets"

softether_l3_vps_root_dir: /opt/ai-service-platform/softether_l3_vps
softether_l3_vps_data_dir: "{{ softether_l3_vps_root_dir }}/softether_data"
softether_l3_vps_logs_dir: "{{ softether_l3_vps_root_dir }}/softether_logs"
softether_l3_vps_compose_file: "{{ softether_l3_vps_root_dir }}/docker-compose.yml"
softether_l3_vps_adminip_file: "{{ softether_l3_vps_root_dir }}/adminip.txt"

softether_l3_vps_server_image: softethervpn/vpnserver:stable
softether_l3_vps_client_image: softethervpn/vpnclient:stable
softether_l3_vps_client_build_context: https://github.com/SoftEtherVPN/SoftetherVPN-docker.git#master
softether_l3_vps_client_build_target: vpnclient
softether_l3_vps_server_container_name: softether-l3-vps-server
softether_l3_vps_client_container_name: softether-l3-vps-client

softether_l3_vps_network_name: ai_service_softether_l3_vps
softether_l3_vps_network_subnet: 172.27.0.0/24
softether_l3_vps_container_ipv4: 172.27.0.2

softether_l3_vps_vpncmd_timeout_seconds: 20
softether_l3_vps_startup_timeout_seconds: 60
softether_l3_vps_client_nic_name: l3vps0
softether_l3_vps_account_name: l3-vps-link
