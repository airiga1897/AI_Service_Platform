---
vpn_cascade_root_dir: /opt/ai-service-platform/vpn_cascade
vpn_cascade_data_dir: "{{ vpn_cascade_root_dir }}/softether_data"
vpn_cascade_logs_dir: "{{ vpn_cascade_root_dir }}/softether_logs"
vpn_cascade_backup_dir: "{{ vpn_cascade_root_dir }}/backups"
vpn_cascade_overrides_dir: "{{ vpn_cascade_root_dir }}/overrides"
vpn_cascade_compose_file: "{{ vpn_cascade_root_dir }}/docker-compose.yml"

vpn_cascade_seed_config: "{{ playbook_dir }}/../../operator/softether/cascade/{{ inventory_hostname }}/vpn_server.config"
vpn_cascade_local_override_dir: "{{ playbook_dir }}/../../operator/softether/cascade/{{ inventory_hostname }}/overrides"
vpn_cascade_link_secret_file: "{{ playbook_dir }}/../../operator/softether/cascade/secrets/lab-cascade.json"
vpn_cascade_operator_mgmt_ips: "{{ playbook_dir }}/../../operator/haproxy/lists/vpn_mgmt_ips.lst"
vpn_cascade_operator_networks_file: "{{ playbook_dir }}/../../operator/networks.csv"
vpn_cascade_operator_state_file: "{{ playbook_dir }}/../../operator/state.csv"
vpn_cascade_topology_name: lab-cascade

vpn_cascade_image: softethervpn/vpnserver:stable
vpn_cascade_container_name: softether-cascade
vpn_cascade_build_policy_router_image: true
vpn_cascade_policy_router_image_repository: ai-service-platform/policy-router
vpn_cascade_policy_router_build_context: "{{ playbook_dir }}/../docker/policy-router"
vpn_cascade_policy_router_image: ai-service-platform/policy-router:local
vpn_cascade_policy_router_container_name: policy-router
vpn_cascade_network_name: ai_service_cascade
vpn_cascade_network_subnet: 172.21.0.0/24
vpn_cascade_container_ipv4: 172.21.0.2
vpn_cascade_policy_network_name: ai_service_vpn_policy
vpn_cascade_policy_network_subnet: ""
vpn_cascade_policy_container_ipv4: ""
vpn_cascade_policy_router_ipv4: ""
vpn_cascade_policy_tap_device: vpnpolicy
vpn_cascade_policy_tap_interface: tap_vpnpolicy

vpn_cascade_host_https_port: 8443
vpn_cascade_host_alt_port: 8992
vpn_cascade_host_management_port: 8555
vpn_cascade_startup_timeout_seconds: 60
vpn_cascade_vpncmd_timeout_seconds: 20
vpn_cascade_retired_tcp_listeners:
  - 1194
vpn_cascade_retired_tcp_listeners_marker_file: "{{ vpn_cascade_root_dir }}/.retired_tcp_listeners_applied"
