---
vpn_edge_root_dir: /opt/ai-service-platform/vpn_edge
vpn_edge_data_dir: "{{ vpn_edge_root_dir }}/softether_data"
vpn_edge_logs_dir: "{{ vpn_edge_root_dir }}/softether_logs"
vpn_edge_backup_dir: "{{ vpn_edge_root_dir }}/backups"
vpn_edge_overrides_dir: "{{ vpn_edge_root_dir }}/overrides"
vpn_edge_tls_dir: "{{ vpn_edge_root_dir }}/nginx/ssl"
vpn_edge_compose_file: "{{ vpn_edge_root_dir }}/docker-compose.yml"

vpn_edge_seed_config: "{{ playbook_dir }}/../../operator/softether/edge/vpn_server.config"
vpn_edge_operator_config_file: "{{ playbook_dir }}/../../operator/softether/edge/config.yml"
vpn_edge_local_override_dir: "{{ playbook_dir }}/../../operator/softether/edge/overrides/{{ inventory_hostname }}"
vpn_edge_operator_networks_file: "{{ playbook_dir }}/../../operator/networks.csv"

vpn_edge_image: softethervpn/vpnserver:stable
vpn_edge_container_name: softether-edge
vpn_edge_network_name: ai_service_edge
vpn_edge_network_subnet: 172.20.0.0/24
vpn_edge_container_ipv4: 172.20.0.2
vpn_edge_management_network_name: ai_service_edge_mgmt
vpn_edge_management_network_subnet: 172.24.0.0/24
vpn_edge_management_container_ipv4: 172.24.0.2
vpn_edge_admin_source_ips:
  - 127.0.0.1
  - 172.24.0.3
vpn_edge_policy_network_name: ai_service_vpn_policy
vpn_edge_policy_network_subnet: ""
vpn_edge_policy_container_ipv4: ""
vpn_edge_policy_gateway_ipv4: ""
vpn_edge_disable_policy_network_aliases: []
vpn_edge_policy_network_enabled: true

vpn_edge_retired_tcp_listeners:
  - 1194
vpn_edge_retired_tcp_listeners_marker_file: "{{ vpn_edge_root_dir }}/.retired_tcp_listeners_applied"
vpn_edge_main_srv01_checkip_marker_file: "{{ vpn_edge_root_dir }}/.main_srv01_group_checkip_disabled"
