---
- name: Validate vpn_edge state
  ansible.builtin.assert:
    that:
      - vpn_state in ['present', 'absent']
      - vpn_purge_data in [true, false, 'true', 'false', 'True', 'False']
      - (vpn_reseed_config | default(false)) in [true, false, 'true', 'false', 'True', 'False']
    fail_msg: "vpn_state must be present|absent and vpn_purge_data/vpn_reseed_config must be boolean-like."

- name: Check vpn_edge compose file
  ansible.builtin.stat:
    path: "{{ vpn_edge_compose_file }}"
  register: vpn_edge_compose_stat
  when: vpn_state == 'absent' or ((vpn_reseed_config | default(false)) in [true, 'true', 'True'])

- name: Check edge seed config on control node
  ansible.builtin.stat:
    path: "{{ vpn_edge_seed_config }}"
  delegate_to: localhost
  become: false
  register: vpn_edge_seed_stat
  when: vpn_state == 'present'

- name: Require edge seed config
  ansible.builtin.assert:
    that:
      - vpn_edge_seed_stat.stat.exists
      - vpn_edge_seed_stat.stat.isreg
    fail_msg: "Missing SoftEther edge seed config on control node: {{ vpn_edge_seed_config }}"
  when: vpn_state == 'present'

- name: Check node-specific edge overrides on control node
  ansible.builtin.stat:
    path: "{{ vpn_edge_local_override_dir }}"
  delegate_to: localhost
  become: false
  register: vpn_edge_override_stat
  when: vpn_state == 'present'

- name: Ensure vpn_edge runtime directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ vpn_edge_root_dir }}"
    - "{{ vpn_edge_data_dir }}"
    - "{{ vpn_edge_logs_dir }}"
    - "{{ vpn_edge_backup_dir }}"
    - "{{ vpn_edge_overrides_dir }}"
    - "{{ vpn_edge_tls_dir }}"
  when: vpn_state == 'present'

- name: Check existing remote edge config
  ansible.builtin.stat:
    path: "{{ vpn_edge_data_dir }}/vpn_server.config"
  register: vpn_edge_remote_config_stat
  when: vpn_state == 'present'

- name: Require installed vpn_edge before reseeding config
  ansible.builtin.assert:
    that:
      - vpn_edge_compose_stat.stat.exists
      - vpn_edge_remote_config_stat.stat.exists
    fail_msg: "vpn_edge reseed requires an installed service with compose file and existing vpn_server.config on {{ inventory_hostname }}"
  when:
    - vpn_state == 'present'
    - (vpn_reseed_config | default(false)) in [true, 'true', 'True']

- name: Backup existing remote edge config before explicit reseed
  ansible.builtin.copy:
    src: "{{ vpn_edge_data_dir }}/vpn_server.config"
    dest: "{{ vpn_edge_backup_dir }}/vpn_server.config.pre-reseed-{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"
    remote_src: true
    mode: "0600"
  register: vpn_edge_reseed_backup
  when:
    - vpn_state == 'present'
    - vpn_edge_remote_config_stat.stat.exists
    - (vpn_reseed_config | default(false)) in [true, 'true', 'True']
    - not ansible_check_mode

- name: Install opaque SoftEther edge seed config
  ansible.builtin.copy:
    src: "{{ vpn_edge_seed_config }}"
    dest: "{{ vpn_edge_data_dir }}/vpn_server.config"
    mode: "0600"
  register: vpn_edge_seed_config_copy
  no_log: true
  when:
    - vpn_state == 'present'
    - >
      (not vpn_edge_remote_config_stat.stat.exists)
      or ((vpn_reseed_config | default(false)) in [true, 'true', 'True'])

- name: Report SoftEther config reseed backup path
  ansible.builtin.debug:
    msg: "SoftEther config backup created before reseed: {{ vpn_edge_reseed_backup.dest }}"
  when:
    - vpn_edge_reseed_backup is defined
    - vpn_edge_reseed_backup.dest is defined

- name: Stage node-specific edge overrides when present
  ansible.builtin.copy:
    src: "{{ vpn_edge_local_override_dir }}/"
    dest: "{{ vpn_edge_overrides_dir }}/"
    mode: preserve
  register: vpn_edge_overrides_copy
  no_log: true
  when:
    - vpn_state == 'present'
    - vpn_edge_override_stat.stat.exists
    - vpn_edge_override_stat.stat.isdir

- name: Render vpn_edge Docker Compose
  ansible.builtin.template:
    src: docker-compose.vpn-edge.yml.j2
    dest: "{{ vpn_edge_compose_file }}"
    mode: "0640"
  register: vpn_edge_compose_template
  when: vpn_state == 'present'

- name: Ensure Docker runtime baseline for vpn_edge
  ansible.builtin.include_role:
    name: docker_runtime_baseline
  when:
    - not ansible_check_mode
    - vpn_state == 'present' or (vpn_edge_compose_stat.stat.exists | default(false))

- name: Ensure Docker service is running for vpn_edge
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  when:
    - vpn_state == 'present'
    - not ansible_check_mode

- name: Verify Docker Compose plugin is available for vpn_edge
  ansible.builtin.command:
    cmd: docker compose version
  changed_when: false
  when:
    - vpn_state == 'present'
    - not ansible_check_mode

- name: Ensure shared edge Docker network exists
  ansible.builtin.command:
    cmd: docker network create --subnet "{{ vpn_edge_network_subnet }}" "{{ vpn_edge_network_name }}"
  register: vpn_edge_network_create
  changed_when: vpn_edge_network_create.rc == 0
  failed_when:
    - vpn_edge_network_create.rc != 0
    - "'already exists' not in (vpn_edge_network_create.stderr | default(''))"
  when:
    - vpn_state == 'present'
    - not ansible_check_mode

- name: Start vpn_edge container
  ansible.builtin.command:
    cmd: docker compose -f "{{ vpn_edge_compose_file }}" up -d
    chdir: "{{ vpn_edge_root_dir }}"
  register: vpn_edge_compose_up
  changed_when: >
    (vpn_edge_compose_up.stdout ~ vpn_edge_compose_up.stderr)
    is search('(?i)(creating|created|recreating|recreated|starting|started|pulling|pulled|building|built)')
  when:
    - vpn_state == 'present'
    - not ansible_check_mode

- name: Restart vpn_edge when bind-mounted runtime files changed
  ansible.builtin.command:
    cmd: docker compose -f "{{ vpn_edge_compose_file }}" restart "{{ vpn_edge_container_name }}"
    chdir: "{{ vpn_edge_root_dir }}"
  changed_when: true
  when:
    - vpn_state == 'present'
    - not ansible_check_mode
    - not vpn_edge_compose_up.changed
    - >
      ((vpn_reseed_config | default(false)) in [true, 'true', 'True'])
      or (vpn_edge_overrides_copy.changed | default(false))

- name: Verify running vpn_edge container network attachment
  ansible.builtin.shell: |
    set -euo pipefail
    docker inspect "{{ vpn_edge_container_name }}" | python3 -c 'import json, os, sys; data = json.load(sys.stdin)[0]; network = os.environ["EXPECTED_NETWORK"]; expected_ip = os.environ["EXPECTED_IP"]; actual_ip = data.get("NetworkSettings", {}).get("Networks", {}).get(network, {}).get("IPAddress"); running = data.get("State", {}).get("Running"); sys.exit(0 if running and actual_ip == expected_ip else 1)'
  args:
    executable: /bin/bash
  environment:
    EXPECTED_NETWORK: "{{ vpn_edge_network_name }}"
    EXPECTED_IP: "{{ vpn_edge_container_ipv4 }}"
  changed_when: false
  register: vpn_edge_container_ready
  until: vpn_edge_container_ready.rc == 0
  retries: 15
  delay: 2
  when:
    - vpn_state == 'present'
    - not ansible_check_mode

- name: Ensure Docker service is running before stopping vpn_edge
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  when:
    - vpn_state == 'absent'
    - vpn_edge_compose_stat.stat.exists | default(false)
    - not ansible_check_mode

- name: Verify Docker Compose plugin is available before stopping vpn_edge
  ansible.builtin.command:
    cmd: docker compose version
  changed_when: false
  when:
    - vpn_state == 'absent'
    - vpn_edge_compose_stat.stat.exists | default(false)
    - not ansible_check_mode

- name: Stop vpn_edge container
  ansible.builtin.command:
    cmd: docker compose -f "{{ vpn_edge_compose_file }}" down
    chdir: "{{ vpn_edge_root_dir }}"
  changed_when: true
  when:
    - vpn_state == 'absent'
    - vpn_edge_compose_stat.stat.exists | default(false)
    - not ansible_check_mode

- name: Purge vpn_edge runtime data when explicitly requested
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ vpn_edge_data_dir }}"
    - "{{ vpn_edge_logs_dir }}"
    - "{{ vpn_edge_overrides_dir }}"
  when:
    - vpn_state == 'absent'
    - vpn_purge_data in [true, 'true', 'True']
    - not ansible_check_mode
