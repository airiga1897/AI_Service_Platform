---
# SoftEther/VPN service rollout entrypoint.
#
# This playbook is intentionally scoped to vpn_edges so the vpn_edge service
# rollout does not trigger product, backup, or monitoring stacks from site.yml.
# vpn_cascade remains reserved for future site-to-site/cascade transport.

- name: SoftEther vpn_edge service rollout
  hosts: vpn_edges
  become: true
  gather_facts: false
  vars:
    vpn_state: present
    vpn_purge_data: false
  roles:
    - vpn_edge
