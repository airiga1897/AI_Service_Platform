---
# SoftEther cascade/site-to-site service rollout entrypoint.
#
# This playbook is intentionally separate from vpn_edge. It manages a distinct
# SoftEther container, config volume, logs, and Docker network. It does not
# publish public ports or change routing policy.

- name: SoftEther vpn_cascade service rollout
  hosts: vpn_cascades
  become: true
  roles:
    - vpn_cascade
