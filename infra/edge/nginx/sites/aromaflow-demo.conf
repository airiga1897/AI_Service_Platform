# СГЕНЕРИРОВАННЫЙ ФАЙЛ — не редактируйте вручную.
# Источник: services.yml + tools/render-edge/templates/site.nginx.conf.j2
# Регенерация: python3 tools/render-edge/render_edge.py
#
# Per-site reverse-proxy для инстанса aromaflow-demo
# (project type: django-site).
# Backend-контейнер: aromaflow-demo-backend:8000
# ACME-вызовы (/.well-known/acme-challenge/) ожидаются в /var/www/acme.

server {
    listen 80;

    server_name _;


    # ACME http-01 challenge от Certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    # Reverse-proxy на backend-контейнер платформы.
    location / {
        proxy_pass http://aromaflow-demo-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }
}
