# СГЕНЕРИРОВАННЫЙ ФАЙЛ — не редактируйте вручную.
# Источник: services.yml + tools/render-compose/templates/telegram-client.yml.j2
# Стек: mycleanbot (project: mycleanbot, type: telegram-client)

services:
  mycleanbot-route:
    image: "${MYCLEANBOT_ROUTE_IMAGE:?set platform route image}"
    pull_policy: never
    container_name: mycleanbot-route
    cap_add: [NET_ADMIN]
    command:
      - /bin/sh
      - -ec
      - >-
        while true; do ip route replace
        172.30.8.10/32 via
        172.31.1.2;
        sleep 5; done
    ports:
      - "127.0.0.1:8040:8000"
    restart: unless-stopped
    networks:
      app:
        ipv4_address: 172.31.1.10

  mycleanbot-web:
    image: "${MYCLEANBOT_IMAGE:?set immutable MYCLEANBOT_IMAGE digest}"
    network_mode: service:mycleanbot-route
    env_file:
      - ./mycleanbot.env
      - ../../.env.mycleanbot.secrets
    depends_on:
      mycleanbot-redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/livez', timeout=10); urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=10)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  mycleanbot-worker:
    image: "${MYCLEANBOT_IMAGE:?set immutable MYCLEANBOT_IMAGE digest}"
    network_mode: service:mycleanbot-route
    command: ["python", "manage.py", "run_telegram_worker"]
    env_file:
      - ./mycleanbot.env
      - ../../.env.mycleanbot.secrets
    depends_on:
      mycleanbot-redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os; os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings'); import django; django.setup(); from datetime import timedelta; from django.utils import timezone; from core.models import WorkerHeartbeat; h=WorkerHeartbeat.objects.filter(name='telegram-supervisor').first(); assert h and h.updated_at >= timezone.now()-timedelta(seconds=45)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  mycleanbot-redis:
    image: docker.io/library/redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    network_mode: service:mycleanbot-route
    command:
      - redis-server
      - --bind
      - 127.0.0.1
      - --protected-mode
      - "yes"
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
      - --dir
      - /tmp
    depends_on:
      - mycleanbot-route
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 96m
    pids_limit: 64
    healthcheck:
      test: [CMD, redis-cli, -h, 127.0.0.1, ping]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

networks:
  app:
    external: true
    name: ai_service_app_vps1

volumes: {}
