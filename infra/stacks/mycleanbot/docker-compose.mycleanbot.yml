# СГЕНЕРИРОВАННЫЙ ФАЙЛ — не редактируйте вручную.
# Источник: services.yml + tools/render-compose/templates/telegram-client.yml.j2
# Стек: mycleanbot (project: mycleanbot, type: telegram-client)

services:
  mycleanbot-web:
    image: "${MYCLEANBOT_IMAGE:?set immutable MYCLEANBOT_IMAGE digest}"
    env_file:
      - ../../.env.mycleanbot
    ports:
      - "127.0.0.1:8040:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=10)"
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  mycleanbot-worker:
    image: "${MYCLEANBOT_IMAGE:?set immutable MYCLEANBOT_IMAGE digest}"
    command: ["python", "manage.py", "run_telegram_worker"]
    env_file:
      - ../../.env.mycleanbot
    healthcheck:
      test:
        - CMD
        - python
        - manage.py
        - check
      interval: 60s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes: {}
